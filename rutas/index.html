<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1f3a">
<!-- Que no aparezca en Google ni en ningun buscador: esto no es una pagina,
     es una herramienta interna. -->
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
<meta name="googlebot" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Rutas preventistas</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icono-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Mis rutas">
<link rel="stylesheet" href="estilo.css">
<style>
#alta{padding:26px 20px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#0d1f3a;max-width:420px;margin:0 auto}
#alta h1{font-size:21px;margin:0 0 6px}
#alta p{color:#536473;font-size:15px;line-height:1.45;margin:0 0 18px}
#alta input{width:100%;box-sizing:border-box;font-size:22px;padding:13px;border:2px solid #c8d2da;border-radius:10px;text-align:center;letter-spacing:2px;text-transform:uppercase;font-weight:700}
#alta button{width:100%;margin-top:12px;font-size:17px;font-weight:700;padding:14px;border:none;border-radius:10px;background:#0d1f3a;color:#fff;cursor:pointer}
#alta button:disabled{opacity:.5}
#aviso{margin-top:14px;font-size:15px;min-height:22px}
#aviso.mal{color:#b3261e;font-weight:600}
#aviso.bien{color:#1f6b3b;font-weight:600}
#cargando{padding:26px 20px;font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#536473;font-size:16px}
.oculto{display:none!important}
#barravieja{background:#fff5d6;border-bottom:1px solid #e3d08a;color:#6b5a12;font:600 13px/1.35 -apple-system,Segoe UI,Roboto,Arial,sans-serif;padding:8px 12px;text-align:center}
</style>
</head>
<body>
<div id="cargando">Abriendo&hellip;</div>

<div id="alta" class="oculto">
  <h1>Mis rutas</h1>
  <p>Pon&eacute; el c&oacute;digo que te pas&oacute; Mariano. Se pone una sola vez: despu&eacute;s la aplicaci&oacute;n abre sola y se actualiza sola.</p>
  <input id="cod" type="text" inputmode="text" autocapitalize="characters" autocomplete="off" spellcheck="false" placeholder="4-XXXXXXXX">
  <button id="entrar">Entrar</button>
  <div id="aviso"></div>
</div>

<div id="app"></div>
<script src="app.js"></script>
</body>
</html>
