<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5a4a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icono-192.png">
<title>MC Depósito</title>
<style>
:root{--bg:#f2f4f1;--card:#fff;--fg:#1c2420;--mut:#62706a;--ln:#d8ded9;--ac:#0f5a4a;--acs:#e0eee8;--warn:#b26b00;--bad:#b3362b;--ok:#1d7a46;
--nA:#d23b2f;--nB:#2f6fc4;--nC:#2f9a55;--nD:#d9a400;--nE:#8a949c;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font:18px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg)}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--ac);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 9px;display:flex;align-items:center;gap:8px}
.bar b{font-size:19.2px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr{background:none;border:0;color:#fff;font-size:28.8px;cursor:pointer;padding:0 6px;line-height:1}
.cola{font-size:13.8px;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;border:0;color:#fff;cursor:pointer}
.cola.rojo{background:#c0392b}
.cont{flex:1;overflow:auto;padding:12px;padding-bottom:20px}
.tabs{display:flex;border-top:1px solid var(--ln);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:7px 2px 9px;font-size:13.2px;color:var(--mut);cursor:pointer}
.tabs button i{display:block;font-style:normal;font-size:24px}
.tabs button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:15px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.big button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:14px 8px;font:inherit;font-size:16.8px;font-weight:600;cursor:pointer;text-align:center;color:var(--fg)}
.big button i{display:block;font-style:normal;font-size:33.6px;margin-bottom:4px}
.big button.w{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow-wrap:anywhere}.li>div[style*="text-align:right"]{flex:0 0 auto;max-width:48%}
.mut{color:var(--mut);font-size:15px}
.pill{border-radius:99px;padding:2px 8px;font-size:13.8px;font-weight:700;white-space:nowrap}
.p-ok{background:#e1f2e7;color:var(--ok)}.p-w{background:#fff1d9;color:var(--warn)}.p-b{background:#fbe3e0;color:var(--bad)}
.cod{font-family:ui-monospace,Consolas,monospace;font-weight:700}
.sign{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-weight:800;border:2px solid var(--fg);border-radius:6px;padding:1px 6px;font-size:15.6px;background:#fff;color:var(--fg)}
.grid{overflow-x:auto;padding-bottom:6px}
.grid table{border-collapse:separate;border-spacing:3px}
.grid td{min-width:34px;height:32px;border-radius:5px;text-align:center;font-size:13.2px;cursor:pointer;border:2px solid transparent;color:#fff;font-weight:700}
.grid td.lv{min-width:22px;cursor:default}
.grid td.vac{background:#eef1ee!important;border:2px dashed #c6ccc7;color:var(--mut)}
.grid td.sc{background:#fff!important;border:2px dotted #c6ccc7}
.grid td.aca{outline:3px solid #111;outline-offset:1px}
.grid td.bus{outline:3px solid #f0b400;outline-offset:1px}
.grid th{font-size:12px;color:var(--mut);font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:78%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;z-index:20}
.sheet.on{transform:none}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19;display:none}
.velo.on{display:block}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bt{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:9px 12px;font:inherit;font-size:16.8px;cursor:pointer;color:var(--fg)}
.bt.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bt.rojo{color:var(--bad)}
.bt:disabled{opacity:.5}
input.q,select.q,textarea.q{width:100%;font:inherit;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:#fff;color:var(--fg)}
textarea.q{min-height:64px}
label.lab{display:block;font-size:15px;color:var(--mut);margin:8px 0 3px}
.scan{border:2px dashed var(--ac);border-radius:14px;padding:14px;text-align:center;color:var(--ac);font-weight:700;margin-bottom:10px;cursor:pointer;background:var(--acs);width:100%;font:inherit;font-weight:700}
.bar2{height:8px;border-radius:4px;background:#e5e9e5;overflow:hidden;flex:1}
.bar2 i{display:block;height:100%}
.leg{display:flex;gap:8px;flex-wrap:wrap;font-size:13.8px;color:var(--mut);margin:6px 0}
.leg span{display:inline-flex;align-items:center;gap:4px}.leg b{width:12px;height:12px;border-radius:3px;display:inline-block}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:16.8px;background:var(--acs);color:var(--ok)}
.msg.mal{background:#fbe3e0;color:var(--bad)}
.res{max-height:300px;overflow:auto;border-top:1px solid var(--ln);margin-top:6px}
.res button{display:flex;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:9px 2px;font:inherit;cursor:pointer;color:var(--fg)}
.res button:hover{background:var(--acs)}
#cam{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{position:absolute;left:0;top:0;width:2px;height:2px;opacity:.01;pointer-events:none}
#cam canvas{flex:1;width:100%;min-height:0;display:block;background:#000}
#cam .camEst{position:absolute;bottom:76px;left:0;right:0;text-align:center;color:#ddd;font-size:13.8px;text-shadow:0 1px 2px #000;padding:0 10px}
#cam .camBar{padding:12px;display:flex;gap:8px;background:#111}
#cam .marco{position:absolute;left:12%;right:12%;top:35%;height:22%;border:3px solid #3fd18a;border-radius:12px;pointer-events:none}
#cam .camTxt{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}
.login{max-width:380px;margin:40px auto;padding:0 16px}
svg text{font-family:system-ui,Arial,sans-serif}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px}.chips button{flex:none;border:1px solid var(--ln);background:#fff;border-radius:20px;padding:8px 14px;font-weight:600;color:var(--mut);font-size:16px}.chips button.on{background:var(--fg);color:#fff;border-color:var(--fg)}.pulso{animation:pulso 1s infinite}@keyframes pulso{50%{opacity:.35}}input,select,textarea{font-size:max(16px,1em)!important}
</style></head><body>
<div id="app"></div>
<div class="velo" id="velo" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="cam"><video id="camV" playsinline muted autoplay></video><canvas id="camC"></canvas><div class="marco"></div><div class="camTxt" id="camT">Apuntá al código</div><div class="camEst" id="camE"></div>
 <div class="camBar"><button class="bt" style="flex:1" onclick="camCerrar()">Cancelar</button><button class="bt" style="flex:1" onclick="camOtra()">🔄 Otra cámara</button><label class="bt" style="flex:1;text-align:center">📷 Sacar foto<input type="file" accept="image/*" capture="environment" style="display:none" onchange="camFoto(this)"></label></div></div>

}

function aB64(txt){ var u = new TextEncoder().encode(txt), s = ""; for(var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function flush(aMano){
  if(FLUSH) return;
  var l = colaLeer(); if(!l.length){ if(aMano) pintar(); return; }
  if(!conectar()){ ULTERR = "no cargaron los programas de Google"; if(aMano) pintar(); return; }
  if(navigator.onLine === false){ ULTERR = "el teléfono está sin internet"; if(aMano) pintar(); return; }
  FLUSH = 1;
  try{
    await tope(sesion(), 20000, "entrar");
    while(l.length){
      var x = l[0], o = x.o;
      if(o.ft){
        var b = await fotoLeer(o.ft);
        if(b){ var ruta = "lam/DEPOSITO/" + (o.t === "recep" || o.t === "entrada" ? "REMITO" : "AVISO") + "/" + hoy() + "-" + YO + "-" + o.id + ".jpg";
          await tope(st.ref(ruta).put(b, {contentType:"image/jpeg"}), 60000, "foto"); o.fp = ruta; }
        try{ await fotoBorrar(o.ft); }catch(e){}
        delete o.ft; colaPoner(l);
      }
      var txt = JSON.stringify(o);
      try{
        await tope(db.collection("repo").doc(x.doc).set({v:APPID, b:aB64(txt), nf:o.fp ? 1 : 0, estado:"nuevo", ts:firebase.firestore.FieldValue.serverTimestamp(), fecha_carga:ahora()}), 30000, "mandar");
      }catch(em){
        var cd = String((em && (em.code || em.message)) || "");
        if(!(x.int && /permission|denied/i.test(cd) && x.e1 && !/permission|denied/i.test(x.e1))){ x.int = (x.int || 0) + 1; if(!x.e1) x.e1 = cd; colaPoner(l); throw em; }
      }
      l.shift(); colaPoner(l);
    }
    ULTERR = "";
  }catch(e){ ULTERR = String((e && (e.code || e.message)) || e); }
  FLUSH = 0;

}

var IDB = null;
function idb(){ return new Promise(function(res, rej){ if(IDB) return res(IDB); var r = indexedDB.open("mc_dep", 1); r.onupgradeneeded = function(){ r.result.createObjectStore("f"); }; r.onsuccess = function(){ IDB = r.result; res(IDB); }; r.onerror = function(){ rej(r.error); }; }); }

function fotoLeer(k){ return idb().then(function(d){ return new Promise(function(res){ var tx = d.transaction("f", "readonly"), rq = tx.objectStore("f").get(k); rq.onsuccess = function(){ res(rq.result || null); }; rq.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function fotoBorrar(k){ return idb().then(function(d){ return new Promise(function(res){ var tx = d.transaction("f", "readwrite"); tx.objectStore("f").delete(k); tx.oncomplete = res; tx.onerror = res; }); }); }
function achicar(file, max, q){
  return createImageBitmap(file).then(function(bm){ var e = Math.min(1, max / Math.max(bm.width, bm.height)), c = document.createElement("canvas"); c.width = Math.round(bm.width * e); c.height = Math.round(bm.height * e); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    return new Promise(function(res){ c.toBlob(function(b){ res(b || file); }, "image/jpeg", q); }); });
}

    + (err ? '<div class="msg mal" style="margin-top:10px">' + esc(err) + '</div>' : '') + '</div>'
    + '<p class="mut" style="text-align:center">En un teléfono Samsung instalá la app desde <b>Samsung Internet</b> (☰ → Añadir página a → Pantalla de inicio): en algunos, con Chrome, el escáner queda negro.</p></div>';
}
async function entrar(cod, callado){
  cod = String(cod || "").trim().toUpperCase();
  var id = idDeCodigo(cod), bl = BLOQUES.filter(function(b){ return String(b.v) === id; })[0];
  if(!bl){ if(!callado) pintarLogin("Ese código no es de esta app. Fijate que esté bien escrito (con el guión)."); return false; }
  try{
    var g = JSON.parse(await descifrar(b64bytes(bl.b), cod, id));
    CODIGO = cod; YO = id;
    var guard = datosGuardados();
    G = (guard && Number(guard.ver || 0) > Number(g.ver || 0) && guard.gen >= g.gen) ? guard : g;
    lsSet("dep_cod", cod); locLimpiar();
    VISTA = [["inicio"]]; pintar(); flush(); actualizar(1);
    return true;
  }catch(e){ if(!callado) pintarLogin("El código no abre. Fijate que esté bien escrito."); return false; }
}
function salir(){ if(colaLeer().length && !confirm("Todavía hay cosas sin mandar. Quedan guardadas en el teléfono. ¿Salir igual?")) return; lsDel("dep_cod"); G = null; CODIGO = ""; YO = ""; pintar(); }
window.addEventListener("online", function(){ flush(); });
document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible" && G){ flush(); actualizar(1); } });
setInterval(function(){ if(G) flush(); }, 90000);
try{ if("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js"); }catch(e){}
(function(){ var c = lsGet("dep_cod"); if(c) entrar(c, true).then(function(ok){ if(!ok) pintarLogin(); }); else pintarLogin(); })();
