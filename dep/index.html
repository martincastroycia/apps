<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f5a4a"><link rel="manifest" href="manifest.json"><link rel="icon" href="icono-192.png">
<title>MC Depósito</title>
<style>
:root{--bg:#f2f4f1;--card:#fff;--fg:#1c2420;--mut:#62706a;--ln:#d8ded9;--ac:#0f5a4a;--acs:#e0eee8;--warn:#b26b00;--bad:#b3362b;--ok:#1d7a46;
--nA:#d23b2f;--nB:#2f6fc4;--nC:#2f9a55;--nD:#d9a400;--nE:#8a949c;}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);font:15px/1.4 system-ui,"Segoe UI",Roboto,Arial,sans-serif;color:var(--fg)}
#app{display:flex;flex-direction:column;height:100%}
.bar{background:var(--ac);color:#fff;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 9px;display:flex;align-items:center;gap:8px}
.bar b{font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.atr{background:none;border:0;color:#fff;font-size:24px;cursor:pointer;padding:0 6px;line-height:1}
.cola{font-size:11.5px;background:rgba(255,255,255,.18);border-radius:99px;padding:3px 9px;border:0;color:#fff;cursor:pointer}
.cola.rojo{background:#c0392b}
.cont{flex:1;overflow:auto;padding:12px;padding-bottom:20px}
.tabs{display:flex;border-top:1px solid var(--ln);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{flex:1;border:0;background:none;padding:7px 2px 9px;font-size:11px;color:var(--mut);cursor:pointer}
.tabs button i{display:block;font-style:normal;font-size:20px}
.tabs button.on{color:var(--ac);font-weight:700}
.card{background:var(--card);border:1px solid var(--ln);border-radius:12px;padding:12px;margin-bottom:10px}
h3{margin:0 0 8px;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.big{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.big button{border:1px solid var(--ln);background:var(--card);border-radius:14px;padding:14px 8px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;text-align:center;color:var(--fg)}
.big button i{display:block;font-style:normal;font-size:28px;margin-bottom:4px}
.big button.w{grid-column:1/-1;background:var(--ac);color:#fff;border-color:var(--ac)}
.li{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--ln)}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0}
.mut{color:var(--mut);font-size:12.5px}
.pill{border-radius:99px;padding:2px 8px;font-size:11.5px;font-weight:700;white-space:nowrap}
.p-ok{background:#e1f2e7;color:var(--ok)}.p-w{background:#fff1d9;color:var(--warn)}.p-b{background:#fbe3e0;color:var(--bad)}
.cod{font-family:ui-monospace,Consolas,monospace;font-weight:700}
.sign{display:inline-block;font-family:ui-monospace,Consolas,monospace;font-weight:800;border:2px solid var(--fg);border-radius:6px;padding:1px 6px;font-size:13px;background:#fff;color:var(--fg)}
.grid{overflow-x:auto;padding-bottom:6px}
.grid table{border-collapse:separate;border-spacing:3px}
.grid td{min-width:34px;height:32px;border-radius:5px;text-align:center;font-size:11px;cursor:pointer;border:2px solid transparent;color:#fff;font-weight:700}
.grid td.lv{min-width:22px;cursor:default}
.grid td.vac{background:#eef1ee!important;border:2px dashed #c6ccc7;color:var(--mut)}
.grid td.sc{background:#fff!important;border:2px dotted #c6ccc7}
.grid td.aca{outline:3px solid #111;outline-offset:1px}
.grid td.bus{outline:3px solid #f0b400;outline-offset:1px}
.grid th{font-size:10px;color:var(--mut);font-weight:600}
.sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.2);max-height:78%;overflow:auto;padding:14px 14px calc(14px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s;z-index:20}
.sheet.on{transform:none}
.velo{position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:19;display:none}
.velo.on{display:block}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.bt{border:1px solid var(--ln);background:var(--card);border-radius:10px;padding:9px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--fg)}
.bt.pri{background:var(--ac);color:#fff;border-color:var(--ac);font-weight:600}
.bt.rojo{color:var(--bad)}
.bt:disabled{opacity:.5}
input.q,select.q,textarea.q{width:100%;font:inherit;border:1px solid var(--ln);border-radius:10px;padding:10px 12px;background:#fff;color:var(--fg)}
textarea.q{min-height:64px}
label.lab{display:block;font-size:12.5px;color:var(--mut);margin:8px 0 3px}
.scan{border:2px dashed var(--ac);border-radius:14px;padding:14px;text-align:center;color:var(--ac);font-weight:700;margin-bottom:10px;cursor:pointer;background:var(--acs);width:100%;font:inherit;font-weight:700}
.bar2{height:8px;border-radius:4px;background:#e5e9e5;overflow:hidden;flex:1}
.bar2 i{display:block;height:100%}
.leg{display:flex;gap:8px;flex-wrap:wrap;font-size:11.5px;color:var(--mut);margin:6px 0}
.leg span{display:inline-flex;align-items:center;gap:4px}.leg b{width:12px;height:12px;border-radius:3px;display:inline-block}
.msg{border-radius:10px;padding:10px 12px;margin-bottom:10px;font-size:14px;background:var(--acs);color:var(--ok)}
.msg.mal{background:#fbe3e0;color:var(--bad)}
.res{max-height:300px;overflow:auto;border-top:1px solid var(--ln);margin-top:6px}
.res button{display:flex;gap:8px;width:100%;text-align:left;border:0;border-bottom:1px solid var(--ln);background:none;padding:9px 2px;font:inherit;cursor:pointer;color:var(--fg)}
.res button:hover{background:var(--acs)}
#cam{position:fixed;inset:0;background:#000;z-index:40;display:none;flex-direction:column}
#cam.on{display:flex}
#cam video{flex:1;width:100%;object-fit:cover}
#cam .camBar{padding:12px;display:flex;gap:8px;background:#111}
#cam .marco{position:absolute;left:12%;right:12%;top:35%;height:22%;border:3px solid #3fd18a;border-radius:12px;pointer-events:none}
#cam .camTxt{position:absolute;top:calc(14px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #000}
.login{max-width:380px;margin:40px auto;padding:0 16px}
svg text{font-family:system-ui,Arial,sans-serif}
</style></head><body>

<div class="velo" id="velo" onclick="cerrarSheet()"></div>
<div class="sheet" id="sheet"></div>
<div id="cam"><video id="camV" playsinline muted autoplay></video><div class="marco"></div><div class="camTxt" id="camT">Apuntá al código</div>

/* ---------- cifrado (misma receta que las otras apps) ---------- */
function b64bytes(s){ var b = atob(s), u = new Uint8Array(b.length); for(var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
async function derivar(cod, id){
  var mat = await crypto.subtle.importKey("raw", new TextEncoder().encode(cod), "PBKDF2", false, ["deriveBits"]);
  var bits = await crypto.subtle.deriveBits({name:"PBKDF2", salt:new TextEncoder().encode(SAL + id), iterations:200000, hash:"SHA-256"}, mat, 256);
  return new Uint8Array(bits);
}
async function descifrar(bytes, cod, id){
  var kb = await derivar(cod, id);
  var key = await crypto.subtle.importKey("raw", kb, {name:"AES-GCM"}, false, ["decrypt"]);
  var gz = new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:bytes.subarray(1,13)}, key, bytes.subarray(13)));
  var stm = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new TextDecoder().decode(await new Response(stm).arrayBuffer());
}
function idDeCodigo(c){ var m = String(c || "").trim().toUpperCase().match(/^(\d+)\s*-/); return m ? m[1] : null; }

/* lo que cargó este teléfono y la oficina todavía no devolvió: se ve igual, encima del plano */
function locLeer(){ try{ return JSON.parse(lsGet(lsK("loc")) || "{}"); }catch(e){ return {}; } }
function locPoner(L){ lsSet(lsK("loc"), JSON.stringify(L)); }
function loc(){ var L = locLeer(); L.pos = L.pos || {}; L.E = L.E || {}; L.T = L.T || {}; L.Tn = L.Tn || []; return L; }
function locLimpiar(){
  /* lo que la oficina ya tiene (con la misma hora o más nueva) deja de hacer falta acá */
  var L = loc(), cambio = 0;
  Object.keys(L.pos).forEach(function(k){ var o = (G.P.pos || {})[k]; if(o && o.at && o.at >= L.pos[k].at){ delete L.pos[k]; cambio = 1; } });
  Object.keys(L.E).forEach(function(e){ if(((G.E || {})[e] || "") === (L.E[e] || "")){ delete L.E[e]; cambio = 1; } });
  Object.keys(L.T).forEach(function(id){ var t = (G.T || []).filter(function(x){ return x.id === id; })[0]; if(!t || t.ok){ delete L.T[id]; cambio = 1; } });
  L.Tn = L.Tn.filter(function(t){ return !(G.T || []).some(function(x){ return x.id === t.id; }); });
  if(cambio) locPoner(L);
}
function posDe(k){ var L = loc(); if(L.pos[k]) return L.pos[k]; return (G.P.pos || {})[k] || null; }
function eanDe(e){ var L = loc(); if(Object.prototype.hasOwnProperty.call(L.E, e)) return L.E[e] || ""; return (G.E || {})[e] || ""; }
function tareas(){
  var L = loc(), l = (G.T || []).concat(L.Tn);
  return l.map(function(t){ var o = Object.assign({}, t); if(L.T[t.id]) o.ok = L.T[t.id]; return o; });
}

/* ---------- el plano ---------- */
var RACKS = [["P1-I",1],["P1-D",2],["P2-I",3],["P2-D",4],["P3-I",5],["P3-D",6],["P4-I",7],["P4-D",8]];
var LV = ["A","B","C","D","E","F"], LVC = ["var(--nA)","var(--nB)","var(--nC)","var(--nD)","var(--nE)","#6b4fa3"];
var PISOL = {"PL":"P", "BE":"B", "LB-A":"L-A", "LB-B":"L-B", "LB-C":"L-C", "FO":"F"};
function lados(){ return (G.P.sides || []).concat(G.piso || []); }
function lado(k){ return lados().filter(function(s){ return s.k === k; })[0] || null; }
function nT(k){ var s = lado(k); if(!s) return 0; if(s.piso) return s.n; return Number((G.P.tramos || {})[k]) || s.n; }
function nN(k){ var s = lado(k); if(!s || s.piso || k === "FO") return 1; return Number((G.P.niv || {})[s.p]) || 4; }
function clave(k, t, n){ return k + "-" + String(t).padStart(2, "0") + "-" + n; }
function rackNum(k){ var r = RACKS.filter(function(x){ return x[0] === k; })[0]; return r ? r[1] : null; }
function cartel(k, t, n){
  var r = rackNum(k), tt = String(t).padStart(2, "0");
  if(r) return r + "-" + tt + "-" + LV[n-1];
  return (PISOL[k] || k) + "-" + tt;
}
function nomLado(k){ var r = rackNum(k), s = lado(k); if(r) return "Rack " + r + " · " + (s ? s.t.replace("Pasillo ", "P").replace(" · lado ", " ") : ""); return s ? s.t : k; }
/* leer lo que dice un cartel (o su QR) y volver a la clave interna */
function deCartel(txt){
  var s = sinT(txt).replace(/^MCDEP:/, "").replace(/\s+/g, "").trim();
  if(/^P\d-[ID]-\d+-\d+$/.test(s) || /^(FO|PL|BE|LB-[ABC])-\d+-\d+$/.test(s)){ var z = s.split("-"); var n = +z.pop(), t = +z.pop(); var k = z.join("-"); return lado(k) ? [k, t, n] : null; }
  var m = s.match(/^([1-8])-?(\d{1,2})-?([A-F])$/);
  if(m){ var k2 = RACKS[+m[1] - 1][0]; return [k2, +m[2], LV.indexOf(m[3]) + 1]; }
  m = s.match(/^(L-?[ABC]|P|B|F)-?(\d{1,2})$/);
  if(m){ var pre = m[1].replace("-", ""), k3 = {"LA":"LB-A","LB":"LB-B","LC":"LB-C","P":"PL","B":"BE","F":"FO"}[pre]; return k3 ? [k3, +m[2], 1] : null; }
  return null;
}
function nom(c){ return ((G.A || {})[c] || ["(no está en la lista)"])[0]; }
function fab(c){ return ((G.A || {})[c] || ["", ""])[1] || ""; }
function stk(c){ return (G.S || {})[c] || null; }
function stTxt(c){
  var z = stk(c); if(!z) return '<span class="mut">sin dato</span>';
  var d = z[1] > 0 ? Math.round(z[0] / z[1]) : null;
  return "<b>" + num(z[0]) + '</b> <span class="mut">u. aprox</span>' + (d !== null ? ' <span class="pill ' + (d < 20 ? "p-b" : d < 45 ? "p-w" : "p-ok") + '">' + d + " días</span>" : "");
}
function ocup(ks){
  var o = 0, l = 0, s = 0;
  ks.forEach(function(k){ for(var t = 1; t <= nT(k); t++) for(var n = 1; n <= nN(k); n++){ var p = posDe(clave(k,t,n)); if(!p) s++; else if((p.c || []).length) o++; else l++; } });
  return {o:o, l:l, s:s, t:o + l + s};
}

/* ---------- un rack (o un lugar del piso) de frente ---------- */
function vRack(k){
  var T = nT(k), N = nN(k), piso = N === 1 && !rackNum(k);

  var bus = BUSCA ? dondeEsta(BUSCA) : [];
  var h = '<div class="card"><div class="mut" style="margin-bottom:6px">' + (piso ? 'Cada casillero es un lugar del piso, el 01 es el de adelante.' : 'Como el cartel: tramo 01 adelante (a la izquierda), nivel A abajo.') + ' Tocá un casillero.</div><div class="grid"><table>';
  for(var n = N; n >= 1; n--){
    h += '<tr>' + (piso ? '' : '<td class="lv" style="background:' + LVC[n-1] + '">' + LV[n-1] + '</td>');
    for(var t = 1; t <= T; t++){
      var kk = clave(k, t, n), p = posDe(kk), aca = ACA && ACA[0] === k && ACA[1] === t && ACA[2] === n, b = bus.indexOf(kk) > -1;
      var cl = !p ? "sc" : !(p.c || []).length ? "vac" : "";
      h += '<td class="' + cl + (aca ? ' aca' : '') + (b ? ' bus' : '') + '" style="background:' + (piso ? '#c99a3a' : LVC[n-1]) + '" onclick="celda(\'' + k + '\',' + t + ',' + n + ')">' + (p && (p.c || []).length ? p.c.length : (p ? '' : '')) + '</td>';
    }

  h += '</tr></table></div><div class="leg"><span><b style="background:var(--nB)"></b>con mercadería (el número = artículos)</span><span><b style="background:#eef1ee;border:1px dashed #aaa"></b>libre</span><span><b style="background:#fff;border:1px dotted #aaa"></b>sin cargar</span>' + (bus.length ? '<span><b style="background:#fff;outline:2px solid #f0b400"></b>donde está lo que buscás</span>' : '') + '</div></div>';

function celda(k, t, n){

  if(ACA && ACA[0] === k && ACA[1] === t && ACA[2] === n) h += '<div class="pill p-ok" style="display:inline-block;margin-top:8px">📍 Estás acá</div>';

     + '<button class="bt" onclick="avisarEn(' + js(kk) + ')">⚠️ Avisar</button></div>';

/* ---------- cargar / sacar en un lugar ---------- */

function resArt(q, idRes, fn){
  var el = $(idRes); if(!el) return;
  var s = sinT(q).trim(), pal = s.split(/\s+/).filter(Boolean);
  if(!pal.length){ el.innerHTML = ""; return; }
  var A = G.A || {}, l = Object.keys(A).filter(function(c){ var t = c + " " + sinT(A[c][0] + " " + A[c][1]); return pal.every(function(p){ return t.indexOf(p) > -1; }); });
  l.sort(function(a, b){ return (/^-/.test(A[a][0]) - /^-/.test(A[b][0])) || (a === s ? -1 : b === s ? 1 : 0) || A[a][0].localeCompare(A[b][0]); });
  el.innerHTML = l.slice(0, 40).map(function(c){ return '<button onclick="' + fn + '(' + js(c) + ')"><span class="cod" style="min-width:64px">' + esc(c) + '</span><span>' + esc(A[c][0]) + '<br><span class="mut">' + esc(A[c][1]) + '</span></span></button>'; }).join("") + (l.length > 40 ? '<div class="mut" style="padding:6px">Hay ' + l.length + '; escribí algo más.</div>' : '') + (!l.length ? '<div class="mut" style="padding:6px">No hay artículos con eso.</div>' : '');
}
function dondeEsta(c){
  var out = {}, P = G.P.pos || {}, L = loc();
  Object.keys(P).forEach(function(k){ if(!L.pos[k] && (P[k].c || []).indexOf(c) > -1) out[k] = 1; });
  Object.keys(L.pos).forEach(function(k){ if((L.pos[k].c || []).indexOf(c) > -1) out[k] = 1; });
  return Object.keys(out).sort(function(a, b){ return (+a.split("-").pop()) - (+b.split("-").pop()) || (a < b ? -1 : 1); });
}

/* ---------- escáner: cámara en vivo, foto o a mano ---------- */
var DET = null, CAMS = null, CAMFN = null, CAMTIMER = null, CAMQR = 0;
async function detector(){
  if(DET !== null) return DET;
  DET = false;
  try{ if("BarcodeDetector" in window){ var f = await BarcodeDetector.getSupportedFormats();
    var w = ["ean_13","ean_8","upc_a","upc_e","itf","code_128","code_39","qr_code"].filter(function(x){ return f.indexOf(x) > -1; });
    if(w.length) DET = new BarcodeDetector({formats:w}); } }catch(e){ DET = false; }
  return DET;
}
async function camAbrir(qr, fn, texto){
  CAMFN = fn; CAMQR = qr ? 1 : 0;
  var d = await detector();
  if(!d){ var t = prompt(qr ? "Este teléfono no lee códigos con la cámara. Escribí el cartel (ej. 7-06-C):" : "Este teléfono no lee códigos con la cámara. Escribí los números del código de barras:"); if(t) camResultado(t); return; }
  CAMTXT = texto || "Apuntá al código";
  $("camT").textContent = CAMTXT;
  $("cam").classList.add("on");
  try{
    await camPrender(lsGet("dep_cam") || "");
    var v = $("camV"), d2 = d;
    var ocupado = false;
    CAMTIMER = setInterval(async function(){
      if(ocupado || !CAMS) return; ocupado = true;
      try{ var r = await d.detect(v); var x = r.filter(function(z){ return CAMQR ? true : z.format !== "qr_code"; })[0]; if(x){ var val = x.rawValue; camCerrar(); camResultado(val); } }catch(e){}
      ocupado = false;
    }, 250);
  }catch(e){ if(!/no da imagen|sin cámara/.test(String(e && e.message))) $("camT").textContent = "No se pudo abrir la cámara (" + ((e && e.name) || "") + "): tocá «Sacar foto»"; }
}
/* v249: [stated] 7/11/2026 foto del Samsung con la camara en negro. Algunos Samsung, con «la de atras»,
   abren una camara que no da imagen (gran angular o de profundidad). Ahora se prueba cada camara de atras
   hasta que una de imagen de verdad, se recuerda la que anduvo, y queda el boton «Otra camara». */
var CAMTXT = "", CAMLISTA = [], CAMI = 0;
async function camAbrirUna(dev){
  var c = dev ? {deviceId:{exact:dev}} : {facingMode:{ideal:"environment"}};
  c.width = {ideal:1280}; c.height = {ideal:720};
  var s = await navigator.mediaDevices.getUserMedia({video:c, audio:false});
  var v = $("camV"); v.srcObject = s;
  try{ await v.play(); }catch(e){}
  /* esperar a que llegue imagen: hasta 2,5 s */
  for(var i = 0; i < 25 && !(v.videoWidth > 0 && v.readyState >= 2); i++) await new Promise(function(r){ setTimeout(r, 100); });
  if(!(v.videoWidth > 0)){ s.getTracks().forEach(function(t){ t.stop(); }); throw new Error("esa cámara no da imagen"); }
  return s;
}
async function camPrender(pref){
  try{ (CAMS && CAMS.getTracks() || []).forEach(function(t){ t.stop(); }); }catch(e){}
  CAMS = null;
  var probar = [];
  if(pref) probar.push(pref);
  probar.push("");
  try{
    var ds = (await navigator.mediaDevices.enumerateDevices()).filter(function(x){ return x.kind === "videoinput"; });
    var atras = ds.filter(function(x){ return /back|rear|tr[aá]s|environment/i.test(x.label || ""); });
    CAMLISTA = (atras.length ? atras : ds).map(function(x){ return x.deviceId; }).concat(ds.map(function(x){ return x.deviceId; }));
    CAMLISTA.forEach(function(id){ if(id && probar.indexOf(id) < 0) probar.push(id); });
  }catch(e){}
  var ult = null;
  for(var i = 0; i < probar.length; i++){
    try{ CAMS = await camAbrirUna(probar[i]);
      var tr = CAMS.getVideoTracks()[0], st = tr && tr.getSettings ? tr.getSettings() : {};
      if(st.deviceId) lsSet("dep_cam", st.deviceId);
      $("camT").textContent = CAMTXT; return; }
    catch(e){ ult = e; }
  }
  $("camT").textContent = "La cámara no da imagen: tocá «Otra cámara» o «Sacar foto»";
  throw ult || new Error("sin cámara");
}
async function camOtra(){
  var ids = []; CAMLISTA.forEach(function(id){ if(id && ids.indexOf(id) < 0) ids.push(id); });
  if(!ids.length){ try{ ids = (await navigator.mediaDevices.enumerateDevices()).filter(function(x){ return x.kind === "videoinput"; }).map(function(x){ return x.deviceId; }); }catch(e){} }
  if(!ids.length) return;
  CAMI = (CAMI + 1) % ids.length;
  $("camT").textContent = "Probando la cámara " + (CAMI + 1) + " de " + ids.length + "…";
  try{ (CAMS && CAMS.getTracks() || []).forEach(function(t){ t.stop(); }); }catch(e){}
  try{ CAMS = await camAbrirUna(ids[CAMI]); lsSet("dep_cam", ids[CAMI]); $("camT").textContent = CAMTXT + " (cámara " + (CAMI + 1) + ")"; }
  catch(e){ $("camT").textContent = "La cámara " + (CAMI + 1) + " no da imagen: probá otra"; }
}
function camCerrar(){ clearInterval(CAMTIMER); CAMTIMER = null; try{ (CAMS && CAMS.getTracks() || []).forEach(function(t){ t.stop(); }); }catch(e){} CAMS = null; $("cam").classList.remove("on"); }
async function camFoto(inp){
  var f = inp.files && inp.files[0]; inp.value = ""; if(!f) return;
  var d = await detector(); camCerrar();
  try{ var bmp = await createImageBitmap(f); var r = await d.detect(bmp); var x = r.filter(function(z){ return CAMQR ? true : z.format !== "qr_code"; })[0];
    if(x) camResultado(x.rawValue); else { var t = prompt("No encontré el código en la foto. Escribilo:"); if(t) camResultado(t); } }
  catch(e){ var t2 = prompt("No pude leer la foto. Escribí el código:"); if(t2) camResultado(t2); }

function camResultado(val){ var fn = CAMFN; CAMFN = null; if(fn) fn(String(val || "").trim()); }

function conectar(){
  if(db) return true;
  try{ if(typeof firebase === "undefined") return false; try{ firebase.app(); }catch(e){ firebase.initializeApp(FBCFG); } db = firebase.firestore(); st = firebase.storage(); return true; }catch(e){ return false; }
}
function sesion(){ if(AUTHP) return AUTHP; AUTHP = (async function(){ try{ if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }catch(e){ AUTHP = null; throw e; } })(); return AUTHP; }
function tope(pr, ms, que){ return Promise.race([pr, new Promise(function(_, rej){ setTimeout(function(){ rej(new Error("tardó demasiado (" + que + ")")); }, ms); })]); }
function aB64(txt){ var u = new TextEncoder().encode(txt), s = ""; for(var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
async function flush(aMano){
  if(FLUSH) return;
  var l = colaLeer(); if(!l.length){ if(aMano) pintar(); return; }
  if(!conectar()){ ULTERR = "no cargaron los programas de Google"; if(aMano) pintar(); return; }
  if(navigator.onLine === false){ ULTERR = "el teléfono está sin internet"; if(aMano) pintar(); return; }
  FLUSH = 1;
  try{
    await tope(sesion(), 20000, "entrar");
    while(l.length){
      var x = l[0], o = x.o;
      if(o.ft){
        var b = await fotoLeer(o.ft);
        if(b){ var ruta = "lam/DEPOSITO/" + (o.t === "recep" ? "REMITO" : "AVISO") + "/" + hoy() + "-" + YO + "-" + o.id + ".jpg";
          await tope(st.ref(ruta).put(b, {contentType:"image/jpeg"}), 60000, "foto"); o.fp = ruta; }
        try{ await fotoBorrar(o.ft); }catch(e){}
        delete o.ft; colaPoner(l);
      }
      var txt = JSON.stringify(o);
      try{
        await tope(db.collection("repo").doc(x.doc).set({v:APPID, b:aB64(txt), nf:o.fp ? 1 : 0, estado:"nuevo", ts:firebase.firestore.FieldValue.serverTimestamp(), fecha_carga:ahora()}), 30000, "mandar");
      }catch(em){
        var cd = String((em && (em.code || em.message)) || "");
        if(!(x.int && /permission|denied/i.test(cd) && x.e1 && !/permission|denied/i.test(x.e1))){ x.int = (x.int || 0) + 1; if(!x.e1) x.e1 = cd; colaPoner(l); throw em; }
      }
      l.shift(); colaPoner(l);
    }
    ULTERR = "";
  }catch(e){ ULTERR = String((e && (e.code || e.message)) || e); }
  FLUSH = 0;
  pintar();
}
/* fotos esperando: en IndexedDB, no se pierden aunque se cierre la app */
var IDB = null;
function idb(){ return new Promise(function(res, rej){ if(IDB) return res(IDB); var r = indexedDB.open("mc_dep", 1); r.onupgradeneeded = function(){ r.result.createObjectStore("f"); }; r.onsuccess = function(){ IDB = r.result; res(IDB); }; r.onerror = function(){ rej(r.error); }; }); }
function fotoGuardar(k, b){ return idb().then(function(d){ return new Promise(function(res, rej){ var tx = d.transaction("f", "readwrite"); tx.objectStore("f").put(b, k); tx.oncomplete = res; tx.onerror = function(){ rej(tx.error); }; }); }); }
function fotoLeer(k){ return idb().then(function(d){ return new Promise(function(res){ var tx = d.transaction("f", "readonly"), rq = tx.objectStore("f").get(k); rq.onsuccess = function(){ res(rq.result || null); }; rq.onerror = function(){ res(null); }; }); }).catch(function(){ return null; }); }
function fotoBorrar(k){ return idb().then(function(d){ return new Promise(function(res){ var tx = d.transaction("f", "readwrite"); tx.objectStore("f").delete(k); tx.oncomplete = res; tx.onerror = res; }); }); }
function achicar(file, max, q){
  return createImageBitmap(file).then(function(bm){ var e = Math.min(1, max / Math.max(bm.width, bm.height)), c = document.createElement("canvas"); c.width = Math.round(bm.width * e); c.height = Math.round(bm.height * e); c.getContext("2d").drawImage(bm, 0, 0, c.width, c.height);
    return new Promise(function(res){ c.toBlob(function(b){ res(b || file); }, "image/jpeg", q); }); });
}

/* ---------- lo nuevo de la oficina: la oficina deja el paquete en flotadatos/dep<id> ---------- */
async function actualizar(callado){
  if(!conectar()) return false;
  try{
    await tope(sesion(), 20000, "entrar");
    var d = await tope(db.collection(COLD).doc("dep" + YO).get(), 20000, "bajar");
    if(!d || !d.exists) return false;
    var dd = d.data() || {}; if(!dd.b) return false;
    if(Number(dd.ver || 0) <= Number(G.ver || 0)){ if(!callado){ aviso("Ya tenés lo último de la oficina."); pintar(); } return false; }
    var g = JSON.parse(await descifrar(b64bytes(dd.b), CODIGO, YO));
    if(!g || !g.P) return false;
    G = g; datosGuardar(g); locLimpiar();
    if(!callado) aviso("Llegó lo nuevo de la oficina.");
    pintar(); return true;
  }catch(e){ if(!callado){ aviso("No se pudo traer lo nuevo: " + esc(e.message || e), 1); pintar(); } return false; }
}

(function(){ var c = lsGet("dep_cod"); if(c) entrar(c, true).then(function(ok){ if(!ok) pintarLogin(); }); else pintarLogin(); })();
