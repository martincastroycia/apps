<!DOCTYPE html>
<html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Flota — Martín Castro y Cía.</title>
<meta name="theme-color" content="#0E5A9B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Flota">
<style>
:root{--marca:#0E5A9B;--tinta:#0D1F3A;--gris:#65726b;--linea:#dfe5ea;--fondo:#f4f6f8}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--tinta);background:var(--fondo)}
header{background:var(--marca);color:#fff;padding:12px 14px;position:sticky;top:0;z-index:10}
header b{font-size:17px}
header .sub{font-size:12.5px;opacity:.85}
main{padding:12px 12px 90px;max-width:640px;margin:0 auto}
.caja{background:#fff;border:1px solid var(--linea);border-radius:12px;padding:14px;margin-bottom:12px}
label{display:block;font-size:13px;font-weight:600;color:var(--gris);margin:10px 0 3px}
input,select,textarea{width:100%;padding:11px 12px;font-size:17px;border:1px solid #c9d2da;border-radius:9px;background:#fff;color:var(--tinta)}
input:focus,select:focus{outline:2px solid var(--marca);outline-offset:-1px}
button{font:inherit;font-weight:700;border-radius:9px;border:1px solid var(--marca);padding:12px 16px;cursor:pointer}
.prim{background:var(--marca);color:#fff;width:100%;font-size:17px}
.sec{background:#fff;color:var(--marca)}
.chico{font-size:13px;padding:8px 12px}
.nota{font-size:13px;color:var(--gris);line-height:1.45}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1;background:#fff;color:var(--marca);border-color:#c9d2da}
.tabs button.on{background:var(--marca);color:#fff;border-color:var(--marca)}
.aviso{border-radius:9px;padding:10px 12px;font-size:14px;margin:10px 0}
.amar{background:#fff5d6;border:1px solid #e3d08a;color:#6b5a12}
.roj{background:#fbe4e4;border:1px solid #e0a8a8;color:#a3282f}
.ver{background:#e3f0e3;border:1px solid #a9c9a9;color:#1f6b3b}
.fila{display:flex;gap:8px;align-items:center}
.fila>*{flex:1}
.fila .angosto{flex:0 0 auto;width:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
td,th{padding:6px 4px;border-bottom:1px solid var(--linea);text-align:left}
.der{text-align:right}
#malAbierta{position:fixed;inset:0;background:#a3282f;color:#fff;z-index:99;display:none;flex-direction:column;
  align-items:center;justify-content:center;padding:24px;text-align:center;gap:14px}
#malAbierta b{font-size:22px}
#malLink{background:#fff;color:#a3282f;padding:10px;border-radius:8px;word-break:break-all;font-size:14px}
.oculto{display:none!important}
.mini{max-width:110px;border-radius:8px;border:1px solid var(--linea)}
</style></head><body>

<div id="malAbierta">
  <b>Así no va a funcionar</b>
  <div>Estás abriendo la app como archivo. Tiene que abrirse desde el link, con Chrome.</div>
  <div id="malLink"></div>
  <button class="sec" id="malCopiar">Copiar el link</button>
  <button class="sec" id="malSeguir">Seguir igual</button>
</div>

<header><b>Flota — Martín Castro y Cía.</b><div class="sub" id="subT">Depósito</div></header>
<main>

<div id="pAlta" class="caja">
  <b>Poné tu código</b>
  <div class="nota" style="margin:6px 0 10px">Te lo da Mariano. Se pide una sola vez en este teléfono.</div>
  <input type="text" id="inCod" placeholder="900-XXXXXXXX" autocapitalize="characters" autocomplete="off">
  <div id="avAlta" class="nota" style="margin:8px 0"></div>
  <button class="prim" id="btEntrar">Entrar</button>
</div>

<div id="pApp" class="oculto">
  <div id="colaCartel"></div>

  <div id="alertaVenc"></div>

  <div class="tabs" id="lasTabs">
    <button id="tbCom" class="on">⛽ Combustible</button>
    <button id="tbGas">🔧 Mantenimiento</button>
    <button id="tbVen">⚠️ Vencimientos</button>
  </div>

  <div id="cCom" class="caja">
    <label for="cvV">Vehículo</label>
    <select id="cvV"></select>
    <div id="cvUlt" class="nota" style="margin-top:4px"></div>
    <label for="cvF">Fecha</label>
    <input type="date" id="cvF">
    <label for="cvKm">Odómetro (los kilómetros que marca)</label>
    <input type="number" id="cvKm" inputmode="numeric" placeholder="por ejemplo 248500">
    <label for="cvL">Litros que le puse</label>
    <input type="number" id="cvL" inputmode="decimal" step="0.01" placeholder="por ejemplo 120">
    <div id="cvAviso"></div>
    <div style="margin-top:12px"><button class="prim" id="btCom">Guardar la carga</button></div>
  </div>

  <div id="cGas" class="caja oculto">
    <label for="gvV">Vehículo</label>
    <select id="gvV"></select>
    <label for="gvF">Fecha</label>
    <input type="date" id="gvF">
    <label for="gvC">Qué fue</label>
    <select id="gvC"></select>
    <div id="gvKmCaja" class="oculto">
      <label for="gvKm">Odómetro (con cuántos km se lo hiciste)</label>
      <input type="number" id="gvKm" inputmode="numeric" placeholder="por ejemplo 248500">
    </div>
    <label for="gvD">Detalle</label>
    <input type="text" id="gvD" placeholder="qué le hiciste, qué compraste, dónde">
    <label for="gvI">Importe</label>
    <input type="number" id="gvI" inputmode="decimal" step="0.01" placeholder="$">
    <label for="gvFoto">Foto del ticket (opcional)</label>
    <input type="file" id="gvFoto" accept="image/*">
    <div id="gvFotoV" style="margin-top:8px"></div>
    <div style="margin-top:12px"><button class="prim" id="btGas">Guardar el gasto</button></div>
  </div>

  <div id="cVen" class="caja oculto">
    <div class="fila" style="margin-bottom:8px">
      <select id="vnFiltro" class="angosto" style="width:auto;flex:1">
        <option value="60">Los próximos 60 días</option>
        <option value="30">Los próximos 30 días</option>
        <option value="0">Solo los vencidos</option>
        <option value="9999">Todos</option>
      </select>
    </div>
    <input type="text" id="vnQ" placeholder="Buscar vehículo, patente o persona" style="margin-bottom:8px">
    <div id="vnLista"></div>
  </div>

  <div class="caja" id="cHist">
    <b>Lo que cargaste</b>
    <div id="hist" class="nota" style="margin-top:8px">Todavía no cargaste nada.</div>
  </div>

  <div class="caja">
    <button class="sec chico" id="btProbar">🔎 Probar la conexión con la oficina</button>
    <button class="sec chico" id="btSalir" style="margin-left:6px">Salir</button>
    <div id="diag" class="nota" style="margin-top:10px"></div>
  </div>
</div>

</main>

/* ===== Flota — app del encargado de depósito =========================
   Una sola persona carga combustible del tanque propio y gastos de todos
   los vehículos. Mismo mecanismo que la app de cobranza: el dato viaja
   CIFRADO con el código de esa persona, se guarda primero en el teléfono
   y sale cuando hay señal. La oficina lo ve en el buzón del programa.   */

var SAL = 'castro-flota:';
var COLECCION = 'flota';
var LS_COD = 'castro_flota_cod';
var LS_ULT = 'castro_flota_ult';
var LS_HIST = 'castro_flota_hist';
var LS_DAT = 'castro_flota_dat';

var CODIGO = '', VNUM = '', G = null, db = null, st = null, AUTHP = null, IDB = null;
var COLA = [], FLUSHING = false, COLAMSG = '', ULTERR = '';
var TAB = 'com', FOTO = null, ULT = {}, SOLOVER = false;

function $(id){ return document.getElementById(id); }
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }
function hoyISO(){ var d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function fcorta(iso){ if(!iso) return ''; return iso.slice(8,10)+'/'+iso.slice(5,7)+'/'+iso.slice(2,4); }
function numAR(n){ return Number(n||0).toLocaleString('es-AR'); }
function money(n){ return '$ ' + Math.round(Number(n)||0).toLocaleString('es-AR'); }
function esc(t){ return String(t==null?'':t).replace(/[&<>"]/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function nuevoId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

/* ---- se abrió como archivo en vez de por el link ---- */
function abiertaMal(){
  try{
    var pr = String(location.protocol||'');
    if(pr === 'https:') return false;
    if(pr === 'http:' && /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return false;
    return true;
  }catch(e){ return false; }
}

/* ---- cifrado: misma receta que cobranza ---- */
function b64bytes(s){ var b=atob(s), u=new Uint8Array(b.length); for(var i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; }
async function gzipear(txt){
  var cs=new CompressionStream('gzip');
  var stm=new Blob([new TextEncoder().encode(txt)]).stream().pipeThrough(cs);
  return new Uint8Array(await new Response(stm).arrayBuffer());
}
async function derivar(cod,id){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(SAL+id),iterations:200000,hash:'SHA-256'},mat,256);
  return new Uint8Array(bits);
}
async function cifrar(txt,cod,id){
  var kb=await derivar(cod,id);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['encrypt']);
  var gz=await gzipear(txt);
  var sem=new Uint8Array(kb.length+gz.length); sem.set(kb,0); sem.set(gz,kb.length);
  var iv=new Uint8Array(await crypto.subtle.digest('SHA-256',sem)).subarray(0,12);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,gz));
  var out=new Uint8Array(1+12+ct.length); out[0]=1; out.set(iv,1); out.set(ct,13);
  var s2=''; for(var i=0;i<out.length;i++) s2+=String.fromCharCode(out[i]);
  return btoa(s2);
}
async function descifrar(bytes,cod,id){
  var kb=await derivar(cod,id);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']);
  var gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(1,13)},key,bytes.subarray(13)));
  var stm=new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'));
  return new TextDecoder().decode(await new Response(stm).arrayBuffer());
}
function idDeCodigo(cod){ var m=String(cod||'').trim().toUpperCase().match(/^(\d+)\s*-/); return m?m[1]:null; }

/* ---- Firebase ---- */
function conectarFB(){
  if(db) return true;
  try{
    if(typeof firebase === 'undefined') return false;
    try{ firebase.app(); }catch(e){ firebase.initializeApp(firebaseConfig); }
    db = firebase.firestore(); st = firebase.storage();
    sesion().catch(function(){});
    return true;
  }catch(e){ return false; }
}
function sesion(){
  if(AUTHP) return AUTHP;
  AUTHP = (async function(){
    try{ if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }
    catch(e){ AUTHP=null; throw e; }
  })();
  return AUTHP;
}
function conTope(pr, ms, que){
  return Promise.race([pr, new Promise(function(_,rej){ setTimeout(function(){ rej(new Error('tardó demasiado ('+que+')')); }, ms); })]);
}

/* ---- la cola: primero el teléfono, después la nube ---- */
function idbAbrir(){
  return new Promise(function(res,rej){
    if(IDB) return res(IDB);
    if(typeof indexedDB === 'undefined') return rej(new Error('sin indexedDB'));
    var r=indexedDB.open('castro_flota',1);
    r.onupgradeneeded=function(){ var d=r.result; if(!d.objectStoreNames.contains('pend')) d.createObjectStore('pend',{keyPath:'id'}); };
    r.onsuccess=function(){ IDB=r.result; res(IDB); };
    r.onerror=function(){ rej(r.error||new Error('idb')); };
  });
}
function idbTx(modo, fn){
  return idbAbrir().then(function(d){
    return new Promise(function(res,rej){
      var tx=d.transaction('pend',modo), st2=tx.objectStore('pend'), req=fn(st2);
      tx.oncomplete=function(){ res(req && ('result' in req) ? req.result : null); };
      tx.onerror=function(){ rej(tx.error||new Error('tx')); };
    });
  });
}
function colaLeer(){ return idbTx('readonly',function(s){ return s.getAll(); }).then(function(l){ COLA=l||[]; return COLA; }).catch(function(){ COLA=[]; return COLA; }); }
function colaGuardar(o){ return idbTx('readwrite',function(s){ return s.put(o); }); }
function colaSacar(id){ return idbTx('readwrite',function(s){ return s.delete(id); }); }

/* ---- historial local, para que vea lo que ya cargó ---- */
function histLeer(){ try{ return JSON.parse(lsGet(LS_HIST)||'[]'); }catch(e){ return []; } }
function histAgregar(o){ var l=histLeer(); l.unshift(o); if(l.length>60) l=l.slice(0,60); lsSet(LS_HIST, JSON.stringify(l)); }


/* ---- último odómetro conocido de cada vehículo ----
   Sale de lo que mandó la oficina y se va corrigiendo con lo que carga él
   en este teléfono, así el aviso sirve aunque la oficina no haya bajado
   todavía las cargas de esta semana. */
function ultLeer(){ try{ return JSON.parse(lsGet(LS_ULT)||'{}'); }catch(e){ return {}; } }
function ultPoner(vid, km, fe){
  var U = ultLeer();
  if(!U[vid] || km > U[vid].km){ U[vid] = {km:km, fe:fe}; lsSet(LS_ULT, JSON.stringify(U)); }
  ULT = U;
}
function ultDe(vid){
  var U = ULT || {}, del = U[vid];
  var base = null;
  (G && G.veh || []).forEach(function(v){ if(String(v.id) === String(vid) && v.km > 0) base = {km:v.km, fe:v.fe||''}; });
  if(del && base) return del.km >= base.km ? del : base;
  return del || base;
}
function vehDe(id){ var r=null; (G && G.veh || []).forEach(function(v){ if(String(v.id)===String(id)) r=v; }); return r; }
function nomVeh(id){ var v=vehDe(id); if(!v) return id; return v.nom + (v.pat ? ' · ' + v.pat : ''); }

/* ---- el aviso del kilometraje, igual que en el programa ---- */
function avisoKm(vid, km){
  var v = vehDe(vid);
  if(!v || v.sinkm) return '';
  if(!km) return 'Sin el odómetro, esta carga no entra en el promedio de consumo.';
  var u = ultDe(vid);
  if(!u) return '';
  var d = km - u.km, ant = numAR(u.km), f = u.fe ? (' el ' + fcorta(u.fe)) : '';
  if(d < 0) return 'El odómetro BAJÓ: venía en ' + ant + ' km' + f + ' y estás poniendo ' + numAR(km) + '.';
  if(d === 0) return 'Es el MISMO odómetro que la vez pasada (' + ant + ' km). ¿Lo copiaste sin querer?';
  var med = Number(v.salto) || 0;
  if(med > 0 && d > med * 4) return 'Son ' + numAR(d) + ' km desde la última carga, cuando lo normal en este vehículo son unos ' + numAR(Math.round(med)) + '. Fijate que no le sobre un dígito.';
  if(med > 0 && d < med * 0.15) return 'Son apenas ' + numAR(d) + ' km desde la última carga (venía en ' + ant + f + ').';
  if(d > 20000) return 'Son ' + numAR(d) + ' km de golpe. Fijate el número.';
  return '';
}

/* ---- foto: se achica antes de subir ---- */
function achicarFoto(file){
  return new Promise(function(res){
    try{
      if(!file || !/^image\//.test(file.type||'')) return res(file);
      if(typeof createImageBitmap === 'function'){
        return createImageBitmap(file).then(function(bm){
          try{
            var MAX=1400, w=bm.width, h=bm.height;
            var e2=Math.min(1, MAX/Math.max(w,h)), cw=Math.max(1,Math.round(w*e2)), ch=Math.max(1,Math.round(h*e2));
            var cv=document.createElement('canvas'); cv.width=cw; cv.height=ch;
            cv.getContext('2d').drawImage(bm,0,0,cw,ch); try{ bm.close(); }catch(e){}
            return new Promise(function(r2){ cv.toBlob(function(b){ r2(b||file); },'image/jpeg',0.62); }).then(res);
          }catch(e){ return res(file); }
        }, function(){ res(file); });
      }
      res(file);
    }catch(e){ res(file); }
  });
}

/* ---- mandar lo que está en la cola ---- */
async function flush(){
  if(FLUSHING) return;
  await colaLeer();
  if(!COLA.length){ pintarCola(); return; }
  if(!conectarFB()){
    ULTERR = 'no cargaron los programas de Google';
    COLAMSG = '<b>Sin conexión con la oficina.</b> Tocá «Probar la conexión» acá abajo.';
    pintarCola(); return;
  }
  if(typeof navigator !== 'undefined' && navigator.onLine === false){ COLAMSG = 'El teléfono está sin internet.'; pintarCola(); return; }
  FLUSHING = true; COLAMSG = ''; pintarCola();
  try{
    await conTope(sesion(), 20000, 'entrar');
    var lista = COLA.slice();
    for(var i=0;i<lista.length;i++){
      var o = lista[i];
      o.intentos = (o.intentos||0) + 1;
      try{ await colaGuardar(o); }catch(e){}
      var fotoURL=null, fotoPath=null;
      if(!o.foto && o.fotoTxt){
        try{
          var pr=String(o.fotoTxt).split(','), bin=atob(pr[1]||''), u8=new Uint8Array(bin.length);
          for(var q=0;q<bin.length;q++) u8[q]=bin.charCodeAt(q);
          o.foto=new Blob([u8],{type:(/data:([^;]+)/.exec(pr[0])||[,'image/jpeg'])[1]});
        }catch(e){}
      }
      /* La foto va a la base de datos, NO a Storage. Firebase empezo a cobrar
         Storage en los proyectos nuevos y no vale la pena por una foto de
         100 KB: entra de sobra en un documento (el tope es 1 MB). Va en un
         documento APARTE para que el buzon pueda listar las cargas sin
         bajarse todas las fotos. */
      if(o.foto && !o.fotoTxt){
        try{
          o.fotoTxt = await new Promise(function(res,rej){
            var fr = new FileReader();
            fr.onload = function(){ res(fr.result); };
            fr.onerror = rej;
            fr.readAsDataURL(o.foto);
          });
        }catch(ef){ o.fotoTxt = null; }
      }
      if(o.fotoTxt && String(o.fotoTxt).length < 690000){
        try{
          await conTope(db.collection('flotafotos').doc(o.id).set({
            f: String(o.fotoTxt), ts: new Date().toISOString()
          }), 30000, 'foto');
          fotoPath = 'flotafotos/' + o.id;
          fotoURL = null;
        }catch(ef){ fotoPath = null; }
      }
      var dentro = {
        v: VNUM, tipo: o.tipo, veh: o.veh || '', f: o.f,
        km: o.km||0, l: o.l||0, cat: o.cat||'', d: o.d||'', i: o.i||0, nf: 0
      };
      /* un cambio de vencimiento viaja adentro del MISMO sobre que una carga
         de gasoil: las reglas de Firebase miran el sobre, no lo de adentro,
         asi que no hubo que tocar nada en Google. */
      if(o.tipo === 'venc'){ dentro.cambios = o.cambios || []; dentro.res = o.res || ''; }
      dentro.nf = fotoPath ? 1 : 0;
      var cuerpo = JSON.stringify(dentro);
      var b64 = await cifrar(cuerpo, CODIGO, String(VNUM));
      try{
        await conTope(db.collection(COLECCION).doc(o.id).set({
          v: VNUM, b: b64, nf: (fotoPath?1:0), fotoURL: fotoURL, fotoPath: fotoPath, estado: 'nuevo',
          ts: firebase.firestore.FieldValue.serverTimestamp(), fecha_carga: new Date().toISOString()
        }), 30000, 'mandar');
      }catch(em){
        var cod = String((em && (em.code||em.message)) || '');
        var esPerm = /permission|denied/i.test(cod);
        /* Con el id fijo, un reintento de algo que YA entró se ve como update y
           las reglas lo rechazan: eso significa que llegó. Pero si el PRIMER
           intento ya había sido rechazado por permiso, entonces nunca entró y
           tragarse el error borraría la carga en silencio. Por eso se mira
           cómo falló la primera vez. */
        if(esPerm && o.intentos > 1 && o.err1 && !/permission|denied/i.test(o.err1)){ /* ya estaba */ }
        else{
          if(!o.err1){ o.err1 = cod; try{ await colaGuardar(o); }catch(e3){} }
          throw em;
        }
      }
      await colaSacar(o.id);
      histAgregar({tipo:o.tipo, veh:o.veh, f:o.f, km:o.km||0, l:o.l||0, cat:o.cat||'', i:o.i||0, res:o.res||'', ok:1});
    }
    COLAMSG = '';
  }catch(e){
    ULTERR = String((e && (e.code||e.message)) || e);
    COLAMSG = '<b>No salió todavía.</b> ' + esc(ULTERR);
  }
  FLUSHING = false;
  await colaLeer();
  pintarCola(); pintarHist();
}


/* ---- los datos que deja la oficina ----
   Antes el telefono solo tenia lo que venia adentro del archivo, asi que un
   cambio en la computadora no llegaba hasta que se resubia flota.html.
   Ahora, al abrir, se fija si la oficina dejo algo mas nuevo y lo usa.
   Lo guarda en el telefono, asi la proxima vez lo tiene aunque no haya senal. */
function datosGuardados(){
  try{
    var t = lsGet(LS_DAT); if(!t) return null;
    var o = JSON.parse(t);
    return (o && o.v === VNUM && o.g) ? o.g : null;
  }catch(e){ return null; }
}
function datosGuardar(g){
  try{ lsSet(LS_DAT, JSON.stringify({v:VNUM, g:g})); }catch(e){}
}
async function bajarDatos(){
  if(!CODIGO || !VNUM) return false;
  if(!conectarFB()) return false;
  try{
    await conTope(sesion(), 20000, 'entrar');
    var d = await conTope(db.collection('flotadatos').doc(String(VNUM)).get(), 20000, 'bajar');
    if(!d || !d.exists) return false;
    var dd = d.data() || {};
    if(!dd.b) return false;
    var vieja = Number((G && G.ver) || 0);
    if(Number(dd.ver || 0) <= vieja) return false;   /* ya lo tengo */
    var txt = await descifrar(b64bytes(dd.b), CODIGO, String(VNUM));
    var g = JSON.parse(txt);
    if(!g || !g.veh) return false;
    G = g;
    datosGuardar(g);
    return true;
  }catch(e){ return false; }
}

/* ---- guardar ---- */
async function encolar(o){
  o.id = nuevoId();
  if(FOTO){
    try{ o.foto = await achicarFoto(FOTO); }catch(e){ o.foto = FOTO; }
  }
  try{ await colaGuardar(o); }
  catch(e){
    /* algunos teléfonos no aceptan guardar el Blob: va como texto */
    if(o.foto){
      try{
        var dat = await new Promise(function(res,rej){ var fr=new FileReader(); fr.onload=function(){res(fr.result);}; fr.onerror=rej; fr.readAsDataURL(o.foto); });
        delete o.foto; o.fotoTxt = dat;
        await colaGuardar(o);
      }catch(e2){ alert('No pude guardar la carga en el teléfono: ' + (e2.message||e2)); return false; }
    } else { alert('No pude guardar la carga en el teléfono: ' + (e.message||e)); return false; }
  }
  await colaLeer(); pintarCola(); pintarHist();
  flush();
  return true;
}
async function guardarCombustible(){
  var vid = $('cvV').value, f = $('cvF').value || hoyISO();
  var km = parseInt($('cvKm').value, 10) || 0;
  var l = parseFloat(String($('cvL').value).replace(',','.')) || 0;
  if(!vid){ alert('Elegí el vehículo.'); return; }
  if(!(l > 0)){ alert('Poné cuántos litros le cargaste.'); return; }
  var a = avisoKm(vid, km);
  if(a && !confirm(a + '\n\n¿Lo guardo igual?')) return;
  FOTO = null;
  if(!(await encolar({tipo:'com', veh:vid, f:f, km:km, l:Math.round(l*100)/100}))) return;
  if(km > 0) ultPoner(vid, km, f);
  $('cvKm').value = ''; $('cvL').value = ''; $('cvAviso').innerHTML = '';
  pintarUlt();
}
async function guardarGasto(){
  var vid = $('gvV').value, f = $('gvF').value || hoyISO();
  var cat = $('gvC').value, d = String($('gvD').value||'').trim();
  var i = parseFloat(String($('gvI').value).replace(',','.')) || 0;
  var km = parseInt($('gvKm').value, 10) || 0;
  if(!vid){ alert('Elegí el vehículo.'); return; }
  if(!(i > 0)){ alert('Poné el importe.'); return; }
  if(gastoPideKm() && !km && !confirm('No pusiste el odómetro.\n\nSin eso la oficina no puede saber para cuándo es el próximo service.\n\n¿Lo guardo igual?')) return;
  if(!FOTO && !confirm('Vas a guardar el gasto SIN foto del ticket.\n\n¿Lo guardo igual?')) return;
  if(!(await encolar({tipo:'gas', veh:vid, f:f, cat:cat, d:d, i:Math.round(i*100)/100, km:km}))) return;
  if(km > 0) ultPoner(vid, km, f);
  $('gvD').value = ''; $('gvI').value = ''; $('gvKm').value = ''; $('gvFoto').value = ''; $('gvFotoV').innerHTML = ''; FOTO = null;
}

/* ---- probar la conexión ---- */
async function probar(){
  var d = $('diag'); d.innerHTML = 'Probando…';
  var l = [];
  function ok(t){ l.push('✔ ' + t); }
  function mal(t,e){ l.push('✘ <b>' + t + '</b>' + (e ? ' — ' + esc(String(e.message||e)) : '')); }
  try{
    (location.protocol === 'https:') ? ok('abierta por el link') : mal('NO está abierta por el link (por eso puede fallar todo)');
    (typeof indexedDB !== 'undefined') ? ok('el teléfono deja guardar') : mal('el teléfono no deja guardar');
    (crypto && crypto.subtle) ? ok('puede cifrar') : mal('no puede cifrar');
    (typeof firebase !== 'undefined') ? ok('cargaron los programas de Google') : mal('no cargaron los programas de Google');
    if(!conectarFB()) mal('no conecta con la oficina');
    else{
      ok('conecta con la oficina');
      /* La app MANDA, no lee. Las reglas de Firebase le dan permiso para
         escribir y se lo NIEGAN para leer, a proposito: si el telefono se
         pierde, el que lo encuentre no puede sacar nada. Por eso probar la
         lectura daba «Missing or insufficient permissions» y parecia roto
         cuando en realidad estaba bien. Ahora se prueba lo que importa. */
      try{ await conTope(sesion(), 15000, 'entrar'); ok('entró'); }catch(e){ mal('no pudo entrar', e); }
      l.push('&nbsp;&nbsp;<span style="color:#65726b;font-size:13px">La app manda pero no lee: es a propósito. '
           + 'Si probás la lectura, Google contesta que no tiene permiso — y eso está bien.</span>');
      if(COLA.length) l.push('&nbsp;&nbsp;<span style="color:#8a6d1a">Hay ' + COLA.length
           + (COLA.length === 1 ? ' carga esperando salir.' : ' cargas esperando salir.') + '</span>');
      else l.push('&nbsp;&nbsp;<span style="color:#1f6b3b">No quedó nada esperando: salió todo.</span>');
    }
  }catch(e){ mal('error general', e); }
  if(ULTERR) l.push('<span style="color:#a3282f">Último error al mandar: ' + esc(ULTERR) + '</span>');
  d.innerHTML = l.join('<br>');
}

function vnObj(t,id){
  var l = t === 'veh' ? ven().vehiculos : ven().empleados;
  for(var i=0;i<l.length;i++) if(String(l[i].id) === String(id)) return l[i];
  return null;
}
function vnDef(t,k){
  var l = t === 'veh' ? VE_CAMPOS : VE_DOCS;
  for(var i=0;i<l.length;i++) if(l[i].k === k) return l[i];
  return null;
}
/* lo que hay que mirar, ordenado por el que vence primero */
function vnItems(){
  var V = ven(), l = [];
  (V.vehiculos||[]).forEach(function(v){
    if(v.activo === false) return;
    vnTipo(v).campos.forEach(function(k){
      if(v.sinAviso && v.sinAviso[k]) return;
      if(!v[k]) return;
      var d = vnDef('veh',k);
      l.push({t:'veh', id:v.id, campo:k, lab:d?d.lab:k, quien:vnNomVeh(v), sub:v.pat||'', f:v[k], n:vnDias(v[k])});
    });
  });
  (V.empleados||[]).forEach(function(e){
    if(e.activo === false) return;
    VE_DOCS.forEach(function(c){
      if(e.sinAviso && e.sinAviso[c.k]) return;
      if(!e[c.k]) return;
      l.push({t:'emp', id:e.id, campo:c.k, lab:c.lab, quien:e.nombre, sub:'Personal', f:e[c.k], n:vnDias(e[c.k])});
    });
  });
  l.sort(function(a,b){ return a.n - b.n; });
  return l;
}

/* ---- mandar un cambio ---- */
async function vnMandar(cambios, resumen){
  if(SOLOVER){ alert('Vos entrás para mirar. Los cambios los carga el encargado.'); return false; }
  var ok = await encolar({tipo:'venc', f:hoyISO(), cambios:cambios, res:resumen||''});
  if(ok) vnMarcar(resumen);
  return ok;
}
function vnMarcar(txt){
  var d = $('vnMsg');
  if(d){ d.innerHTML = '<div class="aviso ver">✔ ' + esc(txt||'Guardado') + '. Se lo mando a la oficina.</div>';
         setTimeout(function(){ if($('vnMsg')) $('vnMsg').innerHTML = ''; }, 6000); }
}

/* ---- pantalla ---- */
function vnSub(s){ VENSUB = s; pintarVenc(); try{ window.scrollTo(0,0); }catch(e){} }
function vnBuscar(t){ VENQ = String(t||'').toLowerCase(); pintarVenc(); }
function pintarVenc(){
  var d = $('vnLista'); if(!d) return;
  var h = '<div class="tabs" style="margin-bottom:10px">'
        + [['fechas','Fechas'],['avisar','Avisar'],['veh','Vehículos'],['pers','Personal'],['serv','Services'],['cub','Cubiertas']].map(function(x){
            return '<button class="' + (VENSUB===x[0]?'on':'') + '" onclick="vnSub(\'' + x[0] + '\')">' + x[1] + '</button>';
          }).join('') + '</div><div id="vnMsg"></div>';
  if(VENSUB === 'fechas') h += vnHtmlFechas();
  if(VENSUB === 'avisar') h += vnHtmlAvisar();
  if(VENSUB === 'pers')   h += vnHtmlPersonal();
  if(VENSUB === 'veh')    h += vnHtmlVehiculos();
  if(VENSUB === 'serv')   h += vnHtmlServ();
  if(VENSUB === 'cub')    h += vnHtmlCub();
  d.innerHTML = h;
}
function vnHtmlFechas(){
  var tope = parseInt(($('vnFiltro')||{}).value || '60', 10);
  var l = vnItems().filter(function(x){
    if(tope === 0) return x.n < 0;
    if(tope < 9999 && x.n > tope) return false;
    if(VENQ && (x.quien + ' ' + x.sub + ' ' + x.lab).toLowerCase().indexOf(VENQ) < 0) return false;
    return true;
  });
  if(!l.length) return '<div class="nota">No hay nada en ese plazo.</div>';
  var h = '';
  l.forEach(function(x){
    var cl = vnEstado(x.n);
    h += '<div class="aviso ' + cl + '" style="margin:6px 0">'
       + '<div><b>' + (x.t === 'emp' ? '👤 ' : '🚚 ') + esc(x.quien) + '</b>'
       + (x.sub ? ' <span class="nota">' + esc(x.sub) + '</span>' : '') + '</div>'
       + '<div>' + esc(x.lab) + ' — ' + fcorta(x.f) + ' · <b>' + vnTxt(x.n) + '</b></div>'
       + '<div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">'
       + (SOLOVER ? '' : '<button class="sec chico" onclick="vnAbrir(\'' + x.t + '\',' + JSON.stringify(String(x.id)).replace(/"/g,'&quot;') + ',\'' + x.campo + '\')">Renové esto</button>')
       + vnBotonAviso(x)
       + '</div></div>';
  });
  return h;
}
/* el editor de una fecha: los plazos suman SOBRE LA FECHA DE ARRIBA */
/* a quien le aviso de ESTE vencimiento: si es de una persona, a ella; si es de
   un vehiculo, al que lo maneja — salvo que figure a nombre de CAMPO o DEPOSITO,
   que son lugares y no le llegan a nadie. */
function vnBotonAviso(x){
  var nom = '';
  if(x.t === 'emp') nom = x.quien;
  else {
    var v = vnObj('veh', x.id);
    if(v && v.chofer && !vnEsLugar(v.chofer)) nom = String(v.chofer).trim().toUpperCase();
  }
  if(!nom) return '';
  var msg = 'Hola ' + nom + ', te aviso que se vence ' + x.lab.toLowerCase()
          + (x.t === 'emp' ? '' : ' de ' + x.quien + (x.sub ? ' ' + x.sub : ''))
          + ' el ' + fcorta(x.f) + '. Hay que renovarlo.';
  return '<button class="sec chico" onclick="vnAvisar(' + JSON.stringify(msg).replace(/"/g,'&quot;')
       + ',' + JSON.stringify(vnTel(nom)).replace(/"/g,'&quot;') + ')">Avisarle a ' + esc(nom) + '</button>';
}
function vnAbrir(t,id,campo){
  var o = vnObj(t,id); if(!o) return;
  var def = vnDef(t,campo), nom = t === 'veh' ? vnNomVeh(o) : o.nombre;
  var val = o[campo] || '';
  var h = '<div class="caja" style="margin:0">'
        + '<b>' + esc(def?def.lab:campo) + ' · ' + esc(nom) + '</b>'
        + '<label for="vnF">Nueva fecha de vencimiento</label>'
        + '<input type="date" id="vnF" value="' + esc(val) + '">'
        + '<div style="margin:10px 0 4px;display:flex;gap:6px;flex-wrap:wrap">'
        + [[3,'+3 m'],[6,'+6 m'],[12,'+1 año'],[24,'+2 años'],[60,'+5 años']].map(function(x){
            return '<button class="sec chico" onclick="vnMas(' + x[0] + ')">' + x[1] + '</button>'; }).join('')
        + '<button class="sec chico" onclick="vnHoy()">Hoy</button></div>'
        + '<div class="nota">Suma sobre la fecha de arriba. Si arrancás de cero, apretá «Hoy» y después el plazo.</div>'
        + '<div style="margin-top:12px;display:flex;gap:8px">'
        + '<button class="prim" style="flex:1" onclick="vnGuardar(\'' + t + '\',' + JSON.stringify(String(id)).replace(/"/g,'&quot;') + ',\'' + campo + '\')">Guardar</button>'
        + '<button class="sec" onclick="pintarVenc()">Cancelar</button></div></div>';
  $('vnLista').innerHTML = h;
  try{ window.scrollTo(0,0); }catch(e){}
}
function vnMas(m){ var e = $('vnF'); if(e) e.value = vnSuma(e.value || '', m); }
function vnHoy(){ var e = $('vnF'); if(e) e.value = hoyISO(); }
async function vnGuardar(t,id,campo){
  var e = $('vnF'), val = (e && e.value) || null;
  var o = vnObj(t,id); if(!o) return;
  var antes = o[campo] || null;
  if(antes === val){ pintarVenc(); return; }
  var def = vnDef(t,campo), nom = t === 'veh' ? vnNomVeh(o) : o.nombre;
  var ok = await vnMandar([{tabla:(t === 'veh' ? 'veh' : 'emp'), id:String(id), campo:campo, valor:val}],
                          (def?def.lab:campo) + ' de ' + nom + ' al ' + (val ? fcorta(val) : 'vacío'));
  if(ok){ o[campo] = val; }   /* que lo vea cambiado ya, sin esperar a la oficina */
  pintarVenc(); pintarAlerta();
}

async function vnGuardarServ(){
  var id = $('svV').value, v = vnObj('veh', id);
  if(!v){ alert('Elegí el vehículo.'); return; }
  var f = $('svF').value || hoyISO();
  var km = parseInt($('svKm').value, 10) || null;
  var it = String($('svIt').value||'').split(/[,;]+/).map(function(x){ return x.trim(); }).filter(function(x){ return x; });
  var pk = parseInt($('svPK').value, 10) || null;
  if(!km && !confirm('No pusiste los kilómetros.\n\nSin eso la oficina no puede saber para cuándo cae el próximo.\n\n¿Lo guardo igual?')) return;
  if(!pk && km) pk = km + (vnTipo(v).un === 'hs' ? 300 : v.tipo === 'camion' ? 20000 : 10000);
  var cambios = [{tabla:'serv', veh:v.veh || vnNomVeh(v), pat:v.pat || '', f:f, km:km, items:it, obs:String($('svOb').value||'').trim()}];
  if(km) cambios.push({tabla:'veh', id:String(v.id), campo:'km', valor:km});
  if(pk) cambios.push({tabla:'veh', id:String(v.id), campo:'servKm', valor:pk});
  var ok = await vnMandar(cambios, 'Service de ' + vnNomVeh(v));
  if(ok){
    (ven().servicios || (ven().servicios = [])).push({id:nuevoId(), veh:v.veh, pat:v.pat, fecha:f, km:km, proxKm:pk, items:it, obs:''});
    if(km) v.km = km;
    if(pk) v.servKm = pk;
    if(km > 0) ultPoner(String(v.id), km, f);
  }
  pintarVenc();
}

/* ---- cubiertas ---- */
function vnGastoCub(v,c){
  if(!c) return null;
  var C = vnCfg();
  var km = (v.km && c.km != null) ? Math.max(0, v.km - c.km) : null;
  var d  = c.f ? -vnDias(c.f) : null;
  var p = Math.max(km != null ? km/(C.cubKm||60000) : 0, d != null ? (d/365)/(C.cubAnios||5) : 0);
  return {km:km, pct:p, st: p >= 1 ? 'roj' : p >= 0.85 ? 'amar' : ''};
}
function vnHtmlCub(){
  var V = ven();
  var h = '<div class="nota" style="margin-bottom:8px">Tocá una posición para anotar la cubierta que pusiste.</div>';
  (V.vehiculos||[]).forEach(function(v){
    if(!vnPos(v).length) return;
    if(VENQ && (vnNomVeh(v) + ' ' + (v.pat||'')).toLowerCase().indexOf(VENQ) < 0) return;
    h += '<div class="caja" style="margin:0 0 8px;padding:10px">'
       + '<b>' + esc(vnNomVeh(v)) + '</b> <span class="nota">' + esc(v.pat||'') + '</span>'
       + '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-top:6px">';
    vnPos(v).forEach(function(p){
      var c = (v.cubiertas||{})[p[0]], g = c ? vnGastoCub(v,c) : null;
      var col = g && g.st === 'roj' ? '#fbe4e4' : g && g.st === 'amar' ? '#fff5d6' : '#fff';
      h += '<button class="sec chico" style="background:' + col + '" onclick="vnAbrirCub(' + JSON.stringify(String(v.id)).replace(/"/g,'&quot;') + ',\'' + p[0] + '\')">'
         + p[0] + '<br><small>' + (c && c.f ? fcorta(c.f) : c && c.km != null ? numAR(c.km) : '+') + (g ? ' · ' + Math.round(g.pct*100) + '%' : '') + '</small></button>';
    });
    h += '</div></div>';
  });
  return h;
}
function vnAbrirCub(id,pos){
  var v = vnObj('veh', id); if(!v) return;
  var c = (v.cubiertas || {})[pos] || {};
  var h = '<div class="caja" style="margin:0"><b>' + esc(vnLabPos(v,pos)) + ' · ' + esc(vnNomVeh(v)) + '</b>'

        + '<label for="cbKm">Con cuántos km</label><input type="number" id="cbKm" inputmode="numeric" value="' + esc(c.km == null ? '' : c.km) + '">'
        + '<label for="cbMar">Marca</label><input type="text" id="cbMar" value="' + esc(c.marca||'') + '">'

        + '<button class="sec" onclick="pintarVenc()">Cancelar</button></div></div>';
  $('vnLista').innerHTML = h;

}
async function vnGuardarCub(id,pos){
  var v = vnObj('veh', id); if(!v) return;
  var f = $('cbF').value || null;
  var km = parseInt($('cbKm').value, 10);
  if(isNaN(km)) km = null;
  var mar = String($('cbMar').value||'').trim(), med = String($('cbMed').value||'').trim();
  var ok = await vnMandar([{tabla:'cub', id:String(id), pos:pos, f:f, km:km, marca:mar, med:med}],
                          'Cubierta ' + vnLabPos(v,pos) + ' de ' + vnNomVeh(v));
  if(ok){
    if(!v.cubiertas) v.cubiertas = {};
    v.cubiertas[pos] = {f:f, km:km, marca:mar, med:med, nota:''};
  }
  pintarVenc();
}

/* ---- a quién avisarle ----
   Los nombres de chofer de los vehículos no coinciden con la lista de
   personal, así que no se adivina: la libreta va por nombre tal como está,
   y el teléfono lo carga la oficina una vez. */
var VE_LUGARES = ['CAMPO','DEPOSITO','DEPOSITO 1','DEPOSITO 2'];
function vnEsLugar(n){ return VE_LUGARES.indexOf(String(n||'').trim().toUpperCase()) > -1; }
function vnTel(nom){ return (ven().tel || {})[String(nom||'').trim().toUpperCase()] || ''; }
function vnGente(){
  var V = ven(), m = {};
  (V.empleados||[]).forEach(function(e){
    if(e.activo === false) return;
    var k = String(e.nombre||'').trim().toUpperCase();
    if(k) m[k] = m[k] || {nom:k, emp:e, veh:[]};
  });
  (V.vehiculos||[]).forEach(function(v){
    if(v.activo === false || !v.chofer) return;
    var k = String(v.chofer).trim().toUpperCase();
    if(!k || vnEsLugar(k)) return;
    m[k] = m[k] || {nom:k, emp:null, veh:[]};
    m[k].veh.push(v);
  });
  return Object.keys(m).sort().map(function(k){ return m[k]; });
}
function vnDeQuien(g, tope){
  var t = tope == null ? vnCfg().prox : tope, l = [];
  if(g.emp){
    VE_DOCS.forEach(function(c){
      if(g.emp.sinAviso && g.emp.sinAviso[c.k]) return;
      var f = g.emp[c.k]; if(!f) return;
      var n = vnDias(f);
      if(n <= t) l.push({que:c.lab, f:f, n:n, de:''});
    });
  }
  g.veh.forEach(function(v){
    vnTipo(v).campos.forEach(function(k){
      if(v.sinAviso && v.sinAviso[k]) return;
      var f = v[k]; if(!f) return;
      var n = vnDias(f);
      if(n <= t){ var d = vnDef('veh',k); l.push({que:d?d.lab:k, f:f, n:n, de:vnNomVeh(v) + (v.pat?' '+v.pat:'')}); }
    });
  });
  l.sort(function(a,b){ return a.n - b.n; });
  return l;
}
function vnMensaje(g, tope){
  var l = vnDeQuien(g, tope);
  if(!l.length) return '';
  var m = 'Hola ' + g.nom + ', te paso lo que se te vence:\n';
  l.forEach(function(x){
    m += '\n• ' + x.que + (x.de ? ' de ' + x.de : '') + ': ' + fcorta(x.f)
       + ' (' + (x.n < 0 ? 'vencido' : x.n === 0 ? 'vence hoy' : vnTxt(x.n)) + ')';
  });
  return m + '\n\nHay que ir renovando. Cualquier cosa avisame.';
}
var VNTOPE = 30;
function vnTope(v){ VNTOPE = Number(v) || 30; pintarVenc(); }
function vnHtmlAvisar(){
  var g = vnGente(), h = '';
  h += '<div class="nota" style="margin-bottom:8px">Un mensaje por persona con todo lo suyo junto: lo de él y lo del vehículo que maneja.</div>'
     + '<div class="fila" style="margin-bottom:8px"><select onchange="vnTope(this.value)" style="flex:1">'
     + [7,15,30,60,90].map(function(n){ return '<option value="' + n + '"' + (VNTOPE===n?' selected':'') + '>Lo que vence dentro de ' + n + ' días</option>'; }).join('')
     + '</select></div>';
  var hubo = 0;
  g.forEach(function(x){
    var l = vnDeQuien(x, VNTOPE);
    if(!l.length) return;
    if(VENQ && x.nom.toLowerCase().indexOf(VENQ) < 0) return;
    hubo++;
    var urg = l[0].n <= vnCfg().urg;
    h += '<div class="aviso ' + (urg ? 'roj' : 'amar') + '" style="margin:6px 0">'
       + '<div><b>👤 ' + esc(x.nom) + '</b>' + (vnTel(x.nom) ? '' : ' <span class="nota">sin teléfono cargado</span>') + '</div>'
       + l.map(function(y){ return '<div>' + esc(y.que) + (y.de ? ' <span class="nota">' + esc(y.de) + '</span>' : '')
              + ' — ' + fcorta(y.f) + ' · <b>' + vnTxt(y.n) + '</b></div>'; }).join('')
       + '<div style="margin-top:6px"><button class="sec chico" onclick="vnAvisarA(' + JSON.stringify(x.nom).replace(/"/g,'&quot;') + ')">'
       + 'Avisarle por WhatsApp</button></div></div>';
  });
  if(!hubo) h += '<div class="nota">A nadie se le vence nada en ese plazo.</div>';
  return h;
}
/* ---- personal: dar de alta, cambiar el nombre y dar de baja ----
   El que se va se DA DE BAJA, no se borra: deja de contar en los avisos pero
   sus fechas quedan por si vuelve. Borrar del todo es solo en la oficina. */
/* ---- vehículos: agregar y corregir desde el teléfono ----
   Los que tienen vencimientos pero no son vehículos (los matafuegos del
   depósito, el descuento flotillero) no se tocan desde acá. */
var VE_TIPOS_LAB = [['reparto','Reparto'],['camion','Camión'],['acoplado','Acoplado'],
                    ['camioneta','Camioneta'],['autoelevador','Autoelevador']];
/* Quien puede figurar manejando: los empleados, los que ya manejan aunque no
   esten en personal (CHACHI, CABEZA...), y las bases (CAMPO, DEPOSITO), que no
   son personas pero son donde para el vehiculo. Se elige de la lista o se
   deja vacio; escribir a mano es la ultima opcion, no la primera. */
function vnQuienesManejan(){
  var V = ven(), por = {}, sueltos = [], bases = [], vistos = {};
  (V.empleados||[]).forEach(function(e){
    if(e.activo === false) return;
    var n = String(e.nombre||'').trim().toUpperCase();
    if(!n || vistos[n]) return;
    vistos[n] = 1;
    (por[vnRol(e)] || (por[vnRol(e)] = [])).push(n);
  });
  (V.vehiculos||[]).forEach(function(v){
    var n = String(v.chofer||'').trim().toUpperCase();
    if(!n || vistos[n]) return;
    vistos[n] = 1;
    if(vnEsLugar(n)) bases.push(n); else sueltos.push(n);
  });
  VE_LUGARES.forEach(function(n){ if(bases.indexOf(n) < 0) bases.push(n); });
  return {por:por, sueltos:sueltos.sort(), bases:bases.sort()};
}
function vnSelChofer(v){
  var q = vnQuienesManejan(), act = String(v.chofer||'').trim().toUpperCase();
  function ops(l){
    return l.slice().sort().map(function(n){
      return '<option value="' + esc(n) + '"' + (act === n ? ' selected' : '') + '>' + esc(n) + '</option>';
    }).join('');
  }
  var h = '<select onchange="vnSetChofer(' + JSON.stringify(String(v.id)).replace(/"/g,'&quot;') + ', this.value)">'
        + '<option value=""' + (act ? '' : ' selected') + '>— sin asignar —</option>';
  VE_ROLES.forEach(function(r){
    if(q.por[r] && q.por[r].length) h += '<optgroup label="' + vnRolPl(r) + '">' + ops(q.por[r]) + '</optgroup>';
  });
  if(q.sueltos.length) h += '<optgroup label="Sin ocupación cargada">' + ops(q.sueltos) + '</optgroup>';
  if(q.bases.length)   h += '<optgroup label="Bases">' + ops(q.bases) + '</optgroup>';
  return h + '<option value="__otro__">+ Agregar una persona nueva…</option></select>';
}
async function vnSetChofer(id, val){
  var v = vnObj('veh', id); if(!v) return;
  if(val === '__otro__'){
    var n = prompt('Nombre de la persona:', '');
    if(n === null){ pintarVenc(); return; }
    val = String(n).trim().toUpperCase();

      var nid = nuevoId();
      await vnMandar([{tabla:'empNuevo', id:nid, nombre:val, rol:'Chofer'}], 'Persona nueva: ' + val);
      (ven().empleados || (ven().empleados = [])).push({id:nid, nombre:val, rol:'Chofer', carnet:null,
        libreta:null, psico:null, curso:null, linti:null, activo:true, sinAviso:{}});
    }

  var ok = await vnMandar([{tabla:'veh', id:String(id), campo:'chofer', valor:val||''}],
                          'Quién maneja ' + vnNomVeh(v) + ': ' + (antes || 'sin asignar') + ' → ' + (val || 'sin asignar'));

  pintarVenc(); pintarAlerta();

async function vnNuevoVeh(){

    (ven().vehiculos || (ven().vehiculos = [])).push({id:n, den:n, veh:mar, pat:pat, chofer:'', tipo:tipo,
      rt:null, senasa:null, seguro:null, habctes:null, matafuego:null, servFecha:null,
      km:null, servKm:null, activo:true, sinAviso:{}, cubiertas:{}});

async function vnSetVeh(id, campo, txt){
  var v = vnObj('veh', id); if(!v) return;
  var nv = String(txt||'').trim();
  if(campo === 'den' || campo === 'pat') nv = nv.toUpperCase();
  if(nv === String(v[campo]||'')){ return; }
  var lab = campo === 'den' ? 'Nombre' : campo === 'pat' ? 'Patente' : 'Marca';
  var ok = await vnMandar([{tabla:'veh', id:String(id), campo:campo, valor:nv}],
                          lab + ' de ' + vnNomVeh(v) + ': ' + (v[campo] || 'vacío') + ' → ' + (nv || 'vacío'));
  if(ok) v[campo] = nv;
  pintarVenc();
}

       + '<label style="margin-top:8px">Ocupación</label>'
       + '<select onchange="vnSetRol(' + jid + ', this.value)">'

       + '</select>'
       + '<div class="nota" style="margin-top:6px">' + l + ' de ' + VE_DOCS.length + ' fechas cargadas'
       + (vnTel(e.nombre) ? '' : ' · sin teléfono') + '</div>'
       + '<div style="margin-top:8px"><button class="sec chico" onclick="vnBajaEmp(' + jid + ')">Se fue · dar de baja</button></div>'
       + '</div>';
  });
  if(baj.length){

    baj.forEach(function(e){
      h += '<div class="caja" style="margin:6px 0;padding:10px;opacity:.75">' + esc(e.nombre)
         + '<div style="margin-top:6px"><button class="sec chico" onclick="vnAltaEmp(' + JSON.stringify(String(e.id)).replace(/"/g,'&quot;') + ')">Volvió · reactivar</button></div></div>';
    });

  if(ok){

    else (ven().empleados || (ven().empleados = [])).push({id:id, nombre:nom, rol:rol, carnet:null, libreta:null,
            psico:null, curso:null, linti:null, activo:true, sinAviso:{}});

function vnAvisarA(nom){
  var g = null;
  vnGente().forEach(function(x){ if(x.nom === nom) g = x; });
  if(!g) return;
  var m = vnMensaje(g, VNTOPE);

function vnAvisar(msg, tel){
  var t = String(tel||'').replace(/[^0-9]/g,'');
  try{ window.open('https://wa.me/' + t + '?text=' + encodeURIComponent(msg), '_blank'); }
  catch(e){ alert(msg); }
}
/* el cartel de arriba: lo primero que ve al abrir */
function pintarAlerta(){
  var d = $('alertaVenc'); if(!d) return;
  var c = vnCfg(), l = vnItems().filter(function(x){ return x.n <= c.urg; });
  if(!l.length){ d.innerHTML = ''; return; }
  var venc = l.filter(function(x){ return x.n < 0; }).length;
  var t = l.slice(0, 4).map(function(x){ return x.quien + ' · ' + x.lab; }).join(' — ');
  d.innerHTML = '<div class="aviso roj"><b>⚠️ ' + l.length
    + (l.length === 1 ? ' vencimiento' : ' vencimientos') + ' para esta semana'
    + (venc ? ' (' + venc + ' ya vencido' + (venc === 1 ? '' : 's') + ')' : '') + '</b>'
    + '<div style="margin-top:4px">' + esc(t) + (l.length > 4 ? ' y ' + (l.length - 4) + ' más' : '') + '</div>'
    + '<div style="margin-top:6px"><button class="sec chico" onclick="irTab(\'ven\')">Verlos</button></div></div>';
}

/* ---- entrar con el código ---- */
async function abrirCon(cod){
  cod = String(cod||'').trim().toUpperCase();
  var id = idDeCodigo(cod);
  if(!id) throw new Error('formato');
  var bl = null;
  for(var i=0;i<BLOQUES.length;i++){ if(String(BLOQUES[i].v) === String(id)) bl = BLOQUES[i]; }
  if(!bl) throw new Error('no figura');
  var txt = await descifrar(b64bytes(bl.b), cod, String(id));
  var g = JSON.parse(txt);
  CODIGO = cod; VNUM = String(id); G = g;
  return g;
}
/* Hay gente que solo mira: ve los vencimientos y nada más.
   No carga combustible ni gastos, así que le saco esas pestañas. */
function acomodarSegunQuien(){
  SOLOVER = !!(G && G.soloVer);
  if(!SOLOVER) return;
  $('tbCom').className = 'oculto';
  $('tbGas').className = 'oculto';
  $('cHist').className = 'caja oculto';
  var tv = $('tbVen'); if(tv) tv.textContent = '⚠️ Vencimientos';
}
function arrancarApp(){
  lsSet(LS_COD, CODIGO);
  /* si la oficina ya me mando datos alguna vez, esos mandan sobre los que
     venian adentro del archivo: son mas nuevos */
  try{
    var gg = datosGuardados();
    if(gg && Number(gg.ver||0) >= Number((G&&G.ver)||0)) G = gg;
  }catch(e){}
  ULT = ultLeer();
  $('pAlta').className = 'caja oculto';
  $('pApp').className = '';
  var cuantos = (G && G.veh || []).length;
  $('subT').textContent = (G && G.nom ? G.nom : 'Depósito') + ' · ' + cuantos + ' vehículos';
  llenarVehiculos();
  $('cvF').value = hoyISO(); $('gvF').value = hoyISO();
  acomodarSegunQuien();
  verKmGasto();
  pintarUlt(); pintarHist(); pintarAlerta();
  irTab(SOLOVER ? 'ven' : 'com');
  if(!SOLOVER) colaLeer().then(function(){ pintarCola(); flush(); });
  /* y de paso: fijarse si hay algo mas nuevo en la oficina */
  setTimeout(function(){
    bajarDatos().then(function(hubo){
      if(!hubo) return;
      acomodarSegunQuien();
      llenarVehiculos();
      pintarUlt(); pintarAlerta(); pintarVenc();
      var d = $('colaCartel');
      if(d) d.innerHTML = '<div class="aviso ver">\u2714 La oficina actualiz\u00f3 los datos.</div>' + d.innerHTML;
      setTimeout(function(){ pintarCola(); }, 5000);
    });
  }, 900);
}
async function entrar(){
  var a = $('avAlta'); a.innerHTML = 'Comprobando…';
  try{
    await abrirCon($('inCod').value);
    a.innerHTML = '';
    arrancarApp();
  }catch(e){
    var m = String(e.message||e);
    a.innerHTML = '<span style="color:#a3282f">' +
      (m === 'formato' ? 'Ese código no tiene la forma correcta. Es como 900-XXXXXXXX.'
       : m === 'no figura' ? 'Ese código no figura. Fijate que esté bien copiado.'
       : 'El código no abre los datos. Pedile uno nuevo a Mariano.') + '</span>';
  }
}

/* ---- arranque ---- */
document.addEventListener('DOMContentLoaded', function(){
  if(abiertaMal()){
    var d = $('malAbierta');
    $('malLink').textContent = LINK_APP;
    d.style.display = 'flex';
    $('malCopiar').onclick = function(){
      var b = this;
      try{ navigator.clipboard.writeText(LINK_APP).then(function(){ b.textContent = '✔ Copiado — pegalo en Chrome'; }, function(){}); }catch(e){}
    };
    $('malSeguir').onclick = function(){ d.style.display = 'none'; };
  }
  $('btEntrar').onclick = entrar;
  $('inCod').addEventListener('keydown', function(e){ if(e.key === 'Enter') entrar(); });
  $('tbCom').onclick = function(){ irTab('com'); };
  $('tbGas').onclick = function(){ irTab('gas'); };
  $('tbVen').onclick = function(){ irTab('ven'); };
  $('vnFiltro').onchange = pintarVenc;
  $('vnQ').addEventListener('input', function(){ vnBuscar(this.value); });
  $('cvV').onchange = pintarUlt;
  $('cvKm').addEventListener('input', verAvisoKm);
  $('gvC').onchange = verKmGasto;
  $('btCom').onclick = guardarCombustible;
  $('btGas').onclick = guardarGasto;
  $('btProbar').onclick = probar;
  $('btSalir').onclick = function(){
    if(!confirm('¿Salir? Te va a volver a pedir el código.')) return;
    lsDel(LS_COD); location.reload();
  };
  $('gvFoto').onchange = function(){
    var f = this.files && this.files[0];
    if(!f){ FOTO = null; $('gvFotoV').innerHTML = ''; return; }
    if(!/^image\//.test(f.type||'')){ alert('Eso no parece una foto.'); this.value=''; return; }
    FOTO = f;
    var kb = Math.round(f.size/1024);
    var url = URL.createObjectURL(f);
    $('gvFotoV').innerHTML = '<img src="' + url + '" class="mini"> <span class="nota">' + kb + ' KB</span> '
      + '<button class="sec chico" onclick="FOTO=null;document.getElementById(\'gvFoto\').value=\'\';document.getElementById(\'gvFotoV\').innerHTML=\'\';">✕ Sacar</button>';
  };
  var guardado = lsGet(LS_COD);
  if(guardado){
    abrirCon(guardado).then(arrancarApp, function(){ lsDel(LS_COD); });
  }
  window.addEventListener('online', function(){ flush(); });
  setInterval(function(){ if(CODIGO && !SOLOVER) flush(); }, 30000);
});
