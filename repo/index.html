", LS='repo_cod';
function b2u(b){var s=atob(b),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
async function deriv(cod){
  var m=await crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveBits']);
  var b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(SAL+VNUM),iterations:200000,hash:'SHA-256'},m,256);
  return new Uint8Array(b);
}
async function unSobre(b64,kb){
  var raw=b2u(b64);
  var iv=raw.subarray(1,13), ct=raw.subarray(13);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']);
  var gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
  var ds=new DecompressionStream('gzip');
  var st=new Blob([gz]).stream().pipeThrough(ds);
  return await new Response(st).text();
}
async function abrir(cod){
  var BL=JSON.parse(document.getElementById('cif').textContent.trim());
  var kb=await deriv(cod);
  for(var i=0;i<BL.length;i++){
    try{ var t=await unSobre(BL[i].b,kb); if(BL[i].q) try{localStorage.setItem('rp_quien',BL[i].q);}catch(x){} return t; }catch(e){}
  }
  throw new Error('no abre');
}
function arrancarRepo(txt){
  document.getElementById('datos').textContent=txt;
  var p=document.getElementById('puerta'); if(p) p.parentNode.removeChild(p);
  var rt=decodeURIComponent(escape(atob(document.getElementById('rt').textContent.trim())));
  (0,eval)(rt);
}
async function probar(cod, callado){
  var e=document.getElementById('er');
  try{
    var t=await abrir(cod);
    try{ localStorage.setItem(LS, cod); }catch(x){}
    arrancarRepo(t); return true;
  }catch(x){ if(!callado && e) e.textContent='Ese c\u00f3digo no abre. Fijate que est\u00e9 completo.'; return false; }
}
(function(){
  var g=null; try{ g=localStorage.getItem(LS); }catch(x){}
  if(g) probar(g, 1);
  var b=document.getElementById('btn'), i=document.getElementById('cod');
  if(b) b.addEventListener('click', function(){ probar(String(i.value||'').trim().toUpperCase()); });
  if(i) i.addEventListener('keydown', function(ev){ if(ev.key==='Enter') b.click(); });
})();
