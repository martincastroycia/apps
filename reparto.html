gin-top:12px}\n  .modalBtns button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}\n  #mCopiar{background:var(--na);color:#fff} #mCerrar{background:#e5e7eb;color:#111}\n  #pegar{width:100%;min-height:90px;padding:10px;border:1px solid var(--bord);border-radius:9px;font-size:14px;font-family:monospace}\n  #btnCargar{margin-top:8px;width:100%;padding:13px;border:none;border-radius:10px;background:var(--ver);color:#fff;font-size:16px;font-weight:800;cursor:pointer}\n  #hojaControl{display:none}\n  @media print{\n    body{background:#fff}\n    body>header,body>main,body>.barra{display:none!important}\n    #hojaControl{display:block!important;font-size:13px;color:#000}\n    @page{size:A4;margin:10mm}\n    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  }\n  #hojaControl{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  #hojaControl .hc-head{font-size:18px;font-weight:800;border:2px solid #000;padding:7px 10px;margin-bottom:7px;display:flex;justify-content:space-between}\n  #hojaControl .hc-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n  #hojaControl table{width:100%;border-collapse:collapse;margin-bottom:9px}\n  #hojaControl th,#hojaControl td{border:1px solid #000;padding:4px 7px;font-size:13px}\n  #hojaControl th{background:#eee;text-align:left}\n  #hojaControl td.n{text-align:right;font-variant-numeric:tabular-nums}\n  #hojaControl .sec{font-weight:800;background:#333;color:#fff;padding:4px 7px;font-size:13px}\n  #hojaControl tr.tt td{font-weight:800;background:#f0f0f0}\n  #hojaControl tr{break-inside:avoid}\n  #hojaControl .big{font-size:17px;font-weight:800;border:2px solid #000;padding:7px 10px;margin-top:7px;display:flex;justify-content:space-between}\n<\/style><\/head>\n<body>\n<header>\n  <div class=\"t\"><h1>Reparto — <span id=\"hChofer\"><\/span><\/h1><div class=\"fe\">__FECHA__<\/div><\/div>\n  <div class=\"sel\" id=\"selChofer\"><\/div>\n  <div class=\"mini\">\n    <span>Boletas <b id=\"mBol\">0<\/b><\/span>\n    <span>Efectivo <b id=\"mEfe\">$0<\/b><\/span>\n    <span>Transfer. <b id=\"mTra\">$0<\/b><\/span>\n    <span>Cheque <b id=\"mChq\">$0<\/b><\/span>\n    <span>Fiado <b id=\"mFia\">$0<\/b><\/span>\n  <\/div>\n<\/header>\n<main>\n  <div class=\"hint\">Elegí el chofer arriba. Ya está <b>todo en Efectivo<\/b>: en cada boleta marcá solo <b>Fiado<\/b> o <b>Devolución<\/b> si corresponde. Las <b>transferencias<\/b> y <b>cheques<\/b> se anotan más abajo con el importe REAL. El efectivo y el total a rendir se calculan solos.<\/div>\n  <div class=\"hint\" style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;background:#eef7ee;border:1px solid #cfe6cf;border-radius:9px;padding:7px 10px\"><span>\\u2705 Se guarda solo en este tel\\u00e9fono: aunque se cierre o recargue, <b>no perd\\u00e9s lo marcado<\/b>.<\/span><button id=\"btnReset\" type=\"button\" style=\"flex:none;padding:6px 10px;border:1px solid #e6bcbc;background:#fff;border-radius:8px;font-size:12px;color:#b91c1c;cursor:pointer\">\\ud83d\\uddd1 Empezar de nuevo<\/button><\/div>\n  <div class=\"buscador\"><input id=\"buscaCli\" inputmode=\"search\" placeholder=\"🔎 Buscar cliente por nombre...\"><\/div>\n  <div id=\"lista\"><\/div>\n\n  <section class=\"blq\">\n    <h2>Transferencias<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Anotá cada transferencia: <b>cliente<\/b>, <b>importe EXACTO<\/b> como figura en el comprobante (la foto) y la <b>fecha<\/b> (viene el día siguiente por defecto). Así cruza solo con el banco.<\/div>\n    <div id=\"traList\"><\/div>\n    <button id=\"traAdd\" class=\"cobAddBtn\" style=\"border-color:#1d4ed8;color:#1d4ed8\">+ Agregar transferencia<\/button>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Cheques<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Cliente e importe del cheque.<\/div>\n    <div id=\"chqList\"><\/div>\n    <button id=\"chqAdd\" class=\"cobAddBtn\" style=\"border-color:#6d28d9;color:#6d28d9\">+ Agregar cheque<\/button>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Devoluciones parciales<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Si el cliente devolvió <b>solo una parte<\/b> de la boleta (rechazo parcial): poné el <b>importe<\/b> de lo que devolvió, y el cliente si lo sabés. Si no, dejalo <b>sin nombre<\/b>. Se descuenta del efectivo a rendir.<\/div>\n    <div id=\"dpList\"><\/div>\n    <button id=\"dpAdd\" class=\"cobAddBtn\" style=\"border-color:#64748b;color:#475569\">+ Agregar devolución parcial<\/button>\n  <\/section>\n\n  <div class=\"rsm\">\n    <h2>Resumen<\/h2>\n    <div class=\"grp\"><div class=\"gh fia\"><span>Fiados<\/span><span id=\"rFiaTot\">$0<\/span><\/div><div id=\"rFiaLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh tra\"><span>Transferencias<\/span><span id=\"rTraTot\">$0<\/span><\/div><div id=\"rTraLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh chq\"><span>Cheques<\/span><span id=\"rChqTot\">$0<\/span><\/div><div id=\"rChqLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh dev\"><span>Devoluciones (no entregadas)<\/span><span id=\"rDevTot\">$0<\/span><\/div><div id=\"rDevLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh dev\"><span>Devoluciones parciales<\/span><span id=\"rDevPTot\">$0<\/span><\/div><div id=\"rDevPLista\"><\/div><\/div>\n  <\/div>\n\n  <section class=\"blq\">\n    <h2>Conteo de efectivo<\/h2>\n    <div id=\"denoms\"><\/div>\n    <div class=\"lin\"><span>Efectivo contado<\/span><b id=\"efeContado\">$0<\/b><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Gastos<\/h2>\n    <div class=\"lin\"><label>Gastos<\/label><input id=\"gGastos\" inputmode=\"decimal\" placeholder=\"0\"><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Otros / Cobrado<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Plata que <b>no es gasto común<\/b>: adelantos, impuestos, o lo que se <b>cobró de días anteriores<\/b>. Poné el concepto y el importe. <b>Suma<\/b> al total igual que Gastos, para que la rendición dé exacta.<\/div>\n    <div id=\"otrList\"><\/div>\n    <button id=\"otrAdd\" class=\"cobAddBtn\" style=\"border-color:#0a7c3a;color:#0a7c3a\">+ Agregar<\/button>\n    <div class=\"cobTot\">Total otros / cobrado: <span id=\"otrTotV\">$0<\/span><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Cobrar mañana<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Lo que quedó sin cobrar y hay que pasarle al chofer para el otro día.<\/div>\n    <div id=\"cobList\"><\/div>\n    <button id=\"cobAdd\" class=\"cobAddBtn\">+ Agregar<\/button>\n    <div class=\"cobTot\">Total a cobrar: <span id=\"cobTotV\">$0<\/span><\/div>\n  <\/section>\n\n  <div class=\"tot\">\n    <div class=\"r\"><span>Total boletas<\/span><b id=\"tTotal\">$0<\/b><\/div>\n    <div class=\"r\"><span>Devoluciones (no entregadas)<\/span><b id=\"tDev\">$0<\/b><\/div>\n    <div class=\"r\"><span>Devol. parciales<\/span><b id=\"tDevP\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo cobrado<\/span><b id=\"tEfe\">$0<\/b><\/div>\n    <div class=\"r\"><span>Transferencias<\/span><b id=\"tTra\">$0<\/b><\/div>\n    <div class=\"r\"><span>Cheques<\/span><b id=\"tChq\">$0<\/b><\/div>\n    <div class=\"r\"><span>Fiados<\/span><b id=\"tFia\">$0<\/b><\/div>\n    <div class=\"r\"><span>A cobrar (mañana)<\/span><b id=\"tCob\">$0<\/b><\/div>\n    <div class=\"r\"><span>Gastos<\/span><b id=\"tGas\">$0<\/b><\/div>\n    <div class=\"r\"><span>Otros / Cobrado<\/span><b id=\"tOtr\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo a rendir (cobrado − gastos − otros)<\/span><b id=\"tRendir\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo contado<\/span><b id=\"tContado\">$0<\/b><\/div>\n    <div class=\"r big\"><span>Diferencia efectivo<\/span><b id=\"tDif\" class=\"dif ok\">$0<\/b><\/div>\n  <\/div>\n  <section class=\"blq\">\n    <h2>Oficina: pegar rendición del chofer<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Pegá acá el texto que te mandó el chofer por WhatsApp y tocá Cargar. Se elige solo el chofer y podés tocar \"Imprimir control\".<\/div>\n    <textarea id=\"pegar\" placeholder=\"Pegar acá el resumen del chofer...\"><\/textarea>\n    <button id=\"btnCargar\">Cargar para imprimir<\/button>\n  <\/section>\n<\/main>\n<div class=\"barra\">\n  <button id=\"bCopiar\">Copiar resumen<\/button>\n  <button id=\"bImprimir\">Imprimir control<\/button>\n<\/div>\n<div id=\"modalCopiar\" class=\"modal\"><div class=\"modalBox\"><div class=\"modalTit\">Resumen de <span id=\"mQuien\"><\/span><\/div><div class=\"modalHint\">Tocá <b>Copiar<\/b> y pegalo en el WhatsApp de la oficina. Si no copia, mantené apretado el texto de abajo y elegí Seleccionar todo &gt; Copiar.<\/div><textarea id=\"mTexto\" readonly><\/textarea><div class=\"modalBtns\"><button id=\"mCopiar\">Copiar<\/button><button id=\"mCerrar\">Cerrar<\/button><\/div><\/div><\/div>\n<div id=\"hojaControl\"><\/div>\n\n<script>\n'use strict';\nconst FECHA='__FECHA__';\nconst FECHA_ENTREGA='__FECHA_ENTREGA__';\nconst CHOFERES=__CHOFERES__;\nconst DEN=[20000,10000,2000,1000,500,200,100,50,20,10];\nfunction nuevoEstado(bol){ return {st:bol.map(b=>({...b,dev:0,modo:(b.imp<0?'nc':'efe'),efeM:0,traM:0,chqM:0,feTra:((b.imp<0?b.fe:(FECHA_ENTREGA||b.fe)))})), denCant:{}, cobrar:[{txt:'',imp:0}], otros:[{txt:'',imp:0}], gastos:0, transf:[], cheques:[], devparc:[]}; }\nfunction _normEstado(e){ if(!e) return e; if(!Array.isArray(e.transf)) e.transf=[]; if(!Array.isArray(e.cheques)) e.cheques=[]; if(!Array.isArray(e.devparc)) e.devparc=[]; if(!Array.isArray(e.cobrar)||!e.cobrar.length) e.cobrar=[{txt:'',imp:0}]; if(!Array.isArray(e.otros)||!e.otros.length) e.otros=[{txt:'',imp:0}]; return e; }\nconst STATE={}; Object.keys(CHOFERES).forEach(ch=>STATE[ch]=nuevoEstado(CHOFERES[ch]));\nvar LSKEY='planillaRep_'+String(FECHA).replace(/\\W/g,'')+'_'+Object.keys(CHOFERES).join('-');\n// Guarda el avance en DOS lugares: (1) el guardado normal del tel\\u00e9fono (localStorage) y\n// (2) un respaldo en la propia direcci\\u00f3n de la p\\u00e1gina (#), que sobrevive al refresco aunque\n// el navegador bloquee el guardado normal \\u2014 t\\u00edpico al abrir el archivo \"suelto\" en el celular.\nfunction _guardarStr(s){\n  try{ localStorage.setItem(LSKEY, s); }catch(e){}\n  try{ history.replaceState(null,'', location.pathname+location.search+'#d='+encodeURIComponent(s)); }\n  catch(e){ try{ location.hash='d='+encodeURIComponent(s); }catch(e2){} }\n}\nfunction _leerStr(){\n  var s=null;\n  try{ var h=location.hash||''; if(h.indexOf('#d=')===0) s=decodeURIComponent(h.slice(3)); else if(h.indexOf('d=')===0) s=decodeURIComponent(h.slice(2)); }catch(e){}\n  if(!s){ try{ s=localStorage.getItem(LSKEY); }catch(e){} }\n  return s;\n}\n(function(){ try{ var g=_leerStr(); if(!g) return; var sv=JSON.parse(g); if(sv && Object.keys(sv).sort().join()===Object.keys(CHOFERES).sort().join()){ Object.keys(sv).forEach(function(ch){ if(STATE[ch] && sv[ch] && sv[ch].st && sv[ch].st.length===STATE[ch].st.length) STATE[ch]=_normEstado(sv[ch]); }); } }catch(e){} })();\nvar _lsT; function guardarLS(){ clearTimeout(_lsT); _lsT=setTimeout(function(){ try{ _guardarStr(JSON.stringify(STATE)); }catch(e){} }, 400); }\nfunction guardarYa(){ try{ clearTimeout(_lsT); _guardarStr(JSON.stringify(STATE)); }catch(e){} }\nfunction borrarLS(){ try{ localStorage.removeItem(LSKEY); }catch(e){} try{ history.replaceState(null,'', location.pathname+location.search); }catch(e){} }\n// Guardar JUSTO antes de que la p\\u00e1gina se vaya a segundo plano o se cierre (sin esperar la demora).\ndocument.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') guardarYa(); });\nwindow.addEventListener('pagehide', guardarYa);\nwindow.addEventListener('beforeunload', guardarYa);\ndocument.addEventListener('DOMContentLoaded',function(){ var _br=document.getElementById('btnReset'); if(_br) _br.onclick=function(){ if(confirm('\\u00bfEmpezar de nuevo? Se borra TODO lo que marcaste en esta planilla.')){ borrarLS(); location.reload(); } }; });\nlet act=Object.keys(CHOFERES)[0];\nlet filtro='';\nlet ajOpen=new Set();\nfunction A(){ return STATE[act]; }\nfunction money(n){ n=Math.round((n||0)); return '$'+n.toLocaleString('es-AR'); }\nfunction numAR(v){ v=String(v==null?'':v).replace(/[^\\d.,-]/g,''); if(!v) return 0; var ld=v.lastIndexOf('.'),lc=v.lastIndexOf(','); if(ld>=0&&lc>=0){ if(lc>ld) v=v.replace(/\\./g,'').replace(',','.'); else v=v.replace(/,/g,''); } else if(lc>=0){ v=v.replace(',','.'); } else { var pz=v.split('.'); if(pz.length>2){ v=pz.join(''); } else if(pz[1]&&pz[1].length===3){ v=pz.join(''); } } var n=parseFloat(v); return isNaN(n)?0:n; }\nfunction neto(x){ return Math.max(0,(x.imp||0)-(x.dev||0)); }\nfunction feCortaT(s){ if(!s) return ''; var p=String(s).split('-'); return p.length===3?(p[2]+'/'+p[1]):s; }\nfunction parte(x){\n  // Modelo simple: la boleta es Efectivo por defecto; se marca solo Fiado o Devolución.\n  // Las transferencias y cheques van en sus listas aparte (no pegados a la boleta).\n  if(x.modo==='dev') return {efe:0,tra:0,chq:0,fia:0};\n  if(x.modo==='nc') return {efe:0,tra:0,chq:0,fia:(x.tomar?(x.imp||0):0)};\n  const nt=neto(x);\n  if(x.modo==='fia') return {efe:0,tra:0,chq:0,fia:nt};\n  return {efe:nt,tra:0,chq:0,fia:0};   // efe (default)\n}\nfunction devMonto(x){ return x.modo==='dev' ? (x.imp||0) : (x.dev||0); }\nfunction clientesDe(){ var seen={},out=[]; (A().st||[]).forEach(function(x){ var c=(x.cli||'').trim(); if(c && !seen[c]){ seen[c]=1; out.push(c); } }); out.sort(); return out; }\nfunction optCli(sel){ return '<option value=\"\">— cliente —<\/option>'+clientesDe().map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+c.replace(/\"/g,'&quot;')+'<\/option>'; }).join(''); }\n\nfunction pintarSelector(){\n  const S=document.getElementById('selChofer'); S.innerHTML='';\n  Object.keys(CHOFERES).forEach(ch=>{\n    const b=document.createElement('button'); b.textContent=ch+' ('+CHOFERES[ch].length+')';\n    if(ch===act) b.className='on';\n    b.onclick=()=>{ act=ch; pintarTodo(); };\n    S.appendChild(b);\n  });\n  document.getElementById('hChofer').textContent=act;\n}\nfunction pintarLista(){\n  const L=document.getElementById('lista'); L.innerHTML='';\n  A().st.forEach((x,i)=>{\n    if(x.modo==='nc'){\n      const c=document.createElement('div'); c.className='card'; c.style.opacity=x.tomar?'1':'.82'; c.dataset.search=((x.cli||'')+' '+x.n+' '+(x.dir||'')).toUpperCase();\n      c.innerHTML='<div class=\"cli\">'+x.cli+'<\/div><div class=\"meta\">Boleta '+x.n+' · Vend '+x.vend+' · '+(x.dir||'')+'<\/div><div class=\"imp\">'+money(x.imp)+'<\/div>'\n        +'<div style=\"margin-top:8px;font-weight:800;color:#b91c1c\">NOTA DE CRÉDITO / RECHAZO<\/div>'\n        +'<button class=\"btDev'+(x.tomar?' on':'')+'\" data-nctake=\"'+i+'\" style=\"margin-top:8px\">'+(x.tomar?'✔ Se toma como nota de crédito (tocá para sacar)':'Tomar esta nota de crédito')+'<\/button>'\n        +'<div style=\"font-size:13px;color:#556;margin-top:6px\">'+(x.tomar?('Se aplicará al cliente como nota de crédito ('+money(x.imp)+').'):'No se cobra ni va a fiados. Tildá solo si hay que tomarla (caso puntual).')+'<\/div>';\n      L.appendChild(c); return;\n    }\n    const c=document.createElement('div'); c.className='card'+(x.modo==='dev'?' dev':(x.modo==='fia'?' fiaC':'')); c.dataset.search=((x.cli||'')+' '+x.n+' '+(x.dir||'')).toUpperCase();\n    c.innerHTML=`\n      <div class=\"cli\">${x.cli}<\/div>\n      <div class=\"meta\">Boleta ${x.n} · Vend ${x.vend} · ${x.dir||''}<\/div>\n      <div class=\"imp\">${money(x.imp)}<\/div>\n      <div class=\"bts\">\n        <button class=\"fia ${x.modo==='fia'?'on':''}\" data-i=\"${i}\" data-m=\"fia\">Fiado<\/button>\n        <button class=\"dev2 ${x.modo==='dev'?'on':''}\" data-dev=\"${i}\">Devolución<\/button>\n      <\/div>\n      ${x.modo==='dev'?'':`<button class=\"ajLink\" data-dp=\"${i}\">${(x.dev>0)?('↩ Devolvió '+money(x.dev)+' — editar'):'↩ Devolución parcial'}<\/button>\n      <div class=\"aj${((x.dev>0)||ajOpen.has(i))?' open':''}\"><div class=\"fila\"><label>Devolvió (parte de la boleta)<\/label><input inputmode=\"decimal\" data-dpimp=\"${i}\" value=\"${x.dev||''}\" placeholder=\"0\"><\/div><div class=\"res\">Queda para <b>${x.modo==='fia'?'fiar':'cobrar'}<\/b>: <b>${money(neto(x))}<\/b><\/div><\/div>`}\n      <div class=\"estadoBol\"><\/div>`;\n    L.appendChild(c); refrescarCard(c,x);\n  });\n  L.querySelectorAll('.bts button[data-m]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.i,x=A().st[i];\n    x.modo = (x.modo==='fia') ? 'efe' : 'fia'; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.dev,x=A().st[i];\n    x.modo = x.modo==='dev'?'efe':'dev'; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-nctake]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.nctake,x=A().st[i]; x.tomar=!x.tomar; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.dp; if(ajOpen.has(i)) ajOpen.delete(i); else ajOpen.add(i); pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dpimp]').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.dpimp,x=A().st[i]; var v=numAR(inp.value); if(v<0)v=0; if(v>(x.imp||0))v=x.imp||0; x.dev=v;\n    var card=inp.closest('.card'); if(card){ var r=card.querySelector('.res b:last-child'); if(r) r.textContent=money(neto(x)); refrescarCard(card,x); } actualizar();\n  });\n  aplicarFiltro();\n}\nfunction aplicarFiltro(){\n  const q=(filtro||'').trim().toUpperCase();\n  let vis=0;\n  document.querySelectorAll('#lista .card').forEach(c=>{ const ok=(!q||(c.dataset.search||'').includes(q)); c.style.display=ok?'':'none'; if(ok) vis++; });\n  let sr=document.getElementById('sinRes');\n  if(q && vis===0){ if(!sr){ sr=document.createElement('div'); sr.id='sinRes'; sr.className='sinres'; sr.textContent='No hay clientes con ese nombre en este chofer.'; document.getElementById('lista').appendChild(sr); } }\n  else if(sr){ sr.remove(); }\n}\nfunction refrescarCard(c,x){\n  var txt;\n  if(x.modo==='dev'){ txt='↩ DEVOLUCIÓN TOTAL (no entregada)'; }\n  else {\n    var nt=neto(x);\n    if(x.modo==='fia') txt=(x.dev>0)?('↩ Devolvió '+money(x.dev)+' · ✔ FIADO '+money(nt)+' a la cuenta de '+x.cli):('✔ FIADO — va a la cuenta de '+x.cli);\n    else txt=(x.dev>0)?('↩ Devolvió '+money(x.dev)+' · ✔ Efectivo '+money(nt)):'✔ Efectivo';\n  }\n  var e=c.querySelector('.estadoBol'); if(e) e.textContent=txt;\n}\nfunction pintarDenoms(){\n  const D=document.getElementById('denoms'); D.innerHTML='';\n  DEN.forEach(v=>{\n    const row=document.createElement('div'); row.className='den';\n    row.innerHTML=`<span>Billetes x ${v.toLocaleString('es-AR')}<\/span>\n      <input inputmode=\"numeric\" data-den=\"${v}\" placeholder=\"0\" value=\"${A().denCant[v]||''}\">\n      <span class=\"sub\" id=\"sub${v}\">${money((A().denCant[v]||0)*v)}<\/span>`;\n    D.appendChild(row);\n  });\n  D.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const v=+inp.dataset.den; A().denCant[v]=parseInt((inp.value||'0').replace(/\\D/g,''))||0;\n    document.getElementById('sub'+v).textContent=money(A().denCant[v]*v); actualizar();\n  });\n}\nfunction pintarCobrar(){\n  const C=document.getElementById('cobList'); C.innerHTML='';\n  A().cobrar.forEach((o,i)=>{\n    const row=document.createElement('div'); row.className='cobrow';\n    row.innerHTML=`<input data-ci=\"${i}\" data-cf=\"txt\" placeholder=\"Cliente / boleta\" value=\"${(o.txt||'').replace(/\"/g,'&quot;')}\">\n      <input class=\"m\" inputmode=\"decimal\" data-ci=\"${i}\" data-cf=\"imp\" placeholder=\"0\" value=\"${o.imp||''}\">\n      <button class=\"del\" data-cdel=\"${i}\">×<\/button>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.ci,f=inp.dataset.cf;\n    A().cobrar[i][f]= f==='imp' ? numAR(inp.value) : inp.value;\n    actualizar();\n  });\n  C.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ A().cobrar.splice(+b.dataset.cdel,1); if(!A().cobrar.length) A().cobrar=[{txt:'',imp:0}]; pintarCobrar(); actualizar(); });\n}\nfunction pintarOtros(){\n  const C=document.getElementById('otrList'); if(!C) return; C.innerHTML='';\n  if(!Array.isArray(A().otros)||!A().otros.length) A().otros=[{txt:'',imp:0}];\n  A().otros.forEach((o,i)=>{\n    const row=document.createElement('div'); row.className='cobrow';\n    row.innerHTML=`<input data-oi=\"${i}\" data-of=\"txt\" placeholder=\"Concepto (ej: adelanto impuesto)\" value=\"${(o.txt||'').replace(/\"/g,'&quot;')}\">\n      <input class=\"m\" inputmode=\"decimal\" data-oi=\"${i}\" data-of=\"imp\" placeholder=\"0\" value=\"${o.imp||''}\">\n      <button class=\"del\" data-odel=\"${i}\">×<\/button>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.oi,f=inp.dataset.of;\n    A().otros[i][f]= f==='imp' ? numAR(inp.value) : inp.value;\n    actualizar();\n  });\n  C.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{ A().otros.splice(+b.dataset.odel,1); if(!A().otros.length) A().otros=[{txt:'',imp:0}]; pintarOtros(); actualizar(); });\n}\nfunction pintarTra(){\n  const C=document.getElementById('traList'); if(!C) return; C.innerHTML='';\n  (A().transf||[]).forEach((t,i)=>{\n    const row=document.createElement('div'); row.className='trow';\n    row.innerHTML=`<div class=\"r1\"><select data-ti=\"${i}\">${optCli(t.cli)}<\/select><button class=\"del\" data-tdel=\"${i}\">×<\/button><\/div>\n      <div class=\"r2\"><input class=\"m\" inputmode=\"decimal\" data-tm=\"${i}\" placeholder=\"importe real (foto)\" value=\"${t.imp||''}\">\n      <input class=\"fe\" type=\"date\" data-tfe=\"${i}\" value=\"${t.fe||FECHA_ENTREGA||''}\"><\/div>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('select[data-ti]').forE actualizar(); };\ndocument.getElementById('buscaCli').oninput=function(){ filtro=this.value; aplicarFiltro(); };\nfunction copiarTexto(txt){\n  const ta=document.getElementById('mTexto'); ta.focus(); ta.select();\n  try{ ta.setSelectionRange(0,999999); }catch(e){}\n  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}\n  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; } }catch(e){}\n  return ok;\n}\ndocument.getElementById('bCopiar').onclick=()=>{\n  document.getElementById('mQuien').textContent=act;\n  document.getElementById('mTexto').value=resumen();\n  document.getElementById('modalCopiar').classList.add('on');\n  setTimeout(()=>{ const ta=document.getElementById('mTexto'); ta.focus(); ta.select(); try{ta.setSelectionRange(0,999999);}catch(e){} },60);\n};\ndocument.getElementById('mCopiar').onclick=()=>{ const ok=copiarTexto(document.getElementById('mTexto').value); alert(ok?'Copiado. Pegalo en el WhatsApp de la oficina.':'No pude copiar solo: mantené apretado el texto, Seleccionar todo, Copiar.'); };\ndocument.getElementById('mCerrar').onclick=()=>document.getElementById('modalCopiar').classList.remove('on');\ndocument.getElementById('bImprimir').onclick=()=>{ armarHoja(); window.print(); };\nwindow.onbeforeprint=armarHoja;\nfunction cargarRendicion(txt){\n  const m=txt.match(/\\[REND\\]\\s*(\\{[\\s\\S]*\\})/);\n  if(!m){ alert('No encontré los datos. Pegá el resumen COMPLETO del chofer (tiene que terminar con [REND] {...}).'); return; }\n  let d; try{ d=JSON.parse(m[1]); }catch(e){ alert('El texto está cortado. Pedile al chofer que lo copie de nuevo entero.'); return; }\n  if(!STATE[d.ch]){ alert('El chofer \"'+d.ch+'\" no está en este archivo.'); return; }\n  const S=STATE[d.ch], byN={}; S.st.forEach(x=>byN[x.n]=x);\n  (d.b||[]).forEach(o=>{ const x=byN[o.n]; if(!x||x.modo==='nc') return; x.modo=(o.dev>0)?'dev':((o.fia>0)?'fia':'efe'); x.dev=o.dev||0; });\n  S.transf=(d.tr||[]).map(t=>({cli:t.cli||'',imp:t.imp||0,fe:t.fe||''}));\n  S.cheques=(d.chq||[]).map(t=>({cli:t.cli||'',imp:t.imp||0}));\n  S.devparc=(d.dp||[]).map(t=>({cli:t.cli||'',imp:t.imp||0}));\n  S.denCant=d.den||{}; S.gastos=d.gas||0; S.cobrar=(d.cob&&d.cob.length)?d.cob:[{txt:'',imp:0}]; S.otros=(d.otr&&d.otr.length)?d.otr:[{txt:'',imp:0}];\n  act=d.ch; pintarTodo();\n  window.scrollTo(0,0);\n  alert('Cargada la rendición de '+d.ch+'. Revisá y tocá \"Imprimir control\".');\n}\ndocument.getElementById('btnCargar').onclick=()=>cargarRendicion(document.getElementById('pegar').value||'');\npintarTodo();\n<\/script>\n<\/body><\/html>\n";
var SAL='castro-reparto:';
var firebaseConfig={apiKey:"AIzaSyDXqLbTAA9TCkUgMJpKrDxkvDMNBzmjTIQ",authDomain:"castro-cobranzas.firebaseapp.com",projectId:"castro-cobranzas",storageBucket:"castro-cobranzas.firebasestorage.app",messagingSenderId:"30596915316",appId:"1:30596915316:web:7a4b57f28342b1e3a3b121"};
var db=null, CHOFER='', CODIGO='', REPS=[];
function $(id){return document.getElementById(id);}
function feTxt(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):iso; }
function b64bytes(b64){var s=atob(b64),u=new Uint8Array(s.length);for(var i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u;}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}

async function derivar(cod,id){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(SAL+id),iterations:200000,hash:'SHA-256'},mat,256);
  return new Uint8Array(bits);
}
async function descifrar(bytes,cod,id){
  var kb=await derivar(cod,id);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']);
  var iv=bytes.subarray(1,13), ct=bytes.subarray(13);
  var gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
  var ds=new DecompressionStream('gzip');
  var stm=new Blob([gz]).stream().pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stm).arrayBuffer());
}
function idDeCodigo(cod){ var m=String(cod||'').trim().toUpperCase().match(/^([A-ZÑ0-9]+)\s*-/); return m?m[1]:null; }
function rendidoKey(fe){ return 'repRendido_'+CHOFER+'_'+fe; }
function estaRendido(fe){ try{ return localStorage.getItem(rendidoKey(fe))==='1'; }catch(e){ return false; } }
window.marcarRendido=function(fe,val){ try{ localStorage.setItem(rendidoKey(fe), val?'1':'0'); }catch(e){} pintar(); };

function conectar(){
  try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); return true; }
  catch(e){ try{ db=firebase.firestore(); return true; }catch(e2){ return false; } }
}
async function cargarRepartos(){
  $('avi').textContent='Buscando tus repartos…';
  if(!db && !conectar()){ $('avi').textContent='⚠ Sin conexión. Abrí la app con señal para bajar el reparto.'; return; }
  try{
    var snap=await db.collection('repartos').where('ch','==',CHOFER).get();
    var arr=[]; snap.forEach(function(d){ var o=d.data()||{}; o._id=d.id; arr.push(o); });
    arr.sort(function(a,b){ return String(b.fe||'').localeCompare(String(a.fe||'')); });
    var out=[];
    for(var i=0;i<arr.length && i<15;i++){
      try{ var txt=await descifrar(b64bytes(arr[i].b), CODIGO, CHOFER); out.push(JSON.parse(txt)); }catch(e){}
    }
    REPS=out;
    $('avi').textContent = out.length? 'Tocá el reparto que vas a hacer. El de otro día queda intacto, con lo que ya cargaste.' : 'Todavía no hay repartos para vos.';
    pintar();
  }catch(e){ $('avi').textContent='⚠ No se pudieron bajar los repartos. Revisá internet. ('+(e&&e.message||e)+')'; }
}
function pintar(){
  var L=$('lista');
  if(!REPS.length){ L.innerHTML='<div class="vac">Sin repartos por ahora.</div>'; return; }
  L.innerHTML=REPS.map(function(r,i){
    var rend=estaRendido(r.fe);
    var tot=(r.b||[]).reduce(function(a,x){return a+(+x.imp||0);},0);
    return '<div class="rep'+(rend?' rendido':'')+'">'
      + '<div><div class="fe">Reparto del '+feTxt(r.fe)+'</div>'
      + '<div class="meta">'+(r.b||[]).length+' boletas · $'+Math.round(tot).toLocaleString('es-AR')+'</div>'
      + '<div class="est">'+(rend?'✔ ya rendido':'sin rendir')+'</div>'
      + '<button class="chico" onclick="marcarRendido(\''+r.fe+'\','+(rend?'false':'true')+')">'+(rend?'marcar como sin rendir':'marcar como rendido')+'</button></div>'
      + '<button onclick="abrir('+i+')">Abrir</button></div>';
  }).join('');
}
window.abrir=function(i){
  var r=REPS[i]; if(!r) return;
  var chObj={}; chObj[r.ch]=r.b||[];
  var html=PLANILLA.replace(/__CHOFERES__/g, JSON.stringify(chObj))
                   .replace(/__FECHA_ENTREGA__/g, r.feEnt||r.fe)
                   .replace(/__FECHA__/g, feTxt(r.fe));
  $('vTit').textContent='Reparto del '+feTxt(r.fe);
  $('marco').srcdoc=html;
  $('vista').style.display='flex';
};
$('bVolver').onclick=function(){ $('vista').style.display='none'; $('marco').srcdoc=''; pintar(); };

$('pEntrar').onclick=async function(){
  var b=$('pEntrar'), e=$('pErr'); e.textContent=''; b.disabled=true; b.textContent='Abriendo…';
  var cod=String($('pCod').value||'').trim().toUpperCase();
  var id=idDeCodigo(cod);
  if(!id){ e.textContent='El código va como LUCAS-ABCD2345.'; b.disabled=false; b.textContent='Entrar'; return; }
  if(!db && !conectar()){ e.textContent='Sin conexión. Probá con señal.'; b.disabled=false; b.textContent='Entrar'; return; }
  try{
    var snap=await db.collection('repartos').where('ch','==',id).get();
    var ok=false, docs=[];
    snap.forEach(function(d){ docs.push(d.data()||{}); });
    for(var i=0;i<docs.length;i++){ try{ await descifrar(b64bytes(docs[i].b), cod, id); ok=true; break; }catch(x){} }
    if(!docs.length){ e.textContent='Todavía no hay reparto para ese código. Pedí que te lo manden.'; b.disabled=false; b.textContent='Entrar'; return; }
    if(!ok){ e.textContent='Código incorrecto. Fijate que esté bien escrito.'; b.disabled=false; b.textContent='Entrar'; return; }
    CHOFER=id; CODIGO=cod;
    try{ localStorage.setItem('castro_rep_cod', cod); }catch(x){}
    $('puerta').style.display='none'; $('hTit').textContent='Reparto — '+CHOFER;
    cargarRepartos();
  }catch(err){ e.textContent='No se pudo entrar. Revisá internet.'; b.disabled=false; b.textContent='Entrar'; }
};
$('pCod').addEventListener('keydown',function(ev){ if(ev.key==='Enter') $('pEntrar').click(); });
$('bSalir').onclick=function(){ try{ localStorage.removeItem('castro_rep_cod'); }catch(x){} location.reload(); };

(function(){
  var g=null; try{ g=localStorage.getItem('castro_rep_cod'); }catch(x){}
  if(!g) return;
  var id=idDeCodigo(g); if(!id) return;
  CHOFER=id; CODIGO=g;
  $('puerta').style.display='none'; $('hTit').textContent='Reparto — '+CHOFER;
  cargarRepartos();
})();
</script>
