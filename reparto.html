gin-top:12px}\n  .modalBtns button{flex:1;padding:14px;border:none;border-radius:10px;font-size:16px;font-weight:800;cursor:pointer}\n  #mCopiar{background:var(--na);color:#fff} #mCerrar{background:#e5e7eb;color:#111}\n  #pegar{width:100%;min-height:90px;padding:10px;border:1px solid var(--bord);border-radius:9px;font-size:14px;font-family:monospace}\n  #btnCargar{margin-top:8px;width:100%;padding:13px;border:none;border-radius:10px;background:var(--ver);color:#fff;font-size:16px;font-weight:800;cursor:pointer}\n  #hojaControl{display:none}\n  @media print{\n    body{background:#fff}\n    body>header,body>main,body>.barra{display:none!important}\n    #hojaControl{display:block!important;font-size:13px;color:#000}\n    @page{size:A4;margin:10mm}\n    *{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  }\n  #hojaControl{-webkit-print-color-adjust:exact;print-color-adjust:exact}\n  #hojaControl .hc-head{font-size:18px;font-weight:800;border:2px solid #000;padding:7px 10px;margin-bottom:7px;display:flex;justify-content:space-between}\n  #hojaControl .hc-cols{display:grid;grid-template-columns:1fr 1fr;gap:9px}\n  #hojaControl table{width:100%;border-collapse:collapse;margin-bottom:9px}\n  #hojaControl th,#hojaControl td{border:1px solid #000;padding:4px 7px;font-size:13px}\n  #hojaControl th{background:#eee;text-align:left}\n  #hojaControl td.n{text-align:right;font-variant-numeric:tabular-nums}\n  #hojaControl .sec{font-weight:800;background:#333;color:#fff;padding:4px 7px;font-size:13px}\n  #hojaControl tr.tt td{font-weight:800;background:#f0f0f0}\n  #hojaControl tr{break-inside:avoid}\n  #hojaControl .big{font-size:17px;font-weight:800;border:2px solid #000;padding:7px 10px;margin-top:7px;display:flex;justify-content:space-between}\n<\/style><\/head>\n<body>\n<header>\n  <div class=\"t\"><h1>Reparto — <span id=\"hChofer\"><\/span><\/h1><div class=\"fe\">__FECHA__<\/div><\/div>\n  <div class=\"sel\" id=\"selChofer\"><\/div>\n  <div class=\"mini\">\n    <span>Boletas <b id=\"mBol\">0<\/b><\/span>\n    <span>Efectivo <b id=\"mEfe\">$0<\/b><\/span>\n    <span>Transfer. <b id=\"mTra\">$0<\/b><\/span>\n    <span>Cheque <b id=\"mChq\">$0<\/b><\/span>\n    <span>Fiado <b id=\"mFia\">$0<\/b><\/span>\n  <\/div>\n<\/header>\n<main>\n  <div class=\"hint\">Elegí el chofer arriba. Ya está <b>todo en Efectivo<\/b>: en cada boleta marcá solo <b>Fiado<\/b> o <b>Devolución<\/b> si corresponde. Las <b>transferencias<\/b> y <b>cheques<\/b> se anotan más abajo con el importe REAL. El efectivo y el total a rendir se calculan solos.<\/div>\n  <div class=\"hint\" style=\"display:flex;justify-content:space-between;align-items:center;gap:8px;background:#eef7ee;border:1px solid #cfe6cf;border-radius:9px;padding:7px 10px\"><span>\\u2705 Se guarda solo en este tel\\u00e9fono: aunque se cierre o recargue, <b>no perd\\u00e9s lo marcado<\/b>.<\/span><button id=\"btnReset\" type=\"button\" style=\"flex:none;padding:6px 10px;border:1px solid #e6bcbc;background:#fff;border-radius:8px;font-size:12px;color:#b91c1c;cursor:pointer\">\\ud83d\\uddd1 Empezar de nuevo<\/button><\/div>\n  <div class=\"buscador\"><input id=\"buscaCli\" inputmode=\"search\" placeholder=\"🔎 Buscar cliente por nombre...\"><\/div>\n  <div id=\"lista\"><\/div>\n\n  <section class=\"blq\">\n    <h2>Transferencias<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Anotá cada transferencia: <b>cliente<\/b>, <b>importe EXACTO<\/b> como figura en el comprobante (la foto) y la <b>fecha<\/b> (viene el día siguiente por defecto). Así cruza solo con el banco.<\/div>\n    <div id=\"traList\"><\/div>\n    <button id=\"traAdd\" class=\"cobAddBtn\" style=\"border-color:#1d4ed8;color:#1d4ed8\">+ Agregar transferencia<\/button>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Cheques<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Cliente e importe del cheque.<\/div>\n    <div id=\"chqList\"><\/div>\n    <button id=\"chqAdd\" class=\"cobAddBtn\" style=\"border-color:#6d28d9;color:#6d28d9\">+ Agregar cheque<\/button>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Devoluciones parciales<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Si el cliente devolvió <b>solo una parte<\/b> de la boleta (rechazo parcial): poné el <b>importe<\/b> de lo que devolvió, y el cliente si lo sabés. Si no, dejalo <b>sin nombre<\/b>. Se descuenta del efectivo a rendir.<\/div>\n    <div id=\"dpList\"><\/div>\n    <button id=\"dpAdd\" class=\"cobAddBtn\" style=\"border-color:#64748b;color:#475569\">+ Agregar devolución parcial<\/button>\n  <\/section>\n\n  <div class=\"rsm\">\n    <h2>Resumen<\/h2>\n    <div class=\"grp\"><div class=\"gh fia\"><span>Fiados<\/span><span id=\"rFiaTot\">$0<\/span><\/div><div id=\"rFiaLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh tra\"><span>Transferencias<\/span><span id=\"rTraTot\">$0<\/span><\/div><div id=\"rTraLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh chq\"><span>Cheques<\/span><span id=\"rChqTot\">$0<\/span><\/div><div id=\"rChqLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh dev\"><span>Devoluciones (no entregadas)<\/span><span id=\"rDevTot\">$0<\/span><\/div><div id=\"rDevLista\"><\/div><\/div>\n    <div class=\"grp\"><div class=\"gh dev\"><span>Devoluciones parciales<\/span><span id=\"rDevPTot\">$0<\/span><\/div><div id=\"rDevPLista\"><\/div><\/div>\n  <\/div>\n\n  <section class=\"blq\">\n    <h2>Conteo de efectivo<\/h2>\n    <div id=\"denoms\"><\/div>\n    <div class=\"lin\"><span>Efectivo contado<\/span><b id=\"efeContado\">$0<\/b><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Gastos<\/h2>\n    <div class=\"lin\"><label>Gastos<\/label><input id=\"gGastos\" inputmode=\"decimal\" placeholder=\"0\"><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Otros / Cobrado<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Plata que <b>no es gasto común<\/b>: adelantos, impuestos, o lo que se <b>cobró de días anteriores<\/b>. Poné el concepto y el importe. <b>Suma<\/b> al total igual que Gastos, para que la rendición dé exacta.<\/div>\n    <div id=\"otrList\"><\/div>\n    <button id=\"otrAdd\" class=\"cobAddBtn\" style=\"border-color:#0a7c3a;color:#0a7c3a\">+ Agregar<\/button>\n    <div class=\"cobTot\">Total otros / cobrado: <span id=\"otrTotV\">$0<\/span><\/div>\n  <\/section>\n\n  <section class=\"blq\">\n    <h2>Cobrar mañana<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Lo que quedó sin cobrar y hay que pasarle al chofer para el otro día.<\/div>\n    <div id=\"cobList\"><\/div>\n    <button id=\"cobAdd\" class=\"cobAddBtn\">+ Agregar<\/button>\n    <div class=\"cobTot\">Total a cobrar: <span id=\"cobTotV\">$0<\/span><\/div>\n  <\/section>\n\n  <div class=\"tot\">\n    <div class=\"r\"><span>Total boletas<\/span><b id=\"tTotal\">$0<\/b><\/div>\n    <div class=\"r\"><span>Devoluciones (no entregadas)<\/span><b id=\"tDev\">$0<\/b><\/div>\n    <div class=\"r\"><span>Devol. parciales<\/span><b id=\"tDevP\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo cobrado<\/span><b id=\"tEfe\">$0<\/b><\/div>\n    <div class=\"r\"><span>Transferencias<\/span><b id=\"tTra\">$0<\/b><\/div>\n    <div class=\"r\"><span>Cheques<\/span><b id=\"tChq\">$0<\/b><\/div>\n    <div class=\"r\"><span>Fiados<\/span><b id=\"tFia\">$0<\/b><\/div>\n    <div class=\"r\"><span>A cobrar (mañana)<\/span><b id=\"tCob\">$0<\/b><\/div>\n    <div class=\"r\"><span>Gastos<\/span><b id=\"tGas\">$0<\/b><\/div>\n    <div class=\"r\"><span>Otros / Cobrado<\/span><b id=\"tOtr\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo a rendir (cobrado − gastos − otros)<\/span><b id=\"tRendir\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo contado<\/span><b id=\"tContado\">$0<\/b><\/div>\n    <div class=\"r big\"><span>Diferencia efectivo<\/span><b id=\"tDif\" class=\"dif ok\">$0<\/b><\/div>\n  <\/div>\n  <section class=\"blq\">\n    <h2>Oficina: pegar rendición del chofer<\/h2>\n    <div class=\"hint\" style=\"margin:0 0 8px\">Pegá acá el texto que te mandó el chofer por WhatsApp y tocá Cargar. Se elige solo el chofer y podés tocar \"Imprimir control\".<\/div>\n    <textarea id=\"pegar\" placeholder=\"Pegar acá el resumen del chofer...\"><\/textarea>\n    <button id=\"btnCargar\">Cargar para imprimir<\/button>\n  <\/section>\n<\/main>\n<div class=\"barra\">\n  <button id=\"bCopiar\">Copiar resumen<\/button>\n  <button id=\"bImprimir\">Imprimir control<\/button>\n<\/div>\n<div id=\"modalCopiar\" class=\"modal\"><div class=\"modalBox\"><div class=\"modalTit\">Resumen de <span id=\"mQuien\"><\/span><\/div><div class=\"modalHint\">Tocá <b>Copiar<\/b> y pegalo en el WhatsApp de la oficina. Si no copia, mantené apretado el texto de abajo y elegí Seleccionar todo &gt; Copiar.<\/div><textarea id=\"mTexto\" readonly><\/textarea><div class=\"modalBtns\"><button id=\"mCopiar\">Copiar<\/button><button id=\"mCerrar\">Cerrar<\/button><\/div><\/div><\/div>\n<div id=\"hojaControl\"><\/div>\n\n<script>\n'use strict';\nconst FECHA='__FECHA__';\nconst FECHA_ENTREGA='__FECHA_ENTREGA__';\nconst CHOFERES=__CHOFERES__;\nconst DEN=[20000,10000,2000,1000,500,200,100,50,20,10];\nfunction nuevoEstado(bol){ return {st:bol.map(b=>({...b,dev:0,modo:(b.imp<0?'nc':'efe'),efeM:0,traM:0,chqM:0,feTra:((b.imp<0?b.fe:(FECHA_ENTREGA||b.fe)))})), denCant:{}, cobrar:[{txt:'',imp:0}], otros:[{txt:'',imp:0}], gastos:0, transf:[], cheques:[], devparc:[]}; }\nfunction _normEstado(e){ if(!e) return e; if(!Array.isArray(e.transf)) e.transf=[]; if(!Array.isArray(e.cheques)) e.cheques=[]; if(!Array.isArray(e.devparc)) e.devparc=[]; if(!Array.isArray(e.cobrar)||!e.cobrar.length) e.cobrar=[{txt:'',imp:0}]; if(!Array.isArray(e.otros)||!e.otros.length) e.otros=[{txt:'',imp:0}]; return e; }\nconst STATE={}; Object.keys(CHOFERES).forEach(ch=>STATE[ch]=nuevoEstado(CHOFERES[ch]));\nvar LSKEY='planillaRep_'+String(FECHA).replace(/\\W/g,'')+'_'+Object.keys(CHOFERES).join('-');\n// Guarda el avance en DOS lugares: (1) el guardado normal del tel\\u00e9fono (localStorage) y\n// (2) un respaldo en la propia direcci\\u00f3n de la p\\u00e1gina (#), que sobrevive al refresco aunque\n// el navegador bloquee el guardado normal \\u2014 t\\u00edpico al abrir el archivo \"suelto\" en el celular.\nfunction _guardarStr(s){\n  try{ localStorage.setItem(LSKEY, s); }catch(e){}\n  try{ history.replaceState(null,'', location.pathname+location.search+'#d='+encodeURIComponent(s)); }\n  catch(e){ try{ location.hash='d='+encodeURIComponent(s); }catch(e2){} }\n}\nfunction _leerStr(){\n  var s=null;\n  try{ var h=location.hash||''; if(h.indexOf('#d=')===0) s=decodeURIComponent(h.slice(3)); else if(h.indexOf('d=')===0) s=decodeURIComponent(h.slice(2)); }catch(e){}\n  if(!s){ try{ s=localStorage.getItem(LSKEY); }catch(e){} }\n  return s;\n}\n(function(){ try{ var g=_leerStr(); if(!g) return; var sv=JSON.parse(g); if(sv && Object.keys(sv).sort().join()===Object.keys(CHOFERES).sort().join()){ Object.keys(sv).forEach(function(ch){ if(STATE[ch] && sv[ch] && sv[ch].st && sv[ch].st.length===STATE[ch].st.length) STATE[ch]=_normEstado(sv[ch]); }); } }catch(e){} })();\nvar _lsT; function guardarLS(){ clearTimeout(_lsT); _lsT=setTimeout(function(){ try{ _guardarStr(JSON.stringify(STATE)); }catch(e){} }, 400); }\nfunction guardarYa(){ try{ clearTimeout(_lsT); _guardarStr(JSON.stringify(STATE)); }catch(e){} }\nfunction borrarLS(){ try{ localStorage.removeItem(LSKEY); }catch(e){} try{ history.replaceState(null,'', location.pathname+location.search); }catch(e){} }\n// Guardar JUSTO antes de que la p\\u00e1gina se vaya a segundo plano o se cierre (sin esperar la demora).\ndocument.addEventListener('visibilitychange',function(){ if(document.visibilityState==='hidden') guardarYa(); });\nwindow.addEventListener('pagehide', guardarYa);\nwindow.addEventListener('beforeunload', guardarYa);\ndocument.addEventListener('DOMContentLoaded',function(){ var _br=document.getElementById('btnReset'); if(_br) _br.onclick=function(){ if(confirm('\\u00bfEmpezar de nuevo? Se borra TODO lo que marcaste en esta planilla.')){ borrarLS(); location.reload(); } }; });\nlet act=Object.keys(CHOFERES)[0];\nlet filtro='';\nlet ajOpen=new Set();\nfunction A(){ return STATE[act]; }\nfunction money(n){ n=Math.round((n||0)); return '$'+n.toLocaleString('es-AR'); }\nfunction numAR(v){ v=String(v==null?'':v).replace(/[^\\d.,-]/g,''); if(!v) return 0; var ld=v.lastIndexOf('.'),lc=v.lastIndexOf(','); if(ld>=0&&lc>=0){ if(lc>ld) v=v.replace(/\\./g,'').replace(',','.'); else v=v.replace(/,/g,''); } else if(lc>=0){ v=v.replace(',','.'); } else { var pz=v.split('.'); if(pz.length>2){ v=pz.join(''); } else if(pz[1]&&pz[1].length===3){ v=pz.join(''); } } var n=parseFloat(v); return isNaN(n)?0:n; }\nfunction neto(x){ return Math.max(0,(x.imp||0)-(x.dev||0)); }\nfunction feCortaT(s){ if(!s) return ''; var p=String(s).split('-'); return p.length===3?(p[2]+'/'+p[1]):s; }\nfunction parte(x){\n  // Modelo simple: la boleta es Efectivo por defecto; se marca solo Fiado o Devolución.\n  // Las transferencias y cheques van en sus listas aparte (no pegados a la boleta).\n  if(x.modo==='dev') return {efe:0,tra:0,chq:0,fia:0};\n  if(x.modo==='nc') return {efe:0,tra:0,chq:0,fia:(x.tomar?(x.imp||0):0)};\n  const nt=neto(x);\n  if(x.modo==='fia') return {efe:0,tra:0,chq:0,fia:nt};\n  return {efe:nt,tra:0,chq:0,fia:0};   // efe (default)\n}\nfunction devMonto(x){ return x.modo==='dev' ? (x.imp||0) : (x.dev||0); }\nfunction clientesDe(){ var seen={},out=[]; (A().st||[]).forEach(function(x){ var c=(x.cli||'').trim(); if(c && !seen[c]){ seen[c]=1; out.push(c); } }); out.sort(); return out; }\nfunction optCli(sel){ return '<option value=\"\">— cliente —<\/option>'+clientesDe().map(function(c){ return '<option'+(c===sel?' selected':'')+'>'+c.replace(/\"/g,'&quot;')+'<\/option>'; }).join(''); }\n\nfunction pintarSelector(){\n  const S=document.getElementById('selChofer'); S.innerHTML='';\n  Object.keys(CHOFERES).forEach(ch=>{\n    const b=document.createElement('button'); b.textContent=ch+' ('+CHOFERES[ch].length+')';\n    if(ch===act) b.className='on';\n    b.onclick=()=>{ act=ch; pintarTodo(); };\n    S.appendChild(b);\n  });\n  document.getElementById('hChofer').textContent=act;\n}\nfunction pintarLista(){\n  const L=document.getElementById('lista'); L.innerHTML='';\n  A().st.forEach((x,i)=>{\n    if(x.modo==='nc'){\n      const c=document.createElement('div'); c.className='card'; c.style.opacity=x.tomar?'1':'.82'; c.dataset.search=((x.cli||'')+' '+x.n+' '+(x.dir||'')).toUpperCase();\n      c.innerHTML='<div class=\"cli\">'+x.cli+'<\/div><div class=\"meta\">Boleta '+x.n+' · Vend '+x.vend+' · '+(x.dir||'')+'<\/div><div class=\"imp\">'+money(x.imp)+'<\/div>'\n        +'<div style=\"margin-top:8px;font-weight:800;color:#b91c1c\">NOTA DE CRÉDITO / RECHAZO<\/div>'\n        +'<button class=\"btDev'+(x.tomar?' on':'')+'\" data-nctake=\"'+i+'\" style=\"margin-top:8px\">'+(x.tomar?'✔ Se toma como nota de crédito (tocá para sacar)':'Tomar esta nota de crédito')+'<\/button>'\n        +'<div style=\"font-size:13px;color:#556;margin-top:6px\">'+(x.tomar?('Se aplicará al cliente como nota de crédito ('+money(x.imp)+').'):'No se cobra ni va a fiados. Tildá solo si hay que tomarla (caso puntual).')+'<\/div>';\n      L.appendChild(c); return;\n    }\n    const c=document.createElement('div'); c.className='card'+(x.modo==='dev'?' dev':(x.modo==='fia'?' fiaC':'')); c.dataset.search=((x.cli||'')+' '+x.n+' '+(x.dir||'')).toUpperCase();\n    c.innerHTML=`\n      <div class=\"cli\">${x.cli}<\/div>\n      <div class=\"meta\">Boleta ${x.n} · Vend ${x.vend} · ${x.dir||''}<\/div>\n      <div class=\"imp\">${money(x.imp)}<\/div>\n      <div class=\"bts\">\n        <button class=\"fia ${x.modo==='fia'?'on':''}\" data-i=\"${i}\" data-m=\"fia\">Fiado<\/button>\n        <button class=\"dev2 ${x.modo==='dev'?'on':''}\" data-dev=\"${i}\">Devolución<\/button>\n      <\/div>\n      ${x.modo==='dev'?'':`<button class=\"ajLink\" data-dp=\"${i}\">${(x.dev>0)?('↩ Devolvió '+money(x.dev)+' — editar'):'↩ Devolución parcial'}<\/button>\n      <div class=\"aj${((x.dev>0)||ajOpen.has(i))?' open':''}\"><div class=\"fila\"><label>Devolvió (parte de la boleta)<\/label><input inputmode=\"decimal\" data-dpimp=\"${i}\" value=\"${x.dev||''}\" placeholder=\"0\"><\/div><div class=\"res\">Queda para <b>${x.modo==='fia'?'fiar':'cobrar'}<\/b>: <b>${money(neto(x))}<\/b><\/div><\/div>`}\n      <div class=\"estadoBol\"><\/div>`;\n    L.appendChild(c); refrescarCard(c,x);\n  });\n  L.querySelectorAll('.bts button[data-m]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.i,x=A().st[i];\n    x.modo = (x.modo==='fia') ? 'efe' : 'fia'; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dev]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.dev,x=A().st[i];\n    x.modo = x.modo==='dev'?'efe':'dev'; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-nctake]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.nctake,x=A().st[i]; x.tomar=!x.tomar; pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dp]').forEach(b=>b.onclick=()=>{\n    const i=+b.dataset.dp; if(ajOpen.has(i)) ajOpen.delete(i); else ajOpen.add(i); pintarLista(); actualizar();\n  });\n  L.querySelectorAll('[data-dpimp]').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.dpimp,x=A().st[i]; var v=numAR(inp.value); if(v<0)v=0; if(v>(x.imp||0))v=x.imp||0; x.dev=v;\n    var card=inp.closest('.card'); if(card){ var r=card.querySelector('.res b:last-child'); if(r) r.textContent=money(neto(x)); refrescarCard(card,x); } actualizar();\n  });\n  aplicarFiltro();\n}\nfunction aplicarFiltro(){\n  const q=(filtro||'').trim().toUpperCase();\n  let vis=0;\n  document.querySelectorAll('#lista .card').forEach(c=>{ const ok=(!q||(c.dataset.search||'').includes(q)); c.style.display=ok?'':'none'; if(ok) vis++; });\n  let sr=document.getElementById('sinRes');\n  if(q && vis===0){ if(!sr){ sr=document.createElement('div'); sr.id='sinRes'; sr.className='sinres'; sr.textContent='No hay clientes con ese nombre en este chofer.'; document.getElementById('lista').appendChild(sr); } }\n  else if(sr){ sr.remove(); }\n}\nfunction refrescarCard(c,x){\n  var txt;\n  if(x.modo==='dev'){ txt='↩ DEVOLUCIÓN TOTAL (no entregada)'; }\n  else {\n    var nt=neto(x);\n    if(x.modo==='fia') txt=(x.dev>0)?('↩ Devolvió '+money(x.dev)+' · ✔ FIADO '+money(nt)+' a la cuenta de '+x.cli):('✔ FIADO — va a la cuenta de '+x.cli);\n    else txt=(x.dev>0)?('↩ Devolvió '+money(x.dev)+' · ✔ Efectivo '+money(nt)):'✔ Efectivo';\n  }\n  var e=c.querySelector('.estadoBol'); if(e) e.textContent=txt;\n}\nfunction pintarDenoms(){\n  const D=document.getElementById('denoms'); D.innerHTML='';\n  DEN.forEach(v=>{\n    const row=document.createElement('div'); row.className='den';\n    row.innerHTML=`<span>Billetes x ${v.toLocaleString('es-AR')}<\/span>\n      <input inputmode=\"numeric\" data-den=\"${v}\" placeholder=\"0\" value=\"${A().denCant[v]||''}\">\n      <span class=\"sub\" id=\"sub${v}\">${money((A().denCant[v]||0)*v)}<\/span>`;\n    D.appendChild(row);\n  });\n  D.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const v=+inp.dataset.den; A().denCant[v]=parseInt((inp.value||'0').replace(/\\D/g,''))||0;\n    document.getElementById('sub'+v).textContent=money(A().denCant[v]*v); actualizar();\n  });\n}\nfunction pintarCobrar(){\n  const C=document.getElementById('cobList'); C.innerHTML='';\n  A().cobrar.forEach((o,i)=>{\n    const row=document.createElement('div'); row.className='cobrow';\n    // v88: desplegable con los clientes del dia + campo libre (a veces no ponen la boleta, o es\n    //   solo una parte). Lo que viaja a la oficina sigue siendo el mismo campo txt de siempre.\n    row.innerHTML=`<select data-ci=\"${i}\" data-cf=\"sel\" style=\"max-width:130px\">${optCli('')}<\/select>\n      <input data-ci=\"${i}\" data-cf=\"txt\" placeholder=\"Cliente / boleta / lo que sea\" value=\"${(o.txt||'').replace(/\"/g,'&quot;')}\">\n      <input class=\"m\" inputmode=\"decimal\" data-ci=\"${i}\" data-cf=\"imp\" placeholder=\"0\" value=\"${o.imp||''}\">\n      <button class=\"del\" data-cdel=\"${i}\">×<\/button>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.ci,f=inp.dataset.cf;\n    A().cobrar[i][f]= f==='imp' ? numAR(inp.value) : inp.value;\n    actualizar();\n  });\n  C.querySelectorAll('select').forEach(sel=>sel.onchange=()=>{     // v88\n    const i=+sel.dataset.ci; if(!sel.value) return;\n    const txt=A().cobrar[i].txt||'';\n    A().cobrar[i].txt = txt.trim() ? (sel.value+' '+txt.trim()) : sel.value;\n    pintarCobrar(); actualizar();\n  });\n  C.querySelectorAll('[data-cdel]').forEach(b=>b.onclick=()=>{ A().cobrar.splice(+b.dataset.cdel,1); if(!A().cobrar.length) A().cobrar=[{txt:'',imp:0}]; pintarCobrar(); actualizar(); });\n}\nfunction pintarOtros(){\n  const C=document.getElementById('otrList'); if(!C) return; C.innerHTML='';\n  if(!Array.isArray(A().otros)||!A().otros.length) A().otros=[{txt:'',imp:0}];\n  A().otros.forEach((o,i)=>{\n    const row=document.createElement('div'); row.className='cobrow';\n    row.innerHTML=`<input data-oi=\"${i}\" data-of=\"txt\" placeholder=\"Concepto (ej: adelanto impuesto)\" value=\"${(o.txt||'').replace(/\"/g,'&quot;')}\">\n      <input class=\"m\" inputmode=\"decimal\" data-oi=\"${i}\" data-of=\"imp\" placeholder=\"0\" value=\"${o.imp||''}\">\n      <button class=\"del\" data-odel=\"${i}\">×<\/button>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('input').forEach(inp=>inp.oninput=()=>{\n    const i=+inp.dataset.oi,f=inp.dataset.of;\n    A().otros[i][f]= f==='imp' ? numAR(inp.value) : inp.value;\n    actualizar();\n  });\n  C.querySelectorAll('[data-odel]').forEach(b=>b.onclick=()=>{ A().otros.splice(+b.dataset.odel,1); if(!A().otros.length) A().otros=[{txt:'',imp:0}]; pintarOtros(); actualizar(); });\n}\nfunction pintarTra(){\n  const C=document.getElementById('traList'); if(!C) return; C.innerHTML='';\n  (A().transf||[]).forEach((t,i)=>{\n    const row=document.createElement('div'); row.className='trow';\n    row.innerHTML=`<div class=\"r1\"><select data-ti=\"${i}\">${optCli(t.cli)}<\/select><button class=\"del\" data-tdel=\"${i}\">×<\/button><\/div>\n      <div class=\"r2\"><input class=\"m\" inputmode=\"decimal\" data-tm=\"${i}\" placeholder=\"importe real (foto)\" value=\"${t.imp||''}\">\n      <input class=\"fe\" type=\"date\" data-tfe=\"${i}\" value=\"${t.fe||FECHA_ENTREGA||''}\"><\/div>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('select[data-ti]').forEach(s=>s.onchange=()=>{ A().transf[+s.dataset.ti].cli=s.value; });\n  C.querySelectorAll('input[data-tm]').forEach(inp=>inp.oninput=()=>{ A().transf[+inp.dataset.tm].imp=numAR(inp.value); actualizar(); });\n  C.querySelectorAll('input[data-tfe]').forEach(inp=>inp.onchange=()=>{ A().transf[+inp.dataset.tfe].fe=inp.value; });\n  C.querySelectorAll('[data-tdel]').forEach(b=>b.onclick=()=>{ A().transf.splice(+b.dataset.tdel,1); pintarTra(); actualizar(); });\n}\nfunction pintarChq(){\n  const C=document.getElementById('chqList'); if(!C) return; C.innerHTML='';\n  (A().cheques||[]).forEach((t,i)=>{\n    const row=document.createElement('div'); row.className='trow';\n    row.innerHTML=`<div class=\"r1\"><select data-qi=\"${i}\">${optCli(t.cli)}<\/select><button class=\"del\" data-qdel=\"${i}\">×<\/button><\/div>\n      <div class=\"r2\"><input class=\"m\" inputmode=\"decimal\" data-qm=\"${i}\" placeholder=\"importe\" value=\"${t.imp||''}\"><\/div>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('select[data-qi]').forEach(s=>s.onchange=()=>{ A().cheques[+s.dataset.qi].cli=s.value; });\n  C.querySelectorAll('input[data-qm]').forEach(inp=>inp.oninput=()=>{ A().cheques[+inp.dataset.qm].imp=numAR(inp.value); actualizar(); });\n  C.querySelectorAll('[data-qdel]').forEach(b=>b.onclick=()=>{ A().cheques.splice(+b.dataset.qdel,1); pintarChq(); actualizar(); });\n}\nfunction pintarDevP(){\n  const C=document.getElementById('dpList'); if(!C) return; C.innerHTML='';\n  (A().devparc||[]).forEach((t,i)=>{\n    const row=document.createElement('div'); row.className='trow';\n    row.innerHTML=`<div class=\"r1\"><select data-pi=\"${i}\">${optCli(t.cli)}<\/select><button class=\"del\" data-pdel=\"${i}\">×<\/button><\/div>\n      <div class=\"r2\"><input class=\"m\" inputmode=\"decimal\" data-pm=\"${i}\" placeholder=\"importe devuelto\" value=\"${t.imp||''}\"><\/div>`;\n    C.appendChild(row);\n  });\n  C.querySelectorAll('select[data-pi]').forEach(s=>s.onchange=()=>{ A().devparc[+s.dataset.pi].cli=s.value; });\n  C.querySelectorAll('input[data-pm]').forEach(inp=>inp.oninput=()=>{ A().devparc[+inp.dataset.pm].imp=numAR(inp.value); actualizar(); });\n  C.querySelectorAll('[data-pdel]').forEach(b=>b.onclick=()=>{ A().devparc.splice(+b.dataset.pdel,1); pintarDevP(); actualizar(); });\n}\nfunction efectivoContado(){ return DEN.reduce((s,v)=>s+(A().denCant[v]||0)*v,0); }\nfunction calc(){\n  let tot=0,dev=0,fia=0; const LF=[],LD=[],LDPbol=[];\n  A().st.forEach(x=>{ const p=parte(x); tot+=(x.modo==='nc'?0:x.imp); fia+=p.fia;\n    if(x.modo==='dev'){ dev+=(x.imp||0); LD.push({cli:x.cli,v:x.vend,n:x.n,m:x.imp}); }\n    else if((x.dev||0)>0){ LDPbol.push({cli:x.cli,v:x.vend,n:x.n,m:x.dev}); }   // devolución parcial pegada a la boleta → va al listado de parciales (con su cliente)\n    if(p.fia>0) LF.push({cli:x.cli,v:x.vend,n:x.n,m:p.fia});\n  });\n  // Transferencias y cheques van en sus listas (importe REAL a mano). No están pegados a la boleta.\n  const LT=(A().transf||[]).filter(t=>(t.imp||0)>0).map(t=>({cli:t.cli||'',v:'',n:'',m:t.imp,fe:t.fe||''}));\n  const LCh=(A().cheques||[]).filter(t=>(t.imp||0)>0).map(t=>({cli:t.cli||'',v:'',n:'',m:t.imp}));\n  const LDPman=(A().devparc||[]).filter(t=>(t.imp||0)>0).map(t=>({cli:t.cli||'',v:'',n:'',m:t.imp}));\n  const LDP=LDPbol.concat(LDPman);\n  const tra=LT.reduce((s,o)=>s+o.m,0), chq=LCh.reduce((s,o)=>s+o.m,0), devP=LDP.reduce((s,o)=>s+o.m,0);\n  const cob=A().cobrar.reduce((s,o)=>s+(o.imp||0),0);\n  // v88: A COBRAR MANIANA tambien se descuenta del efectivo a rendir. Es plata que el chofer NO\n  //   cobro, asi que no la puede entregar. Antes solo sumaba en el TOTAL RENDICION (que cerraba\n  //   bien) pero el \"a rendir\" y la DIFERENCIA no la restaban: al chofer le quedaba un faltante\n  //   exacto por ese importe y terminaba metiendola en OTROS/COBRADO, que es otra cosa.\n  //   Va como LISTA SUELTA a proposito (decision de Mariano): a veces es solo una PARTE de la\n  //   boleta y a veces no anotan el numero de boleta. En el listado de la oficina sale igual que\n  //   siempre, en su casillero naranja.\n  const efe=tot-fia-dev-devP-tra-chq-cob;   // el efectivo es lo que QUEDA (lo no cobrado tampoco se entrega)\n  const otr=(A().otros||[]).reduce((s,o)=>s+(o.imp||0),0);\n  const gas=A().gastos||0,cont=efectivoContado();\n  const rendicion=cont+gas+otr+chq+tra+fia+cob+dev+devP;\n  return {tot,dev,devP,efe,tra,chq,fia,cob,otr,gas,cont,rendir:efe-gas-otr,dif:cont-(efe-gas-otr),LF,LT,LCh,LD,LDP,depo:{},rendicion};\n}\nfunction actualizar(){\n  guardarLS();\n  const c=calc(); const set=(id,v)=>document.getElementById(id).textContent=money(v);\n  set('tTotal',c.tot);set('tDev',c.dev);set('tDevP',c.devP);set('tEfe',c.efe);set('tTra',c.tra);set('tChq',c.chq);set('tFia',c.fia);set('tCob',c.cob);\n  set('tGas',c.gas);set('tOtr',c.otr);set('tRendir',c.rendir);set('tContado',c.cont);\n  document.getElementById('otrTotV').textContent=money(c.otr);\n  const d=document.getElementById('tDif'); d.textContent=money(c.dif); d.className='dif '+(Math.abs(c.dif)<1?'ok':'mal');\n  document.getElementById('efeContado').textContent=money(c.cont);\n  document.getElementById('cobTotV').textContent=money(c.cob);\n  document.getElementById('mBol').textContent=A().st.length;\n  set('mEfe',c.efe);set('mTra',c.tra);set('mChq',c.chq);set('mFia',c.fia);\n  document.getElementById('rFiaTot').textContent=money(c. .cli} ${o.n}<\/td><td class=\"n\">${money(o.m)}<\/td><\/tr>`).join(''):'<tr><td>—<\/td><td class=\"n\">$0<\/td><\/tr>';\n  const devPRows=c.LDP.length?c.LDP.map(o=>`<tr><td>${o.cli||'(sin nombre)'}<\/td><td class=\"n\">${money(o.m)}<\/td><\/tr>`).join(''):'<tr><td>—<\/td><td class=\"n\">$0<\/td><\/tr>';\n  const cobItems=A().cobrar.filter(o=>(o.imp||0)>0||((o.txt||'').trim()));\n  const cobRows=cobItems.length?cobItems.map(o=>`<tr><td>${(o.txt||'').replace(/<\/g,'&lt;')||'—'}<\/td><td class=\"n\">${money(o.imp)}<\/td><\/tr>`).join(''):'<tr><td>—<\/td><td class=\"n\">$0<\/td><\/tr>';\n  const otrItems=(A().otros||[]).filter(o=>(o.imp||0)>0||((o.txt||'').trim()));\n  const otrRows=otrItems.length?otrItems.map(o=>`<tr><td>${(o.txt||'').replace(/<\/g,'&lt;')||'—'}<\/td><td class=\"n\">${money(o.imp)}<\/td><\/tr>`).join(''):'<tr><td>—<\/td><td class=\"n\">$0<\/td><\/tr>';\n  document.getElementById('hojaControl').innerHTML=`\n    <div class=\"hc-head\"><span>RENDICIÓN — ${act}<\/span><span>${FECHA}<\/span><\/div>\n    <div class=\"hc-cols\">\n      <div class=\"hc-col\">\n        <table><thead><tr><th>Billetes<\/th><th class=\"n\">Cant.<\/th><th class=\"n\">Total<\/th><\/tr><\/thead><tbody>\n          ${bill}<tr class=\"tt\"><td>Efectivo contado<\/td><td><\/td><td class=\"n\">${money(c.cont)}<\/td><\/tr>\n        <\/tbody><\/table>\n        <table><tbody>\n          <tr><td>Gastos<\/td><td class=\"n\">${money(c.gas)}<\/td><\/tr>\n        <\/tbody><\/table>\n        <div class=\"sec\" style=\"background:#0a7c3a;font-size:15px\">OTROS / COBRADO<\/div>\n        <table style=\"border:3px solid #0a7c3a\"><tbody>${otrRows}<tr class=\"tt\" style=\"font-size:16px;background:#d8f2e2\"><td>Total otros / cobrado<\/td><td class=\"n\">${money(c.otr)}<\/td><\/tr><\/tbody><\/table>\n        <div class=\"sec\">CHEQUES<\/div>\n        <table><tbody>${chqRows}<tr class=\"tt\"><td>Total cheques<\/td><td class=\"n\">${money(c.chq)}<\/td><\/tr><\/tbody><\/table>\n        <div class=\"sec\">TRANSFERENCIAS<\/div>\n        <table><tbody>${traRows}<tr class=\"tt\"><td>Total transferencias (${c.LT.length})<\/td><td class=\"n\">${money(c.tra)}<\/td><\/tr><\/tbody><\/table>\n      <\/div>\n      <div class=\"hc-col\">\n        <div class=\"sec\">FIADOS<\/div>\n        <table><tbody>${fiaRows}<tr class=\"tt\"><td>Total fiados<\/td><td class=\"n\">${money(c.fia)}<\/td><\/tr><\/tbody><\/table>\n        <div class=\"sec\">DEVOLUCIONES (no entregadas)<\/div>\n        <table><tbody>${devRows}<tr class=\"tt\"><td>Total devoluciones<\/td><td class=\"n\">${money(c.dev)}<\/td><\/tr><\/tbody><\/table>\n        <div class=\"sec\">DEVOLUCIONES PARCIALES<\/div>\n        <table><tbody>${devPRows}<tr class=\"tt\"><td>Total devol. parciales<\/td><td class=\"n\">${money(c.devP)}<\/td><\/tr><\/tbody><\/table>\n      <\/div>\n    <\/div>\n    <div class=\"big\"><span>TOTAL RENDICIÓN<\/span><span>${money(c.rendicion)}<\/span><\/div>\n    <div style=\"font-size:9px;margin-top:4px;color:#333\">Rendición = efectivo contado + gastos + otros/cobrado + cheques + transferencias + fiados + a cobrar + devoluciones + devol. parciales<\/div>\n    ${c.cob>0?`<div style=\"border:4px solid #b45309;background:#fff3e0;border-radius:10px;padding:9px 13px;margin-top:11px\"><div style=\"display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;color:#8a3d00\"><span>🔔 A COBRAR MAÑANA<\/span><span style=\"font-size:21px\">${money(c.cob)}<\/span><\/div><table style=\"margin-top:7px;margin-bottom:0\"><tbody>${cobRows}<\/tbody><\/table><\/div>`:''}`;\n}\nfunction resumen(){\n  const c=calc();\n  const L=a=>a.length?a.map(o=>`  ${o.cli} (V${o.v}) ${o.n}: ${money(o.m)}`).join('\\n'):'  —';\n  const LL=a=>a.length?a.map(o=>`  ${o.cli||'(sin cliente)'}${o.fe?(' ['+feCortaT(o.fe)+']'):''}: ${money(o.m)}`).join('\\n'):'  —';\n  const cobItems=A().cobrar.filter(o=>(o.imp||0)>0||((o.txt||'').trim()));\n  const otrItems=(A().otros||[]).filter(o=>(o.imp||0)>0||((o.txt||'').trim()));\n  let t=`RENDICION ${act} ${FECHA}\\n`;\n  t+=`Total boletas: ${money(c.tot)}\\n`;\n  t+=`Efectivo cobrado: ${money(c.efe)} | Contado: ${money(c.cont)} | Dif: ${money(c.dif)}\\n`;\n  t+=`Transferencias: ${money(c.tra)}\\nCheques: ${money(c.chq)}\\nFiados: ${money(c.fia)}\\nDevoluciones: ${money(c.dev)}\\nDevol. parciales: ${money(c.devP)}\\nA cobrar manana: ${money(c.cob)}\\n`;\n  t+=`Gastos: ${money(c.gas)}\\nOtros/Cobrado: ${money(c.otr)}\\nTOTAL RENDICION: ${money(c.rendicion)}\\n`;\n  t+=`\\nFIADOS (${c.LF.length}):\\n`+L(c.LF)+`\\n`;\n  t+=`\\nTRANSFERENCIAS (${c.LT.length}):\\n`+LL(c.LT)+`\\n`;\n  t+=`\\nCHEQUES (${c.LCh.length}):\\n`+LL(c.LCh)+`\\n`;\n  t+=`\\nDEVOLUCIONES (${c.LD.length}):\\n`+L(c.LD)+`\\n`;\n  t+=`\\nDEVOLUCIONES PARCIALES (${c.LDP.length}):\\n`+LL(c.LDP)+`\\n`;\n  t+=`\\nA COBRAR MANANA (${cobItems.length}):\\n`+(cobItems.length?cobItems.map(o=>`  ${o.txt||'—'}: ${money(o.imp)}`).join('\\n'):'  —')+`\\n`;\n  t+=`\\nOTROS / COBRADO (${otrItems.length}):\\n`+(otrItems.length?otrItems.map(o=>`  ${o.txt||'—'}: ${money(o.imp)}`).join('\\n'):'  —')+`\\n`;\n  t+=`\\n[datos ${act}] `+JSON.stringify(A().st.map(x=>{const p=parte(x);return [x.n,Math.round(p.efe),0,0,Math.round(p.fia*100)/100,Math.round(devMonto(x)),x.modo==='dev'?1:0];}));\n  t+='\\n[REND] '+JSON.stringify({ch:act,\n    b:A().st.map(x=>{var p=parte(x);return {n:x.n,cli:x.cli,v:x.vend,imp:x.imp,fe:x.fe||null,efe:Math.round(p.efe),tra:0,chq:0,fia:Math.round(p.fia*100)/100,dev:Math.round(devMonto(x)),feTra:x.fe};}),\n    tr:(A().transf||[]).filter(o=>(o.imp||0)>0).map(o=>({cli:o.cli||'',imp:Math.round((o.imp||0)*100)/100,fe:o.fe||FECHA_ENTREGA||null})),\n    chq:(A().cheques||[]).filter(o=>(o.imp||0)>0).map(o=>({cli:o.cli||'',imp:Math.round((o.imp||0)*100)/100})),\n    dp:(A().devparc||[]).filter(o=>(o.imp||0)>0).map(o=>({cli:o.cli||'',imp:Math.round((o.imp||0)*100)/100})),\n    den:A().denCant,gas:A().gastos||0,cob:A().cobrar.filter(o=>(o.imp||0)||((o.txt||'').trim())),otr:(A().otros||[]).filter(o=>(o.imp||0)||((o.txt||'').trim()))});\n  return t;\n}\nfunction pintarTodo(){ filtro=''; ajOpen=new Set(); const _b=document.getElementById('buscaCli'); if(_b) _b.value=''; pintarSelector(); pintarLista(); pintarTra(); pintarChq(); pintarDevP(); pintarDenoms(); pintarCobrar(); pintarOtros();\n  document.getElementById('gGastos').value=A().gastos||'';\n  actualizar();\n}\ndocument.getElementById('gGastos').oninput=()=>{ A().gastos=numAR(document.getElementById('gGastos').value); actualizar(); };\ndocument.getElementById('cobAdd').onclick=()=>{ A().cobrar.push({txt:'',imp:0}); pintarCobrar(); actualizar(); };\ndocument.getElementById('otrAdd').onclick=()=>{ if(!Array.isArray(A().otros)) A().otros=[]; A().otros.push({txt:'',imp:0}); pintarOtros(); actualizar(); };\ndocument.getElementById('traAdd').onclick=()=>{ if(!A().transf) A().transf=[]; A().transf.push({cli:'',imp:0,fe:FECHA_ENTREGA||''}); pintarTra(); actualizar(); };\ndocument.getElementById('chqAdd').onclick=()=>{ if(!A().cheques) A().cheques=[]; A().cheques.push({cli:'',imp:0}); pintarChq(); actualizar(); };\ndocument.getElementById('dpAdd').onclick=()=>{ if(!A().devparc) A().devparc=[]; A().devparc.push({cli:'',imp:0}); pintarDevP(); actualizar(); };\ndocument.getElementById('buscaCli').oninput=function(){ filtro=this.value; aplicarFiltro(); };\nfunction copiarTexto(txt){\n  const ta=document.getElementById('mTexto'); ta.focus(); ta.select();\n  try{ ta.setSelectionRange(0,999999); }catch(e){}\n  let ok=false; try{ ok=document.execCommand('copy'); }catch(e){}\n  try{ if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(txt); ok=true; } }catch(e){}\n  return ok;\n}\n/* v62: la app del chofer (que muestra esta planilla adentro) le pide el resumen para mandarlo al buzon. */\nwindow.addEventListener('message',(ev)=>{ try{ if(ev.data && ev.data.tipo==='PEDIR_REND'){ ev.source.postMessage({tipo:'REND', ch:act, texto:resumen()}, '*'); } }catch(e){} });\ndocument.getElementById('bCopiar').onclick=()=>{\n  document.getElementById('mQuien').textContent=act;\n  document.getElementById('mTexto').value=resumen();\n  document.getElementById('modalCopiar').classList.add('on');\n  setTimeout(()=>{ const ta=document.getElementById('mTexto'); ta.focus(); ta.select(); try{ta.setSelectionRange(0,999999);}catch(e){} },60);\n};\ndocument.getElementById('mCopiar').onclick=()=>{ const ok=copiarTexto(document.getElementById('mTexto').value); alert(ok?'Copiado. Pegalo en el WhatsApp de la oficina.':'No pude copiar solo: mantené apretado el texto, Seleccionar todo, Copiar.'); };\ndocument.getElementById('mCerrar').onclick=()=>document.getElementById('modalCopiar').classList.remove('on');\ndocument.getElementById('bImprimir').onclick=()=>{ armarHoja(); window.print(); };\nwindow.onbeforeprint=armarHoja;\nfunction cargarRendicion(txt){\n  const m=txt.match(/\\[REND\\]\\s*(\\{[\\s\\S]*\\})/);\n  if(!m){ alert('No encontré los datos. Pegá el resumen COMPLETO del chofer (tiene que terminar con [REND] {...}).'); return; }\n  let d; try{ d=JSON.parse(m[1]); }catch(e){ alert('El texto está cortado. Pedile al chofer que lo copie de nuevo entero.'); return; }\n  if(!STATE[d.ch]){ alert('El chofer \"'+d.ch+'\" no está en este archivo.'); return; }\n  const S=STATE[d.ch], byN={}; S.st.forEach(x=>byN[x.n]=x);\n  (d.b||[]).forEach(o=>{ const x=byN[o.n]; if(!x||x.modo==='nc') return; x.modo=(o.dev>0)?'dev':((o.fia>0)?'fia':'efe'); x.dev=o.dev||0; });\n  S.transf=(d.tr||[]).map(t=>({cli:t.cli||'',imp:t.imp||0,fe:t.fe||''}));\n  S.cheques=(d.chq||[]).map(t=>({cli:t.cli||'',imp:t.imp||0}));\n  S.devparc=(d.dp||[]).map(t=>({cli:t.cli||'',imp:t.imp||0}));\n  S.denCant=d.den||{}; S.gastos=d.gas||0; S.cobrar=(d.cob&&d.cob.length)?d.cob:[{txt:'',imp:0}]; S.otros=(d.otr&&d.otr.length)?d.otr:[{txt:'',imp:0}];\n  act=d.ch; pintarTodo();\n  window.scrollTo(0,0);\n  alert('Cargada la rendición de '+d.ch+'. Revisá y tocá \"Imprimir control\".');\n}\ndocument.getElementById('btnCargar').onclick=()=>cargarRendicion(document.getElementById('pegar').value||'');\npintarTodo();\n<\/script>\n<\/body><\/html>\n";

c{background:#eef1f5;color:#334155}\n .vac{color:#7a8794;font-size:14px;padding:7px 2px}\n #hojaControl{display:none}\n @media print{ body>*{display:none!important} #hojaControl{display:block!important} }\n<\/style>\n<\/head>\n<body>\n<div class=\"top\"><h1 id=\"hTit\">Viaje<\/h1><div class=\"fe\" id=\"hFe\">__FECHA__<\/div><\/div>\n<div class=\"med\">\n  <span>Boletas <b id=\"mBol\">0<\/b><\/span><span>Efectivo <b id=\"mEfe\">$0<\/b><\/span>\n  <span>Cheque <b id=\"mChq\">$0<\/b><\/span><span>Transf. <b id=\"mTra\">$0<\/b><\/span><span>Fiado <b id=\"mFia\">$0<\/b><\/span>\n<\/div>\n<div class=\"cuerpo\">\n  <div class=\"hint\">✅ Se guarda en este teléfono aunque no tengas señal. <b>Lo que no marcás queda en EFECTIVO.<\/b><\/div>\n  <input class=\"busca\" id=\"buscaCli\" inputmode=\"search\" placeholder=\"🔎 Buscar cliente...\">\n  <div id=\"lista\"><\/div>\n\n  <div class=\"bloque\">\n    <h2>Plata para gastos<\/h2>\n    <div class=\"lin\"><label>Adelanto al salir<\/label><input id=\"gAdel\" inputmode=\"decimal\" placeholder=\"0\"><\/div>\n    <div class=\"lin\"><span>Gastado del adelanto<\/span><b id=\"gDelAdel\">$0<\/b><\/div>\n    <div class=\"lin\"><span style=\"color:#c2410c\">Sacado de cobranzas<\/span><b id=\"gDeCob\" style=\"color:#c2410c\">$0<\/b><\/div>\n    <div class=\"lin\"><span>Tendría que sobrarte<\/span><b id=\"gSobra\">$0<\/b><\/div>\n    <div class=\"lin\" style=\"background:#eef7ee;margin:6px -12px -12px;padding:11px 12px;border-radius:0 0 12px 12px\"><label><b>Devuelvo<\/b><\/label><input id=\"gDev\" inputmode=\"decimal\" placeholder=\"0\"><\/div>\n  <\/div>\n\n  <div class=\"bloque\">\n    <h2>Gastos del viaje<\/h2>\n    <div id=\"gasList\"><\/div>\n    <span class=\"lnk\" id=\"gasAdd\">+ Agregar gasto<\/span>\n  <\/div>\n\n  <div class=\"bloque\">\n    <h2>Kilómetros<\/h2>\n    <div class=\"lin\"><label>Km al salir<\/label><input id=\"kSal\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n    <div class=\"lin\"><label>Km al volver<\/label><input id=\"kLle\" inputmode=\"numeric\" placeholder=\"0\"><\/div>\n    <div class=\"lin\"><span>Recorridos<\/span><b id=\"kRec\">0 km<\/b><\/div>\n  <\/div>\n\n  <div class=\"tot\">\n    <div class=\"r\"><span>Total boletas<\/span><b id=\"tTot\">$0<\/b><\/div>\n    <div class=\"r\"><span>Efectivo cobrado<\/span><b id=\"tEfe\">$0<\/b><\/div>\n    <div class=\"r\"><span>Sacado para gastos<\/span><b id=\"tSac\">$0<\/b><\/div>\n    <div class=\"r\"><span>Cheques<\/span><b id=\"tChq\">$0<\/b><\/div>\n    <div class=\"r\"><span>Transferencias<\/span><b id=\"tTra\">$0<\/b><\/div>\n    <div class=\"r\"><span>Fiados<\/span><b id=\"tFia\">$0<\/b><\/div>\n    <div class=\"r\"><span>Faltante mercadería<\/span><b id=\"tFal\">$0<\/b><\/div>\n    <div class=\"r\"><span>Devoluciones<\/span><b id=\"tDev\">$0<\/b><\/div>\n    <div class=\"r big\"><span>Efectivo a rendir<\/span><b id=\"tRendir\">$0<\/b><\/div>\n    <div class=\"r\" id=\"rSinAsignar\" style=\"display:none;color:#fca5a5\"><span>Sin asignar (revisá)<\/span><b id=\"tSin\">$0<\/b><\/div>\n  <\/div>\n\n  <div class=\"acc\">\n    <button class=\"sec\" id=\"bImprimir\">🖨 Imprimir<\/button>\n    <button id=\"bCopiar\">📋 Copiar resumen<\/button>\n  <\/div>\n  <div style=\"text-align:center;margin-top:13px\"><button id=\"btnReset\" style=\"border:1px solid #e6bcbc;background:#fff;border-radius:9px;padding:8px 13px;font-size:13px;color:#b91c1c\">🗑 Empezar de nuevo<\/button><\/div>\n<\/div>\n\n<div class=\"modal\" id=\"modalCopiar\"><div class=\"mbox\">\n  <div style=\"font-weight:800;font-size:17px;margin-bottom:5px\">Resumen de <span id=\"mQuien\"><\/span><\/div>\n  <div style=\"font-size:13.5px;color:#475569;margin-bottom:9px\">Tocá <b>Copiar<\/b> y mandalo a la oficina. Si no copia, mantené apretado el texto y elegí Seleccionar todo &gt; Copiar.<\/div>\n  <textarea id=\"mTexto\" readonly><\/textarea>\n  <div class=\"mbtn\"><button id=\"mCopiar\">Copiar<\/button><button class=\"sec\" id=\"mCerrar\">Cerrar<\/button><\/div>\n<\/div><\/div>\n\n<div id=\"hojaControl\"><\/div>\n\n<script>\n'use strict';\nconst FECHA='__FECHA__';\nconst FECHA_ENTREGA='__FECHA_ENTREGA__';\nconst CHOFERES=__CHOFERES__;\nconst VIAJE=__VIAJE__;\nconst TIPOS=['Combustible','Comida','Peaje','Taller','Lavado','Estacionamiento','Otro'];\nvar act=Object.keys(CHOFERES)[0]||'';\nvar LSKEY='castro_viaje_'+act+'_'+FECHA;\nvar filtro='';\n\nfunction $(id){ return document.getElementById(id); }\nfunction esc(s){ return String(s==null?'':s).replace(/[&<>\"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',\"'\":'&#39;'}[c]; }); }\nfunction r2(n){ return Math.round((+n||0)*100)/100; }\nfunction money(n){ return '$'+Math.round(+n||0).toLocaleString('es-AR'); }\nfunction money2(n){ n=r2(n); return '$'+n.toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2}); }\nfunction numAR(s){ s=String(s==null?'':s).trim(); if(!s) return 0; s=s.replace(/\\./g,'').replace(',','.').replace(/[^0-9.\\-]/g,''); var n=parseFloat(s); return isNaN(n)?0:n; }\nfunction feTxt(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p.length===3?(p[2]+'/'+p[1]):String(iso); }\nfunction feLarga(iso){ if(!iso) return ''; var p=String(iso).split('-'); return p.length===3?(p[2]+'/'+p[1]+'/'+p[0]):String(iso); }\n\n/* ---------- estado ---------- */\nfunction nuevoEstado(bol){\n  return { st: bol.map(function(b){\n      return { n:b.n, cli:b.cli||'', dir:b.dir||'', vend:(b.vend!=null?b.vend:b.v), imp:(+b.imp||0), fe:b.fe||null,\n               modo:((+b.imp||0)<0?'nc':'efe'), efeM:0, traM:0, chqM:0, fiaM:0, dev:0, fal:0, falTxt:'', sac:0,\n               feTra:(FECHA_ENTREGA||b.fe||null), comp:'' };\n    }),\n    junto:{}, adel:(VIAJE&&VIAJE.adel)||0, devu:0, km:{sal:0,lle:0}, gastos:[] };\n}\nfunction normalizar(e){\n  if(!e) return e;\n  if(!Array.isArray(e.gastos)) e.gastos=[];\n  if(!e.junto) e.junto={};\n  if(!e.km) e.km={sal:0,lle:0};\n  (e.st||[]).forEach(function(x){ ['efeM','traM','chqM','fiaM','dev','fal','sac'].forEach(function(k){ if(typeof x[k]!=='number') x[k]=0; }); });\n  return e;\n}\nvar STATE=null;\ntry{ var g=localStorage.getItem(LSKEY); if(g) STATE=normalizar(JSON.parse(g)); }catch(e){}\nif(!STATE) STATE=nuevoEstado(CHOFERES[act]||[]);\nelse {\n  // si la oficina mandó boletas nuevas (otro día del mismo viaje), se agregan sin tocar lo ya marcado\n  var hay={}; STATE.st.forEach(function(x){ hay[x.n]=true; });\n  (CHOFERES[act]||[]).forEach(function(b){ if(!hay[b.n]){ STATE.st.push(nuevoEstado([b]).st[0]); } });\n}\nvar _t; function guardar(){ clearTimeout(_t); _t=setTimeout(function(){ try{ localStorage.setItem(LSKEY, JSON.stringify(STATE)); }catch(e){} }, 300); }\nfunction A(){ return STATE; }\n\n/* ---------- plata de cada boleta ---------- */\nfunction neto(x){ return r2(Math.max(0, (x.imp||0) - (x.fal||0) - (x.dev||0))); }\nfunction parte(x){\n  var nt=neto(x);\n  if(x.modo==='nc') return {efe:0,tra:0,chq:0,fia:0};\n  if(x.modo==='dev') return {efe:0,tra:0,chq:0,fia:0};\n  if(x.modo==='efe') return {efe:nt,tra:0,chq:0,fia:0};\n  if(x.modo==='tra') return {efe:0,tra:nt,chq:0,fia:0};\n  if(x.modo==='chq') return {efe:0,tra:0,chq:nt,fia:0};\n  if(x.modo==='fia') return {efe:0,tra:0,chq:0,fia:nt};\n  return {efe:r2(x.efeM),tra:r2(x.traM),chq:r2(x.chqM),fia:r2(x.fiaM)};   // mix\n}\nfunction sinAsignar(x){ if(x.modo!=='mix') return 0; var p=parte(x); return r2(neto(x)-(p.efe+p.tra+p.chq+p.fia)); }\nfunction devMonto(x){ return x.modo==='dev' ? r2(x.imp) : r2(x.dev||0); }\nfunction sobre(x){ return r2(Math.max(0, parte(x).efe - (x.sac||0))); }\n\n/* ---------- agrupar por cliente ---------- */\nfunction grupos(){\n  var out=[], idx={};\n  A().st.forEach(function(x,i){\n    var k=String(x.cli||'').toUpperCase().trim()+'|'+(x.vend!=null?x.vend:'');\n    if(idx[k]==null){ idx[k]=out.length; out.push({k:k, cli:x.cli, vend:x.vend, is:[]}); }\n    out[idx[k]].is.push(i);\n  });\n  return out;\n}\nfunction esJunto(g){ return g.is.length>1 && !!A().junto[g.k]; }\n\n/* ---------- pintar ---------- */\nfunction pintarLista(){\n  var L=$('lista'), f=filtro.trim().toUpperCase();\n  var gs=grupos().filter(function(g){ return !f || String(g.cli).toUpperCase().indexOf(f)>=0 || g.is.some(function(i){ return String(A().st[i].n).toUpperCase().indexOf(f)>=0; }); });\n  if(!gs.length){ L.innerHTML='<div class=\"vac\">No encontré ningún cliente con eso.<\/div>'; return; }\n  var h='', diaAnt=null;\n  gs.forEach(function(g){\n    var x0=A().st[g.is[0]];\n    if(!f && x0.fe!==diaAnt){ diaAnt=x0.fe; h+='<div class=\"dia\">'+esc(feLarga(x0.fe))+'<\/div>'; }\n    h+=grupoHTML(g);\n  });\n  L.innerHTML=h;\n  enganchar();\n}\nfunction grupoHTML(g){\n  var varias=g.is.length>1, junto=esJunto(g);\n  var tot=r2(g.is.reduce(function(a,i){ return a+(A().st[i].imp||0); },0));\n  var h='<div class=\"cliBox'+(varias?'':' uno')+'\" data-g=\"'+esc(g.k)+'\">';\n  if(varias){\n    h+='<div class=\"cliCab\"><span class=\"cliNom\">'+esc(g.cli)+'<\/span><span class=\"cliTot\">'+money(tot)+'<\/span><\/div>'\n     + '<div style=\"font-size:13px;color:#475569;margin:0 3px 6px\">'+g.is.length+' boletas de este cliente<\/div>'\n     + '<div class=\"junto\"><span class=\"sw'+(junto?' on':'')+'\" data-junto=\"'+esc(g.k)+'\"><i><\/i><\/span> Cobra todo junto<\/div>';\n  }\n  if(junto){\n    var x=A().st[g.is[0]];\n    h+='<div class=\"sub azu\" style=\"margin-top:0\">';\n    g.is.forEach(function(i){ var b=A().st[i];\n      h+='<div style=\"display:flex;justify-content:space-between;padding:3px 0;font-size:14px\"><span class=\"nb\">'+esc(b.n)+'<\/span><b>'+money(b.imp)+'<\/b><\/div>'; });\n    h+='<\/div>';\n    h+=botonesHTML(g.is[0], true);\n    h+=detalleHTML(g.is[0], true, tot);\n  } else {\n    g.is.forEach(function(i){ h+=cardHTML(i, varias); });\n  }\n  h+='<\/div>';\n  return h;\n}\nfunction cardHTML(i, conNum){\n  var x=A().st[i];\n  var cl = x.modo==='fia' ? ' fiaC' : (x.modo==='dev' ? ' devC' : ((x.fal>0) ? ' falC' : ''));\n  var h='<div class=\"card'+cl+'\" data-i=\"'+i+'\">'\n   + '<div class=\"l1\"><span class=\"cli\">'+(conNum?('Boleta '+esc(x.n)):esc(x.cli))+'<\/span><span class=\"imp\">'+money(x.imp)+'<\/span><\/div>'\n   + '<div class=\"dir\">'+(conNum?'':'<span class=\"nb\">'+esc(x.n)+'<\/span>')+(x.dir?(conNum?'':' · ')+esc(x.dir):'')+'<\/div>'\n   + botonesHTML(i,false) + detalleHTML(i,false,x.imp)\n   + '<\/div>';\n  return h;\n}\nfunction botonesHTML(i, junto){\n  var x=A().st[i];\n  if(x.modo==='nc') return '<div class=\"sub\">Nota de crédito — no se cobra.<\/div>';\n  function b(m,txt,cls){ return '<button data-m=\"'+m+'\" data-bi=\"'+i+'\" class=\"'+cls+(x.modo===m?' on':'')+'\">'+txt+'<\/button>'; }\n  return '<div class=\"bts\">'\n    + b('efe','Efectivo','b-efe') + b('tra','Transfer.','b-tra') + b('chq','Cheque','b-chq')\n    + b('fia','Fiado','b-fia') + b('dev','Devol.','b-dev') + b('mix','Parcial','b-mix')\n    + '<\/div>';\n}\nfunction detalleHTML(i, junto, totMostrar){\n  var x=A().st[i], h='';\n  if(x.modo==='nc') return '';\n  if(x.modo==='chq'){\n    h+='<div class=\"sub vio\"><div class=\"fila\"><label style=\"color:#6d28d9;font-weight:800\">Cheque<\/label><input data-ro=\"1\" value=\"'+money2(parte(x).chq)+'\" readonly><\/div>'\n      +'<div style=\"font-size:13px;color:#6d28d9\">Los datos del cheque los carga la oficina. Guardá el papel.<\/div><\/div>';\n  } else if(x.modo==='tra'){\n    h+='<div class=\"sub azu\"><div class=\"fila\"><label>Importe<\/label><input data-ro=\"1\" value=\"'+money2(parte(x).tra)+'\" readonly><\/div>'\n      +'<div class=\"fila\"><label>Fecha<\/label><input class=\"txt\" type=\"date\" data-fetra=\"'+i+'\" value=\"'+esc(x.feTra||'')+'\"><\/div>'\n      +'<div class=\"fila\"><label>N° comprobante<\/label><input class=\"txt\" data-comp=\"'+i+'\" value=\"'+esc(x.comp||'')+'\" placeholder=\"opcional\"><\/div><\/div>';\n  } else if(x.modo==='fia'){\n    h+='<div class=\"sub naj\" style=\"font-weight:700;color:#9a3412\">✔ FIRMÓ — va a la cuenta de '+esc(x.cli)+' · '+money2(parte(x).fia)+'<\/div>';\n  } else if(x.modo==='dev'){\n    h+='<div class=\"sub\" style=\"font-weight:700;color:#475569\">↩ DEVOLUCIÓN TOTAL — no entregada<\/div>';\n  } else if(x.modo==='mix'){\n    var sa=sinAsignar(x);\n    h+='<div class=\"sub\">'\n      +'<div class=\"fila\"><label>Efectivo<\/label><input inputmode=\"decimal\" data-mm=\"efeM\" data-mi=\"'+i+'\" value=\"'+(x.efeM||'')+'\" placeholder=\"0\"><\/div>'\n      +'<div class=\"fila\"><label style=\"color:#6d28d9\">Cheque<\/label><input inputmode=\"decimal\" data-mm=\"chqM\" data-mi=\"'+i+'\" value=\"'+(x.chqM||'')+'\" placeholder=\"0\"><\/div>'\n      +'<div class=\"fila\"><label style=\"color:#1d4ed8\">Transferencia<\/label><input inputmode=\"decimal\" data-mm=\"traM\" data-mi=\"'+i+'\" value=\"'+(x.traM||'')+'\" placeholder=\"0\"><\/div>'\n      +'<div class=\"fila\"><label style=\"color:#c2410c\">Fiado (firma)<\/label><input inputmode=\"decimal\" data-mm=\"fiaM\" data-mi=\"'+i+'\" value=\"'+(x.fiaM||'')+'\" placeholder=\"0\"><\/div>'\n      +'<div class=\"fila\" style=\"border-top:2px dashed #cbd5e1;padding-top:8px\"><label><b>'+(sa>0?'Queda sin asignar':(sa<0?'Te pasaste':'Queda sin asignar'))+'<\/b><\/label><b style=\"font-size:18px;color:'+(Math.abs(sa)<0.005?'#0a7c3a':'#b91c1c')+'\">'+money2(sa)+'<\/b><\/div>'\n      +'<\/div>';\n  }\n  if(x.modo!=='dev'){\n    h+='<span class=\"lnk am\" data-fal=\"'+i+'\">'+(x.fal>0?('⚠ Faltó '+money(x.fal)+' — editar'):'⚠ Faltó mercadería')+'<\/span>';\n    if(x.fal>0 || x._falOpen){\n      h+='<div class=\"sub ama\">'\n        +'<div class=\"fila\"><label style=\"color:#a16207;font-weight:800\">Faltó mercadería<\/label><input inputmode=\"decimal\" data-falimp=\"'+i+'\" value=\"'+(x.fal||'')+'\" placeholder=\"0\"><\/div>'\n        +'<div class=\"fila\"><label>Qué faltó<\/label><input class=\"txt\" data-faltxt=\"'+i+'\" value=\"'+esc(x.falTxt||'')+'\" placeholder=\"2 cajas fernet\"><\/div>'\n        +'<div class=\"fila\" style=\"border-top:2px dashed #e0cfa0;padding-top:8px\"><label><b>Cobra<\/b><\/label><b style=\"font-size:18px\">'+money2(neto(x))+'<\/b><\/div><\/div>';\n    }\n  }\n  if(x.modo==='efe' || x.modo==='mix'){\n    h+=' &nbsp; <span class=\"lnk\" data-sac=\"'+i+'\">'+(x.sac>0?('💵 Sacó '+money(x.sac)+' — editar'):'💵 Saqué plata de esta cobranza')+'<\/span>';\n    if(x.sac>0 || x._sacOpen){\n      h+='<div class=\"sub\"><div class=\"fila\"><label>Saqué para gastos<\/label><input inputmode=\"decimal\" data-sacimp=\"'+i+'\" value=\"'+(x.sac||'')+'\" placeholder=\"0\"><\/div>'\n        +'<div class=\"fila\" style=\"border-top:2px dashed #cbd5e1;padding-top:8px\"><label><b>Queda en el sobre<\/b><\/label><b style=\"font-size:18px\">'+money2(sobre(x))+'<\/b><\/div><\/div>';\n    }\n  }\n  if(!junto && A().st[i].modo!=='dev' && A().st[i].modo!=='fia' && A().st[i].modo!=='mix'){\n    h+=' &nbsp; <span class=\"lnk\" data-dev=\"'+i+'\">'+(x.dev>0?('↩ Devolvió '+money(x.dev)+' — editar'):'↩ Devolución parcial')+'<\/span>';\n    if(x.dev>0 || x._devOpen){\n      h+='<div class=\"sub\"><div class=\"fila\"><label>Devolvió (parte)<\/label><input inputmode=\"decimal\" data-devimp=\"'+i+'\" value=\"'+(x.dev||'')+'\" placeholder=\"0\"><\/div>'\n        +'<div class=\"fila\" style=\"border-top:2px dashed #cbd5e1;padding-top:8px\"><label><b>Cobra<\/b><\/label><b style=\"font-size:18px\">'+money2(neto(x))+'<\/b><\/div><\/div>';\n    }\n  }\n  if(junto){\n    var g=grupos().filter(function(gg){ return gg.is.indexOf(i)>=0; })[0];\n    var totG=r2(g.is.reduce(function(a,k){ return a+(A().st[k].imp||0); },0));\n    h+='<div style=\"font-size:13px;color:#475569;margin-top:8px\">Se reparte solo entre las '+g.is.length+' boletas · total '+money2(totG)+'<\/div>';\n  }\n  return h;\n}\nfunction enganchar(){\n  var L=$('lista');\n  L.querySelectorAll('[data-junto]').forEach(function(s){ s.onclick=function(){\n    var k=s.dataset.junto; A().junto[k]=!A().junto[k];\n    if(A().junto[k]){ var g=grupos().filter(function(gg){ return gg.k===k; })[0];\n      var m=A().st[g.is[0]].modo; g.is.forEach(function(i){ A().st[i].modo=m; }); }\n    guardar(); pintarLista(); actualizar();\n  };});\n  L.querySelectorAll('[data-bi]').forEach(function(b){ b.onclick=function(){\n    var i=+b.dataset.bi, m=b.dataset.m, x=A().st[i];\n    var g=grupos().filter(function(gg){ return gg.is.indexOf(i)>=0; })[0];\n    var objetivo = (g && esJunto(g)) ? g.is : [i];\n    objetivo.forEach(function(k){ var y=A().st[k];\n      y.modo = m;\n      if(m!=='mix'){ y.efeM=y.traM=y.chqM=y.fiaM=0; }\n      else if(!(y.efeM||y.traM||y.chqM||y.fiaM)){ y.efeM=neto(y); }\n    });\n    guardar(); pintarLista(); actualizar();\n  };});\n  L.querySelectorAll('[data-mm]').forEach(function(inp){ inp.oninput=function(){\n    var i=+inp.dataset.mi; A().st[i][inp.dataset.mm]=numAR(inp.value); guardar(); actualizarSoloTotales(i); };});\n  L.querySelectorAll('[data-fetra]').forEach(function(inp){ inp.onchange=function(){ A().st[+inp.dataset.fetra].feTra=inp.value||null; guardar(); };});\n  L.querySelectorAll('[data-comp]').forEach(function(inp){ inp.oninput=function(){ A().st[+inp.dataset.comp].comp=inp.value; guardar(); };});\n  L.querySelectorAll('[data-fal]').forEach(function(s){ s.onclick=function(){ var i=+s.dataset.fal; A().st[i]._falOpen=!A().st[i]._falOpen; pintarLista(); };});\n  L.querySelectorAll('[data-sac]').forEach(function(s){ s.onclick=function(){ var i=+s.dataset.sac; A().st[i]._sacOpen=!A().st[i]._sacOpen; pintarLista(); };});\n  L.querySelectorAll('[data-dev]').forEach(function(s){ s.onclick=function(){ var i=+s.dataset.dev; A().st[i]._devOpen=!A().st[i]._devOpen; pintarLista(); };});\n  L.querySelectorAll('[data-falimp]').forEach(function(inp){ inp.oninput=function(){ var i=+inp.dataset.falimp; A().st[i].fal=numAR(inp.value); guardar(); actualizarSoloTotales(i); };});\n  L.querySelectorAll('[data-faltxt]').forEach(function(inp){ inp.oninput=function(){ A().st[+inp.dataset.faltxt].falTxt=inp.value; guardar(); };});\n  L.querySelector async function derivar(cod,id){
  var mat=await crypto.subtle.importKey('raw',new TextEncoder().encode(cod),'PBKDF2',false,['deriveBits']);
  var bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:new TextEncoder().encode(SAL+id),iterations:200000,hash:'SHA-256'},mat,256);
  return new Uint8Array(bits);
}
async function descifrar(bytes,cod,id){
  var kb=await derivar(cod,id);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['decrypt']);
  var iv=bytes.subarray(1,13), ct=bytes.subarray(13);
  var gz=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,ct));
  var ds=new DecompressionStream('gzip');
  var stm=new Blob([gz]).stream().pipeThrough(ds);
  return new TextDecoder().decode(await new Response(stm).arrayBuffer());
}

window.marcarRendido=function(fe,val){ try{ localStorage.setItem(rendidoKey(fe), val?'1':'0'); }catch(e){} pintar(); };

function conectar(){
  try{ firebase.initializeApp(firebaseConfig); db=firebase.firestore(); return true; }
  catch(e){ try{ db=firebase.firestore(); return true; }catch(e2){ return false; } }
}
/* v61: sesion anonima automatica antes de leer (invisible para el chofer). El contenido sigue cifrado con su codigo. */
async function sesion(){ try{ if(!firebase.auth().currentUser) await firebase.auth().signInAnonymously(); }catch(e){} }
/* v62: mandar la RENDICION a la oficina por el buzon, cifrada con el codigo del chofer (misma receta que la bajada). */
async function gzipear(txt){ var cs=new CompressionStream('gzip'); var st2=new Blob([new TextEncoder().encode(txt)]).stream().pipeThrough(cs); return new Uint8Array(await new Response(st2).arrayBuffer()); }
async function cifrar(txt,cod,id){
  var kb=await derivar(cod,id);
  var key=await crypto.subtle.importKey('raw',kb,{name:'AES-GCM'},false,['encrypt']);
  var gz=await gzipear(txt);
  var sem=new Uint8Array(kb.length+gz.length); sem.set(kb,0); sem.set(gz,kb.length);
  var iv=new Uint8Array(await crypto.subtle.digest('SHA-256',sem)).subarray(0,12);
  var ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:iv},key,gz));
  var out=new Uint8Array(1+12+ct.length); out[0]=1; out.set(iv,1); out.set(ct,13);
  var s2=''; for(var i=0;i<out.length;i++) s2+=String.fromCharCode(out[i]);
  return btoa(s2);
}
var ABIERTO=null, ESPERANDO=false;
function vEst(msg,color){ var e=$('vEst'); if(!msg){ e.style.display='none'; return; } e.style.display='block'; e.style.background=color==='ok'?'#eaf6ee':(color==='err'?'#fde2e2':'#fff7e6'); e.style.color=color==='ok'?'#0a5a2a':(color==='err'?'#7c231b':'#5a4a20'); e.textContent=msg; }
window.addEventListener('message', async function(ev){
  try{
    if(!(ev.data && ev.data.tipo==='REND' && ESPERANDO)) return;
    ESPERANDO=false;
    var texto=String(ev.data.texto||''); if(texto.indexOf('[REND]')<0) throw new Error('resumen incompleto');
    if(!db && !conectar()) throw new Error('sin conexión');
    await sesion();
    var b64=await cifrar(texto, CODIGO, CHOFER);
    var fe=(ABIERTO&&ABIERTO.fe)||'';
    var id=CHOFER+'_'+fe+'_'+Date.now();
    await db.collection('rendiciones').doc(id).set({ ch:CHOFER, fe:fe, b:b64, estado:'nuevo', ts:firebase.firestore.FieldValue.serverTimestamp(), fecha_carga:new Date().toISOString() });
    // v119: si era un viaje, se marcan rendidos TODOS los dias que estaban juntos en la planilla
    var _todas = (ABIERTO && ABIERTO.fes && ABIERTO.fes.length) ? ABIERTO.fes : (fe?[fe]:[]);
    _todas.forEach(function(f){ if(f) try{ localStorage.setItem(rendidoKey(f),'1'); }catch(e){} });
    vEst('✔ Rendición mandada a la oficina ('+new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'})+'). Si querés, mandala también por WhatsApp como siempre.','ok');
  }catch(e){ vEst('No se pudo mandar: '+(e&&e.message||e)+'. Probá de nuevo con señal, o mandala por WhatsApp.','err'); }
  finally{ $('bMandar').disabled=false; }
});
$('bMandar').onclick=function(){
  if(!confirm('¿Mandar la rendición de este reparto a la oficina?\n\nPodés mandarla más de una vez si corregís algo: la oficina toma la última.')) return;
  $('bMandar').disabled=true; vEst('Mandando…');
  ESPERANDO=true;
  try{ $('marco').contentWindow.postMessage({tipo:'PEDIR_REND'}, '*'); }catch(e){ ESPERANDO=false; $('bMandar').disabled=false; vEst('No pude leer la planilla. Cerrá y volvé a abrir el reparto.','err'); }
  setTimeout(function(){ if(ESPERANDO){ ESPERANDO=false; $('bMandar').disabled=false; vEst('La planilla no respondió. Cerrá y volvé a abrir el reparto, y probá de nuevo.','err'); } }, 8000);
};
var REP_MAX_VER = 5;   // v102: cuantos repartos se le muestran al chofer (antes eran 15)
async function cargarRepartos(){
  $('avi').textContent='Buscando tus repartos…';
  if(!db && !conectar()){ $('avi').textContent='⚠ Sin conexión. Abrí la app con señal para bajar el reparto.'; return; }
  try{
    await sesion();
    var snap=await db.collection('repartos').where('ch','==',CHOFER).get();
    var arr=[]; snap.forEach(function(d){ var o=d.data()||{}; o._id=d.id; arr.push(o); });
    arr.sort(function(a,b){ return String(b.fe||'').localeCompare(String(a.fe||'')); });
    var out=[];
    for(var i=0;i<arr.length && i<REP_MAX_VER;i++){   // v102: antes 15
      try{ var txt=await descifrar(b64bytes(arr[i].b), CODIGO, CHOFER); out.push(JSON.parse(txt)); }catch(e){}
    }
    REPS=out;
    $('avi').textContent = out.length? ('Tocá el reparto que vas a hacer. El de otro día queda intacto, con lo que ya cargaste.'+(arr.length>REP_MAX_VER?' Se muestran los '+REP_MAX_VER+' más nuevos.':'')) : 'Todavía no hay repartos para vos.';
    pintar();
  }catch(e){ $('avi').textContent='⚠ No se pudieron bajar los repartos. Revisá internet. ('+(e&&e.message||e)+')'; }
}
function pintar(){
  var L=$('lista');
  if(!REPS.length){ L.innerHTML='<div class="vac">Sin repartos por ahora.</div>'; return; }
  L.innerHTML=REPS.map(function(r,i){
    var rend=estaRendido(r.fe);
    var tot=(r.b||[]).reduce(function(a,x){return a+(+x.imp||0);},0);
    return '<div class="rep'+(rend?' rendido':'')+'">'
      + '<div><div class="fe">Reparto del '+feTxt(r.fe)+'</div>'
      + '<div class="meta">'+(r.b||[]).length+' boletas · $'+Math.round(tot).toLocaleString('es-AR')+'</div>'
      + '<div class="est">'+(rend?'✔ ya rendido':'sin rendir')+'</div>'
      + '<button class="chico" onclick="marcarRendido(\''+r.fe+'\','+(rend?'false':'true')+')">'+(rend?'marcar como sin rendir':'marcar como rendido')+'</button></div>'
      + '<button onclick="abrir('+i+')">Abrir</button></div>';
  }).join('');
}
window.abrir=function(i){
  var r=REPS[i]; if(!r) return;
  // v119: FLETES DE VIAJE. Si la oficina marco el reparto con vj=1, se abre la planilla de viaje
  //   y se juntan TODAS las descargas del mismo viaje que todavia no se rindieron, porque el
  //   flete sale varios dias y rinde una sola vez al volver. Para los demas choferes no cambia
  //   absolutamente nada: mismo camino de siempre.
  var esViaje = !!r.vj;
  var bol = (r.b||[]).slice();
  var _fes = [r.fe];
  if(esViaje){
    for(var k=0;k<REPS.length;k++){
      if(k===i) continue;
      var o=REPS[k];
      if(!o || !o.vj || o.ch!==r.ch) continue;
      if(estaRendido(o.fe)) continue;
      (o.b||[]).forEach(function(bb){ bol.push(bb); });
      if(_fes.indexOf(o.fe)<0) _fes.push(o.fe);
    }
    bol.sort(function(a,b){ return String(a.fe||'').localeCompare(String(b.fe||'')) || String(a.n||'').localeCompare(String(b.n||'')); });
  }
  var chObj={}; chObj[r.ch]=bol;
  var _tpl = esViaje ? (PLANILLA_VIAJE||PLANILLA) : PLANILLA;
  var _vj = JSON.stringify({adel:(r.adel||0), kmRuta:(r.kmRuta||0), desde:(r.desde||r.fe||null)});
  var html=_tpl.replace(/__CHOFERES__/g, JSON.stringify(chObj))
                   .replace(/__VIAJE__/g, _vj)
                   .replace(/__FECHA_ENTREGA__/g, r.feEnt||r.fe)
                   .replace(/__FECHA__/g, feTxt(r.fe));
  $('vTit').textContent=(esViaje?'Viaje desde el ':'Reparto del ')+feTxt(r.fe);
  // v119: en un viaje se juntan varios dias en una sola planilla. Hay que recordar CUALES, porque
  //   al mandar la rendicion se marcan como rendidos TODOS esos dias: si no, el dia siguiente se
  //   volverian a juntar en el viaje nuevo y el chofer veria boletas que ya rindio.
  ABIERTO={fe:r.fe, fes:(esViaje ? _fes : [r.fe])}; vEst('');
  $('marco').srcdoc=html;
  $('vista').style.display='flex';
};
$('bVolver').onclick=function(){ $('vista').style.display='none'; $('marco').srcdoc=''; pintar(); };

$('pEntrar').onclick=async function(){
  var b=$('pEntrar'), e=$('pErr'); e.textContent=''; b.disabled=true; b.textContent='Abriendo…';
  var cod=String($('pCod').value||'').trim().toUpperCase();
  var id=idDeCodigo(cod);
  if(!id){ e.textContent='El código va como LUCAS-ABCD2345.'; b.disabled=false; b.textContent='Entrar'; return; }
  if(!db && !conectar()){ e.textContent='Sin conexión. Probá con señal.'; b.disabled=false; b.textContent='Entrar'; return; }
  try{
    await sesion();
    var snap=await db.collection('repartos').where('ch','==',id).get();
    var ok=false, docs=[];
    snap.forEach(function(d){ docs.push(d.data()||{}); });
    for(var i=0;i<docs.length;i++){ try{ await descifrar(b64bytes(docs[i].b), cod, id); ok=true; break; }catch(x){} }
    if(!docs.length){ e.textContent='Todavía no hay reparto para ese código. Pedí que te lo manden.'; b.disabled=false; b.textContent='Entrar'; return; }
    if(!ok){ e.textContent='Código incorrecto. Fijate que esté bien escrito.'; b.disabled=false; b.textContent='Entrar'; return; }
    CHOFER=id; CODIGO=cod;
    try{ localStorage.setItem('castro_rep_cod', cod); }catch(x){}
    $('puerta').style.display='none'; $('hTit').textContent='Reparto — '+CHOFER;
    cargarRepartos();
  }catch(err){ e.textContent='No se pudo entrar. Revisá internet.'; b.disabled=false; b.textContent='Entrar'; }
};
$('pCod').addEventListener('keydown',function(ev){ if(ev.key==='Enter') $('pEntrar').click(); });
$('bSalir').onclick=function(){ try{ localStorage.removeItem('castro_rep_cod'); }catch(x){} location.reload(); };

(function(){
  var g=null; try{ g=localStorage.getItem('castro_rep_cod'); }catch(x){}
  if(!g) return;
  var id=idDeCodigo(g); if(!id) return;
  CHOFER=id; CODIGO=g;
  $('puerta').style.display='none'; $('hTit').textContent='Reparto — '+CHOFER;
  cargarRepartos();
})();
</script>
