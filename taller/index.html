<style>
:root{
  --bg:#F7F3EC; --surf:#FFFDF9; --surf2:#F1EADD;
  --line:#E4D9C6; --line-soft:#EFE7D9;
  --ink:#2E241B; --ink2:#6F5C48; --ink3:#9A8A76;
  --acc:#A8845A; --acc-soft:#EFE3D2; --acc-ink:#7A5E3C;
  --ok:#5A7A4B; --ok-soft:#E6EDE0;
  --warn:#C2851F; --warn-soft:#F8EDD8;
  --crit:#A44A34; --crit-soft:#F6E2DC;
  --shadow:0 1px 2px rgba(46,36,27,.06), 0 4px 14px rgba(46,36,27,.05);
  --sheet-sh:0 -6px 40px rgba(46,36,27,.18);
  --logo-inv:0; color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --bg:#171310; --surf:#221C16; --surf2:#2C241C;
  --line:#3A3027; --line-soft:#2F271F;
  --ink:#F2E9DC; --ink2:#C3B4A0; --ink3:#8D7F6D;
  --acc:#C9A273; --acc-soft:#3A2E22; --acc-ink:#E0BE90;
  --ok:#8FB07C; --ok-soft:#28311F;
  --warn:#DCA847; --warn-soft:#352A16;
  --crit:#D0785F; --crit-soft:#37211B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --sheet-sh:0 -6px 40px rgba(0,0,0,.5);
  --logo-inv:1; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#171310; --surf:#221C16; --surf2:#2C241C;
  --line:#3A3027; --line-soft:#2F271F;
  --ink:#F2E9DC; --ink2:#C3B4A0; --ink3:#8D7F6D;
  --acc:#C9A273; --acc-soft:#3A2E22; --acc-ink:#E0BE90;
  --ok:#8FB07C; --ok-soft:#28311F;
  --warn:#DCA847; --warn-soft:#352A16;
  --crit:#D0785F; --crit-soft:#37211B;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  --sheet-sh:0 -6px 40px rgba(0,0,0,.5);
  --logo-inv:1; color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
html{font-size:17.5px}   /* <- lo cambia el selector de tamaño de letra */
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:0.9375rem;line-height:1.45;-webkit-font-smoothing:antialiased}

#app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg);
  display:flex;flex-direction:column;border-left:1px solid var(--line-soft);border-right:1px solid var(--line-soft)}
@media (max-width:480px){#app{border:0}}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;
  background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line-soft);padding:11px 16px 10px}
.hbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:7px}
.logo{height:26px;width:auto;display:block;opacity:.92}
.iconbtn{background:none;border:0;padding:6px;margin:-6px;cursor:pointer;color:var(--ink2);
  border-radius:8px;display:inline-flex}
.iconbtn:active{background:var(--surf2)}
h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;font-size:1.5rem;line-height:1.15;margin:0;
  letter-spacing:-.01em;text-wrap:balance}
.hsub{font-size:0.7812rem;color:var(--ink3);margin-top:2px}
.hsub.frase{font-style:italic;font-size:0.9375rem;color:var(--acc-ink);background:var(--acc-soft);
  border-left:2.5px solid var(--acc);border-radius:0 9px 9px 0;padding:7px 11px 7px 10px;
  margin-top:8px;line-height:1.35;max-width:38ch}

main{flex:1;padding:15px 15px 104px;display:flex;flex-direction:column;gap:15px}

.seg{display:flex;background:var(--surf2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;background:none;border:0;font-family:inherit;font-size:0.8125rem;font-weight:600;
  color:var(--ink2);padding:7px 4px;border-radius:8px;cursor:pointer}
.seg button[aria-selected="true"]{background:var(--surf);color:var(--ink);box-shadow:var(--shadow)}

section.blk{display:flex;flex-direction:column;gap:9px}
.blk-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.blk-t{font-size:0.6875rem;font-weight:600;letter-spacing:.13em;text-transform:uppercase;color:var(--ink3)}
.blk-a{font-size:0.7812rem;color:var(--acc-ink);font-weight:600;background:none;border:0;padding:0;
  cursor:pointer;font-family:inherit}
.card{background:var(--surf);border:1px solid var(--line);border-radius:12px}

.hero{background:var(--surf);border:1px solid var(--line);border-radius:14px;padding:15px 16px 14px;box-shadow:var(--shadow)}
.hero-lab{font-size:0.7188rem;letter-spacing:.09em;text-transform:uppercase;color:var(--ink3);font-weight:600}
.hero-n{font-family:'Zilla Slab',Georgia,serif;font-weight:700;font-size:2.625rem;line-height:1;
  letter-spacing:-.02em;margin:7px 0 2px;font-variant-numeric:tabular-nums}
.hero-n.neg{color:var(--crit)}
.hero-sub{font-size:0.8125rem;color:var(--ink2)}
.hero-foot{display:flex;margin-top:13px;padding-top:12px;border-top:1px solid var(--line-soft)}
.hero-foot>div{flex:1;padding-right:10px;min-width:0}
.hero-foot>div+div{border-left:1px solid var(--line-soft);padding-left:13px;padding-right:0}
.ff-l{font-size:0.6562rem;color:var(--ink3);letter-spacing:.05em;text-transform:uppercase;font-weight:600}
.ff-v{font-size:1rem;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:0.7188rem;font-weight:600;
  padding:2px 8px;border-radius:20px;border:1px solid transparent;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:color-mix(in srgb,var(--ok) 26%,transparent)}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 30%,transparent)}
.pill.crit{background:var(--crit-soft);color:var(--crit);border-color:color-mix(in srgb,var(--crit) 30%,transparent)}
.pill.mut{background:var(--surf2);color:var(--ink2);border-color:var(--line)}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}

.row{display:flex;align-items:center;gap:11px;padding:11px 12px;border-bottom:1px solid var(--line-soft);
  width:100%;background:none;border-left:0;border-right:0;border-top:0;font-family:inherit;color:inherit;
  text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}
.row:active{background:var(--surf2)}
.row-th{width:42px;height:42px;border-radius:9px;object-fit:cover;flex:none;border:1px solid var(--line);
  background:var(--surf2)}
.row-ph{width:42px;height:42px;border-radius:9px;flex:none;border:1px dashed var(--line);
  background:var(--surf2);display:flex;align-items:center;justify-content:center;color:var(--ink3)}
.row-b{flex:1;min-width:0}
.row-n{font-weight:600;font-size:0.875rem}
.row-s{font-size:0.75rem;color:var(--ink3);margin-top:1px;font-variant-numeric:tabular-nums}
.row-r{text-align:right;flex:none}
.row-v{font-weight:600;font-size:0.875rem;font-variant-numeric:tabular-nums}

/* Al actualizar la app, los datos que ya estaban se conservan.
   Esto completa lo que una versión nueva espera y la vieja no guardaba,
   así nada se rompe ni se pierde al pasar de una versión a otra. */
const ESQUEMA = 1;
function migrar(){
  if(!DB.cfg) DB.cfg = {};
  TABLAS.forEach(k => { if(!Array.isArray(DB[k])) DB[k] = []; });
  DB.insumos.forEach(I => {
    if(I.img === undefined) I.img = '';
    if(I.prov === undefined) I.prov = '';
    if(I.min === undefined) I.min = 0;
  });
  DB.productos.forEach(p => {
    if(!Array.isArray(p.rec)) p.rec = [];
    if(p.img === undefined) p.img = '';
    if(p.med === undefined) p.med = '';
    if(p.mo === undefined) p.mo = 0;
    if(p.stock === undefined) p.stock = 0;
  });
  DB.ventas.forEach(v => { if(!v.cant) v.cant = 1; if(!v.canal) v.canal = 'Local'; });
  DB.gastos.forEach(g => { if(!g.rubro) g.rubro = 'Otros'; });
  DB.encargos.forEach(e => {
    if(!e.estado) e.estado = 'pendiente';
    if(e.sena === undefined) e.sena = 0;
    if(!e.entrega) e.entrega = e.fecha || hoyISO();
  });
  DB.agenda.forEach(e => {
    if(e.hecho === undefined) e.hecho = false;
    if(!Array.isArray(e.hechos)) e.hechos = [];
    if(e.repetir === undefined) e.repetir = '';
    if(!e.tipo) e.tipo = 'tarea';
  });
  if(!DB.cfg.margenObj) DB.cfg.margenObj = 50;
  if(DB.cfg.ultimoRespaldo === undefined) DB.cfg.ultimoRespaldo = '';
  if(!DB.cfg.escala) DB.cfg.escala = 'no';
  if(DB.cfg.pin === undefined) DB.cfg.pin = '';
  if(DB.cfg.v !== ESQUEMA) DB.cfg.v = ESQUEMA;
}
migrar();

/* ============ CÁLCULO ============ */
const ins  = id => DB.insumos.find(x => x.id === id);
const prod = id => DB.productos.find(x => x.id === id);

function lineaCosto(r){
  const I = ins(r.i);
  if(!I) return {costo:0, txt:'insumo borrado', falta:true};
  if(r.m === 'rinde'){
    const v = +r.v || 1;
    return {costo: I.costo / v, txt:`rinde ${nf(v)} por ${I.u}`};
  }
  return {costo: I.costo * (+r.v || 0), txt:`${nf(+r.v || 0)} ${I.u}`};
}
const costoMat   = p => (p.rec || []).reduce((s,r) => s + lineaCosto(r).costo, 0);
const costoTotal = p => costoMat(p) + (+p.mo || 0);
const margenPct  = p => p.precio ? (p.precio - costoTotal(p)) / p.precio * 100 : 0;
const sugerido   = p => { const m = (+DB.cfg.margenObj || 0) / 100; return m < 1 ? costoTotal(p) / (1 - m) : 0; };

const fmt = n => (n < 0 ? '−$' : '$') + Math.round(Math.abs(n)).toLocaleString('es-AR');
const pct = n => (isFinite(n) ? n.toFixed(1).replace('.',',') : '0,0') + '%';
const nf  = n => (Math.round(n * 100) / 100).toLocaleString('es-AR');
const MESN = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const mesDe = iso => (iso || '').slice(0, 7);
const mesHoy = () => hoyISO().slice(0, 7);
const dm = iso => iso ? iso.slice(8,10) + '/' + iso.slice(5,7) : '';

function balance(mes){
  const vs = DB.ventas.filter(v => mesDe(v.fecha) === mes);
  let vendido = 0, costo = 0, piezas = 0;
  vs.forEach(v => {
    const p = prod(v.prod), c = +v.cant || 1;
    vendido += (+v.precio || 0) * c; piezas += c;
    if(p) costo += costoTotal(p) * c;
  });
  const gastos = DB.gastos.filter(g => mesDe(g.fecha) === mes).reduce((s,g) => s + (+g.importe || 0), 0);
  const bruta = vendido - costo;
  return {vendido, costo, piezas, gastos, bruta, neto: bruta - gastos,
          margenBruto: vendido ? bruta / vendido * 100 : 0,
          margenNeto:  vendido ? (bruta - gastos) / vendido * 100 : 0};
}
function nivel(I){
  const min = +I.min || 0;
  if(!min) return 'ok';
  if(I.stock < min) return 'crit';
  if(I.stock < min * 1.4) return 'warn';
  return 'ok';
}
const capital = () => ({
  term: DB.productos.reduce((s,p) => s + costoTotal(p) * (+p.stock || 0), 0),
  mat:  DB.insumos.reduce((s,I) => s + (+I.costo || 0) * (+I.stock || 0), 0),
});
const mesesConDatos = () => {
  const s = new Set([mesHoy()]);
  DB.ventas.forEach(v => s.add(mesDe(v.fecha)));
  DB.gastos.forEach(g => s.add(mesDe(g.fecha)));
  return [...s].filter(Boolean).sort();
};

const sumaDias = (iso, n) => { const d = new Date(iso + 'T12:00:00'); d.setDate(d.getDate() + n); return d.toISOString().slice(0,10); };
const diasEntre = (a, b) => Math.round((new Date(b + 'T12:00:00') - new Date(a + 'T12:00:00')) / 86400000);

/* ¿cae este evento propio en esta fecha? (contempla repetición) */
function caeEn(ev, iso){
  if(ev.fecha === iso) return true;
  if(!ev.repetir || iso < ev.fecha) return false;
  if(ev.repetir === 'semanal')  return diasEntre(ev.fecha, iso) % 7 === 0;
  if(ev.repetir === 'mensual')  return iso.slice(8,10) === ev.fecha.slice(8,10);
  return false;
}
function hechoEn(ev, iso){
  if(!ev.repetir) return !!ev.hecho;
  return Array.isArray(ev.hechos) && ev.hechos.includes(iso);
}
/* eventos de un día: los propios + los que la app deduce sola */
function eventosDe(iso){
  const L = DB.agenda.filter(e => caeEn(e, iso)).map(e => ({
    id:e.id, tipo:e.tipo, titulo:e.titulo, hora:e.hora || '', nota:e.nota || '',
    hecho:hechoEn(e, iso), propio:true, repetir:e.repetir || ''
  }));
  DB.encargos.filter(e => e.estado === 'pendiente' && e.entrega === iso).forEach(e => {
    const p = prod(e.prod);
    L.push({id:'enc-' + e.id, encargo:e.id, tipo:'entrega', hora:'',
      titulo:`Entregar a ${e.cliente}`,
      nota:`${p ? p.n : ''} · cobrar ${fmt(e.precio - e.sena)}`, hecho:false, propio:false});
  });
  if(iso === hoyISO()){
    const bajos = DB.insumos.filter(I => nivel(I) === 'crit');
    if(bajos.length) L.push({id:'ins-bajos', tipo:'compra', hora:'',
      titulo:`Comprar ${bajos.length} insumo${bajos.length > 1 ? 's' : ''}`,
      nota:bajos.map(I => I.n).join(', '), hecho:false, propio:false, irA:'insumos'});
    if(tocaRespaldo()) L.push({id:'respaldo', tipo:'respaldo', hora:'',
      titulo:'Mandar el respaldo', nota:textoRespaldo(), hecho:false, propio:false, respaldo:true});
  }
  return L.sort((a,b) => (a.hora || '99').localeCompare(b.hora || '99'));
}
const tocaRespaldo = () => !DB.cfg.ultimoRespaldo || diasEntre(DB.cfg.ultimoRespaldo, hoyISO()) >= 7;
const textoRespaldo = () => DB.cfg.ultimoRespaldo
  ? `El último fue hace ${diasEntre(DB.cfg.ultimoRespaldo, hoyISO())} días`
  : 'Todavía no mandaste ninguno';
/* días del mes que tienen algo, para marcar en el almanaque */
function diasConAlgo(anio, mes){
  const fin = new Date(anio, mes + 1, 0).getDate(), marcas = {};
  for(let d = 1; d <= fin; d++){
    const iso = `${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const ev = eventosDe(iso);
    if(ev.length) marcas[d] = ev.some(e => e.tipo === 'entrega') ? 'entrega' : 'otro';
  }
  return marcas;
}
</script>

<script>
/* ============ HOJA (bottom sheet) ============ */
const SH = document.getElementById('sheet'), SC = document.getElementById('scrim');
let onCerrar = null;
function abrir(titulo, cuerpo, pie, montar){
  document.getElementById('sheet-t').textContent = titulo;
  document.getElementById('sheet-b').innerHTML = cuerpo;
  document.getElementById('sheet-f').innerHTML = pie || '';
  SH.hidden = false; SC.hidden = false;
  requestAnimationFrame(() => { SH.classList.add('on'); SC.classList.add('on'); });
  if(montar) montar();
}
function cerrar(){
  SH.classList.remove('on'); SC.classList.remove('on');
  setTimeout(() => { SH.hidden = true; SC.hidden = true;
    document.getElementById('sheet-b').innerHTML = ''; document.getElementById('sheet-f').innerHTML = ''; }, 240);
  if(onCerrar){ const f = onCerrar; onCerrar = null; f(); }
}
document.getElementById('sheet-x').addEventListener('click', cerrar);
SC.addEventListener('click', cerrar);
document.addEventListener('keydown', e => { if(e.key === 'Escape' && !SH.hidden) cerrar(); });

/* ============ FOTO ============ */
function campoFoto(src, texto){
  return `<div class="photo">
    <div class="photo-box${src ? ' has' : ''}" id="ph-box" role="button" tabindex="0" aria-label="Elegir foto">
      ${src ? `<img id="ph-img" src="${src}" alt="">` : ICO.fotoG}</div>
    <div class="photo-t"><b>Foto</b>${esc(texto)}
      <button type="button" class="photo-x" id="ph-del"${src ? '' : ' hidden'}>Quitar foto</button></div>
    <input type="file" id="ph-in" accept="image/*" hidden>
  </div>`;
}
function montarFoto(inicial){
  const box = document.getElementById('ph-box'), inp = document.getElementById('ph-in'),
        del = document.getElementById('ph-del');
  let actual = inicial || '';
  const pintar = () => {
    box.innerHTML = actual ? `<img src="${actual}" alt="">` : ICO.fotoG;
    box.classList.toggle('has', !!actual);
    del.hidden = !actual;
  };
  box.addEventListener('click', () => inp.click());
  box.addEventListener('keydown', e => { if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); inp.click(); } });
  del.addEventListener('click', () => { actual = ''; inp.value = ''; pintar(); });
  inp.addEventListener('change', () => {
    const f = inp.files && inp.files[0];
    if(!f) return;
    const fr = new FileReader();
    fr.onload = () => {
      const im = new Image();
      im.onload = () => {
        const L = 260, s = Math.min(im.width, im.height);
        const c = document.createElement('canvas'); c.width = L; c.height = L;
        c.getContext('2d').drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, L, L);
        actual = c.toDataURL('image/jpeg', 0.72); pintar();
      };
      im.onerror = () => toast('No se pudo leer esa imagen.');
      im.src = fr.result;
    };
    fr.readAsDataURL(f);
  });
  return () => actual;
}

/* ============ EDITORES ============ */
const UNIS = ['cuero','u','m','cono','kg','rollo','plancha'];

function edInsumo(id){
  const I = id ? ins(id) : null;
  const d = I || {n:'', u:'u', stock:0, costo:0, min:0, prov:'', img:''};
  abrir(I ? 'Editar insumo' : 'Nuevo insumo', `
    ${campoFoto(d.img, 'Sacale una foto o elegí una de la galería. Ayuda cuando hay varios parecidos.')}
    <div class="field"><label for="e-n">Nombre</label>
      <input id="e-n" value="${esc(d.n)}" placeholder="Cuero vacuno marrón"></div>

      <div class="field"><label for="e-c">Costo por unidad</label>

    </div>

      <div class="field"><label for="e-s">Stock</label>
        <input type="number" id="e-s" value="${d.stock}" step="any" inputmode="decimal"></div>

    </div>
    <div class="field"><label for="e-p">Proveedor</label>
      <input id="e-p" value="${esc(d.prov)}" placeholder="Curtiembre Arroyito"></div>`,
    `<div class="btnrow">${I ? '<button class="btn danger" id="e-del">Borrar</button>' : ''}
      <button class="btn" id="e-ok">Guardar</button></div>`,
    () => {
      const getFoto = montarFoto(d.img);
      document.getElementById('e-ok').onclick = () => {
        const n = document.getElementById('e-n').value.trim();
        if(!n) return toast('Ponele un nombre al insumo.');
        const o = {n, u:document.getElementById('e-u').value,
          costo:+document.getElementById('e-c').value || 0,
          stock:+document.getElementById('e-s').value || 0,
          min:+document.getElementById('e-m').value || 0,
          prov:document.getElementById('e-p').value.trim(), img:getFoto()};
        if(I) Object.assign(I, o); else DB.insumos.push({id:uid(), ...o});
        guardar(); cerrar(); render(); toast(I ? 'Insumo actualizado.' : 'Insumo agregado.');
      };
      const bd = document.getElementById('e-del');
      if(bd) bd.onclick = () => {
        const usan = DB.productos.filter(p => (p.rec || []).some(r => r.i === I.id));
        if(usan.length) return toast(`No se puede: lo usan ${usan.length} modelo${usan.length>1?'s':''}.`);
        DB.insumos = DB.insumos.filter(x => x.id !== I.id);
        guardar(); cerrar(); render(); toast('Insumo borrado.');
      };

function filaRec(r, k){
  return `<div class="recrow" data-k="${k}">
    <div><label>Insumo</label><select class="r-i">
      ${DB.insumos.map(I => `<option value="${I.id}"${I.id === r.i ? ' selected' : ''}>${esc(I.n)}</option>`).join('')}
    </select></div>
    <div><label>Cuánto</label><input type="number" class="r-v" value="${r.v}" step="any" inputmode="decimal"></div>
    <div style="flex:none"><label>&nbsp;</label><select class="r-m" style="width:88px">
      <option value="cant"${r.m === 'cant' ? ' selected' : ''}>unidades</option>
      <option value="rinde"${r.m === 'rinde' ? ' selected' : ''}>rinde</option></select></div>
    <button type="button" class="del" aria-label="Quitar">${ICO.tacho}</button>
  </div>`;
}
function edProducto(id){
  const P = id ? prod(id) : null;
  const d = P || {n:'', med:'', precio:0, stock:0, mo:0, img:'', rec:[]};
  let recs = (d.rec || []).map(r => ({...r}));
  if(!DB.insumos.length) return toast('Cargá primero algún insumo.');
  abrir(P ? 'Editar modelo' : 'Nuevo modelo', `
    ${campoFoto(d.img, 'La foto es la que se ve en la grilla de productos.')}
    <div class="field"><label for="e-n">Nombre</label>
      <input id="e-n" value="${esc(d.n)}" placeholder="Cartera Stela"></div>
    <div class="field"><label for="e-md">Medidas</label>
      <input id="e-md" value="${esc(d.med)}" placeholder="27×17×8 cm"></div>
    <div class="row2">
      <div class="field"><label for="e-pr">Precio de venta</label>
        <input type="number" id="e-pr" value="${d.precio}" inputmode="decimal"></div>
      <div class="field"><label for="e-st">Stock hecho</label>
        <input type="number" id="e-st" value="${d.stock}" inputmode="numeric"></div>
    </div>
    <div class="field"><label for="e-mo">Mano de obra por pieza</label>
      <input type="number" id="e-mo" value="${d.mo}" inputmode="decimal"></div>
    <label style="margin-top:16px">Qué lleva cada pieza</label>
    <div class="hintbox hint"><b>unidades</b> = cuántas usa (2 mosquetones).<br>
      <b>rinde</b> = cuántas piezas salen de uno (de 1 cuero salen 6).</div>
    <div class="reclist" id="e-rec"></div>
    <button type="button" class="addline" id="e-add">+ Agregar insumo</button>
    <div class="hintbox hint" id="e-calc" style="margin-top:14px"></div>`,
    `<div class="btnrow">${P ? '<button class="btn danger" id="e-del">Borrar</button>' : ''}
      <button class="btn" id="e-ok">Guardar</button></div>`,
    () => {
      const getFoto = montarFoto(d.img);
      const cont = document.getElementById('e-rec');
      const pintarRec = () => {
        cont.innerHTML = recs.map((r,k) => filaRec(r,k)).join('') ||
          '<div class="hint" style="padding:4px 0">Sin insumos todavía.</div>';
        cont.querySelectorAll('.recrow').forEach(row => {
          const k = +row.dataset.k;
          row.querySelector('.r-i').onchange = e => { recs[k].i = e.target.value; calc(); };
          row.querySelector('.r-v').oninput  = e => { recs[k].v = +e.target.value || 0; calc(); };
          row.querySelector('.r-m').onchange = e => { recs[k].m = e.target.value; calc(); };
          row.querySelector('.del').onclick  = () => { recs.splice(k,1); pintarRec(); calc(); };
        });
      };
      const calc = () => {
        const tmp = {rec:recs, mo:+document.getElementById('e-mo').value || 0};
        const c = costoTotal(tmp), pr = +document.getElementById('e-pr').value || 0;
        const mg = pr ? (pr - c) / pr * 100 : 0;
        const sug = (+DB.cfg.margenObj || 0) < 100 ? c / (1 - (+DB.cfg.margenObj || 0) / 100) : 0;
        document.getElementById('e-calc').innerHTML =
          `Cuesta <b>${fmt(c)}</b> (materiales ${fmt(costoMat(tmp))} + mano de obra ${fmt(tmp.mo)}).<br>` +
          (pr ? `A ${fmt(pr)} deja <b>${fmt(pr - c)}</b> · ${pct(mg)}<br>` : '') +
          `Para ganar ${DB.cfg.margenObj}% habría que venderla a <b>${fmt(sug)}</b>.`;
      };
      document.getElementById('e-add').onclick = () => {
        recs.push({i:DB.insumos[0].id, m:'cant', v:1}); pintarRec(); calc();
      };
      document.getElementById('e-mo').oninput = calc;
      document.getElementById('e-pr').oninput = calc;
      pintarRec(); calc();
      document.getElementById('e-ok').onclick = () => {
        const n = document.getElementById('e-n').value.trim();
        if(!n) return toast('Ponele un nombre al modelo.');
        const o = {n, med:document.getElementById('e-md').value.trim(),
          precio:+document.getElementById('e-pr').value || 0,
          stock:+document.getElementById('e-st').value || 0,
          mo:+document.getElementById('e-mo').value || 0,
          img:getFoto(), rec:recs.filter(r => r.i && r.v)};
        if(P) Object.assign(P, o); else DB.productos.push({id:uid(), ...o});
        guardar(); cerrar(); render(); toast(P ? 'Modelo actualizado.' : 'Modelo agregado.');
      };
      const bd = document.getElementById('e-del');
      if(bd) bd.onclick = () => {
        DB.productos = DB.productos.filter(x => x.id !== P.id);
        guardar(); cerrar(); ir('productos'); toast('Modelo borrado.');
      };
    });
}

const RUBROS = ['Publicidad','Packaging','Envíos','Taller','Herramientas','Feria','Impuestos','Otros'];
function edGasto(id){
  const G = id ? DB.gastos.find(x => x.id === id) : null;
  const d = G || {fecha:hoyISO(), rubro:'Publicidad', detalle:'', importe:0};

    <div class="field"><label for="e-r">Rubro</label>

const CANALES = ['Instagram','Local','Mayorista','Feria','WhatsApp'];
function edVenta(id, pre){
  const V = id ? DB.ventas.find(x => x.id === id) : null;
  if(!DB.productos.length) return toast('Cargá primero algún modelo.');
  const d = V || {fecha:hoyISO(), prod:pre || DB.productos[0].id, canal:'Instagram',
                  precio:prod(pre || DB.productos[0].id).precio, cant:1};
  abrir(V ? 'Editar venta' : 'Nueva venta', `
    <div class="field"><label for="e-p">Modelo</label>
      <select id="e-p">${DB.productos.map(p => `<option value="${p.id}"${p.id === d.prod ? ' selected' : ''}>${esc(p.n)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label for="e-pr">Precio por pieza</label>
        <input type="number" id="e-pr" value="${d.precio}" inputmode="decimal"></div>
      <div class="field"><label for="e-c">Cantidad</label>
        <input type="number" id="e-c" value="${d.cant || 1}" min="1" inputmode="numeric"></div>
    </div>
    <div class="row2">
      <div class="field"><label for="e-f">Fecha</label><input type="date" id="e-f" value="${d.fecha}"></div>
      <div class="field"><label for="e-ca">Canal</label>
        <select id="e-ca">${[...new Set([...CANALES, ...DB.ventas.map(v => v.canal)])].filter(Boolean)
          .map(c => `<option${c === d.canal ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select></div>
    </div>
    <div class="hintbox hint" id="e-calc"></div>`,
    `<div class="btnrow">${V ? '<button class="btn danger" id="e-del">Borrar</button>' : ''}
      <button class="btn" id="e-ok">${V ? 'Guardar' : 'Registrar venta'}</button></div>`,
    () => {
      const sp = document.getElementById('e-p'), pr = document.getElementById('e-pr'),
            cc = document.getElementById('e-c'), box = document.getElementById('e-calc');
      const calc = () => {
        const p = prod(sp.value), c = costoTotal(p), precio = +pr.value || 0, n = +cc.value || 1;
        const g = (precio - c) * n, mg = precio ? (precio - c) / precio * 100 : 0;
        box.innerHTML = precio >= c
          ? `Cuesta <b>${fmt(c)}</b> por pieza · deja <b>${fmt(g)}</b> (${pct(mg)})` +
            (p.stock < n ? `<br><span style="color:var(--warn)">Ojo: hay ${p.stock} en stock.</span>` : '')
          : `<span style="color:var(--crit)">Cuesta ${fmt(c)} — a ese precio perdés ${fmt(c - precio)} por pieza.</span>`;
      };
      sp.onchange = () => { if(!V) pr.value = prod(sp.value).precio; calc(); };
      pr.oninput = calc; cc.oninput = calc; calc();
      document.getElementById('e-ok').onclick = () => {
        const n = Math.max(1, +cc.value || 1);
        const o = {fecha:document.getElementById('e-f').value || hoyISO(), prod:sp.value,
                   canal:document.getElementById('e-ca').value, precio:+pr.value || 0, cant:n};
        if(V){ Object.assign(V, o); }
        else{
          DB.ventas.unshift({id:uid(), ...o});
          const p = prod(o.prod); p.stock = Math.max(0, (+p.stock || 0) - n);
        }
        guardar(); cerrar(); render(); toast(V ? 'Venta actualizada.' : 'Venta registrada.');
      };
      const bd = document.getElementById('e-del');
      if(bd) bd.onclick = () => { DB.ventas = DB.ventas.filter(x => x.id !== V.id);
        guardar(); cerrar(); render(); toast('Venta borrada.'); };
    });
}

function edCompra(insId){
  if(!DB.insumos.length) return toast('Cargá primero algún insumo.');
  const first = insId || DB.insumos[0].id;
  abrir('Cargar compra', `
    <div class="field"><label for="e-i">Insumo</label>
      <select id="e-i">${DB.insumos.map(I => `<option value="${I.id}"${I.id === first ? ' selected' : ''}>${esc(I.n)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label for="e-c">Cantidad</label>
        <input type="number" id="e-c" value="1" step="any" inputmode="decimal"></div>
      <div class="field"><label for="e-u">Precio por unidad</label>
        <input type="number" id="e-u" value="" inputmode="decimal"></div>
    </div>
    <div class="field"><label for="e-f">Fecha</label><input type="date" id="e-f" value="${hoyISO()}"></div>
    <div class="hintbox hint" id="e-calc"></div>`,
    '<button class="btn" id="e-ok">Cargar compra</button>',
    () => {
      const si = document.getElementById('e-i'), cc = document.getElementById('e-c'),
            cu = document.getElementById('e-u'), box = document.getElementById('e-calc');
      const setU = () => { cu.value = ins(si.value).costo; };
      const calc = () => {
        const I = ins(si.value), n = +cc.value || 0, u = +cu.value || 0;
        const dif = u - I.costo;
        box.innerHTML = `Quedan <b>${nf((+I.stock || 0) + n)} ${esc(I.u)}</b> en stock.<br>` +
          (dif !== 0 && I.costo
            ? `El costo pasa de ${fmt(I.costo)} a <b>${fmt(u)}</b> · ${dif > 0 ? 'subió' : 'bajó'} ${pct(Math.abs(dif / I.costo * 100))}.
               <br><span style="color:var(--ink3)">Se recalculan los márgenes de todos los modelos que lo usan.</span>`
            : `Costo por ${esc(I.u)}: <b>${fmt(u)}</b>.`) +
          `<br>Total de la compra: <b>${fmt(n * u)}</b>`;
      };
      si.onchange = () => { setU(); calc(); };
      cc.oninput = calc; cu.oninput = calc;
      setU(); calc();
      document.getElementById('e-ok').onclick = () => {
        const I = ins(si.value), n = +cc.value || 0, u = +cu.value || 0;
        if(n <= 0) return toast('Poné la cantidad comprada.');
        I.stock = (+I.stock || 0) + n;
        if(u > 0) I.costo = u;
        DB.compras.unshift({id:uid(), fecha:document.getElementById('e-f').value || hoyISO(),
                            ins:I.id, cant:n, costoUnit:u});
        guardar(); cerrar(); render(); toast(`Compra cargada. Stock: ${nf(I.stock)} ${I.u}.`);
      };
    });
}

function edProducir(prodId){
  if(!DB.productos.length) return toast('Cargá primero algún modelo.');
  abrir('Registrar producción', `
    <div class="field"><label for="e-p">Modelo</label>
      <select id="e-p">${DB.productos.map(p => `<option value="${p.id}"${p.id === prodId ? ' selected' : ''}>${esc(p.n)}</option>`).join('')}</select></div>
    <div class="row2">
      <div class="field"><label for="e-c">Cuántas armó</label>
        <input type="number" id="e-c" value="1" min="1" inputmode="numeric"></div>
      <div class="field"><label for="e-f">Fecha</label><input type="date" id="e-f" value="${hoyISO()}"></div>
    </div>
    <label>Qué se descuenta</label>
    <div class="hintbox hint" id="e-calc"></div>`,
    '<button class="btn" id="e-ok">Registrar</button>',
    () => {
      const sp = document.getElementById('e-p'), cc = document.getElementById('e-c'),
            box = document.getElementById('e-calc');
      const consumo = (p, n) => (p.rec || []).map(r => {
        const I = ins(r.i); if(!I) return null;
        const usa = r.m === 'rinde' ? n / (+r.v || 1) : (+r.v || 0) * n;
        return {I, usa, queda: (+I.stock || 0) - usa};
      }).filter(Boolean);
      const calc = () => {
        const p = prod(sp.value), n = Math.max(1, +cc.value || 1), L = consumo(p, n);
        if(!L.length){ box.innerHTML = 'Este modelo no tiene insumos cargados: solo suma stock.'; return; }
        box.innerHTML = L.map(x =>
          `${esc(x.I.n)}: <b>${nf(x.usa)} ${esc(x.I.u)}</b> → quedan ${nf(x.queda)}` +
          (x.queda < 0 ? ' <span style="color:var(--crit)">(no alcanza)</span>' : '')).join('<br>') +
          `<br><br>Costo de la tanda: <b>${fmt(costoTotal(p) * n)}</b>`;
      };
      sp.onchange = calc; cc.oninput = calc; calc();
      document.getElementById('e-ok').onclick = () => {

/* ---- .ics: lo carga en el Calendario del iPhone, con alarma ---- */
function armarICS(ev){
  const z = n => String(n).padStart(2,'0');
  const conHora = !!ev.hora;
  const stamp = new Date().toISOString().replace(/[-:]/g,'').slice(0,15) + 'Z';
  const f = ev.fecha.replace(/-/g,'');
  let ini, fin;
  if(conHora){
    const [h,m] = ev.hora.split(':').map(Number);
    ini = `DTSTART:${f}T${z(h)}${z(m)}00`;
    const d2 = new Date(ev.fecha + 'T' + ev.hora + ':00'); d2.setHours(d2.getHours() + 1);
    fin = `DTEND:${d2.getFullYear()}${z(d2.getMonth()+1)}${z(d2.getDate())}T${z(d2.getHours())}${z(d2.getMinutes())}00`;
  } else {
    ini = `DTSTART;VALUE=DATE:${f}`;
    fin = `DTEND;VALUE=DATE:${sumaDias(ev.fecha,1).replace(/-/g,'')}`;
  }
  const rep = ev.repetir === 'semanal' ? '\r\nRRULE:FREQ=WEEKLY'
            : ev.repetir === 'mensual' ? '\r\nRRULE:FREQ=MONTHLY' : '';
  const lim = s => String(s || '').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//La Barbara//Taller//ES','CALSCALE:GREGORIAN',
    'BEGIN:VEVENT', `UID:${uid()}@labarbara`, `DTSTAMP:${stamp}`, ini, fin,
    `SUMMARY:${lim(ev.titulo)}`,
    ev.nota ? `DESCRIPTION:${lim(ev.nota)}` : 'DESCRIPTION:La Bárbara',
    'BEGIN:VALARM', conHora ? 'TRIGGER:-PT1H' : 'TRIGGER:-P1D',
    'ACTION:DISPLAY', `DESCRIPTION:${lim(ev.titulo)}`, 'END:VALARM',
    'END:VEVENT' + rep, 'END:VCALENDAR'].join('\r\n');
}
async function alCalendario(ev){
  const ics = armarICS(ev);
  const nombre = 'labarbara-' + ev.fecha + '.ics';
  try{
    if(navigator.canShare){
      const file = new File([ics], nombre, {type:'text/calendar'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:ev.titulo});
        toast('Elegí "Calendario" para que te avise.');
        return;
      }
    }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  try{
    const blob = new Blob([ics], {type:'text/calendar'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('Abrí el archivo para agregarlo al calendario.');
  }catch(e){ toast('Acá no se puede. En el teléfono va a andar.'); }
}

/* ---- respaldo: lo manda por donde ella elija ---- */
async function mandarRespaldo(){
  const txt = JSON.stringify(DB, null, 1);
  const nombre = 'taller-labarbara-' + hoyISO() + '.json';
  const marcar = () => { DB.cfg.ultimoRespaldo = hoyISO(); guardar(); render(); };
  try{
    if(navigator.canShare){
      const file = new File([txt], nombre, {type:'application/json'});
      if(navigator.canShare({files:[file]})){
        await navigator.share({files:[file], title:'Respaldo del taller',
          text:'Respaldo de La Bárbara — ' + hoyISO()});
        marcar(); toast('Respaldo enviado.');
        return;
      }
    }
  }catch(err){ if(err && err.name === 'AbortError') return; }
  try{
    const dl = (window.claude && window.claude.use) ? await window.claude.use('downloads') : null;
    if(dl){ await dl.save({filename:nombre, data:txt}); marcar(); toast('Respaldo guardado.'); return; }
  }catch(err){
    if(err && err.code === 'declined') return;
    if(err && err.code === 'rate_limited') return toast('Esperá unos segundos y probá de nuevo.');
  }
  try{
    const blob = new Blob([txt], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    marcar(); toast('Respaldo bajado.');
  }catch(e){ toast('Acá no se puede bajar. En la app publicada va a andar.'); }
}
