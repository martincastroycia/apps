        if(!cred().u) return toast('Primero hay que conectar la nube.');
        const b = document.getElementById('a-nube-baja');
        if(b.dataset.ok !== '1'){
          b.dataset.ok = '1';
          b.textContent = 'Reemplaza todo · confirmar';
          return;
        }
        nubeBajar();
      };
      document.getElementById('a-esc').querySelectorAll('[data-esc]').forEach(b => {
        b.onclick = () => {
          DB.cfg.escala = b.dataset.esc;
          aplicarEscala(); guardar();
          document.getElementById('a-esc').querySelectorAll('[data-esc]').forEach(o =>
            o.setAttribute('aria-selected', o.dataset.esc === DB.cfg.escala));
          render();
        };
      });
      document.getElementById('a-man').onclick = () => verTexto('Cómo funciona', MANUAL);
      document.getElementById('a-nov').onclick = () => verTexto('Novedades', NOVEDADES);
      document.getElementById('a-exp').onclick = mandarRespaldo;
      const f = document.getElementById('a-file');
      document.getElementById('a-imp').onclick = () => f.click();
      f.onchange = () => {
        const file = f.files && f.files[0]; if(!file) return;
        const fr = new FileReader();
        fr.onload = () => {
          try{
            const o = JSON.parse(fr.result);
            if(!o || !Array.isArray(o.productos)) throw 0;
            DB = o;
            migrar();
            guardar(); cerrar(); ir('hoy'); toast('Respaldo cargado.');
          }catch(e){ toast('Ese archivo no es un respaldo válido.'); }
        };
        fr.readAsText(file);
      };
      const br = document.getElementById('a-reset');
      if(br) br.onclick = () => {
        const b = br;
        if(b.dataset.ok !== '1'){ b.dataset.ok = '1'; b.textContent = 'Tocá de nuevo para confirmar'; return; }
        DB = {insumos:[], productos:[], ventas:[], gastos:[], compras:[], produccion:[], encargos:[], agenda:[],
              cfg:{margenObj:DB.cfg.margenObj, ultimoRespaldo:DB.cfg.ultimoRespaldo, demo:false}};
        guardar(); cerrar(); ir('hoy'); toast('Listo, app vacía.');
      };
    });
}
</script>

<script>
/* ============ VISTAS ============ */
const aviso = () => DB.cfg.demo ? `<div class="warnbox">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16.5v.01"/></svg>
  <div><b>Datos de ejemplo.</b> Los modelos y precios son reales; costos, stock, ventas y gastos están inventados.
  Cuando tengas los números de Laura, vaciá todo desde el engranaje de arriba.</div></div>` : '';

const thumb = (src, alt) => src
  ? `<img class="row-th" src="${src}" alt="${esc(alt)}">`
  : `<div class="row-ph">${ICO.foto}</div>`;

/* ---- almanaque ---- */
let calMes = new Date().getMonth(), calAnio = new Date().getFullYear(), diaSel = hoyISO();
const DOW = ['L','M','M','J','V','S','D'];
function almanaque(){
  const prim = new Date(calAnio, calMes, 1);
  const corr = (prim.getDay() + 6) % 7;            // lunes primero
  const largo = new Date(calAnio, calMes + 1, 0).getDate();
  const largoPrev = new Date(calAnio, calMes, 0).getDate();
  const marcas = diasConAlgo(calAnio, calMes);
  const iso = d => `${calAnio}-${String(calMes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
  let celdas = '';
  for(let i = 0; i < corr; i++)
    celdas += `<button class="cal-d out" disabled>${largoPrev - corr + i + 1}</button>`;
  for(let d = 1; d <= largo; d++){
    const f = iso(d), mk = marcas[d];
    celdas += `<button class="cal-d${f === hoyISO() ? ' hoy' : ''}" data-dia="${f}"
      aria-pressed="${f === diaSel}" aria-label="${d}">${d}
      ${mk ? `<span class="cal-pt ${mk}"></span>` : ''}</button>`;
  }
  const resto = (7 - ((corr + largo) % 7)) % 7;
  for(let i = 1; i <= resto; i++) celdas += `<button class="cal-d out" disabled>${i}</button>`;
  return `<div class="cal">
    <div class="cal-h"><div class="cal-m">${MESN[calMes]} ${calAnio}</div>
      <div class="cal-nav">
        <button data-mes="-1" aria-label="Mes anterior"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button data-mes="0" aria-label="Hoy"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.4"/></svg></button>
        <button data-mes="1" aria-label="Mes siguiente"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l6-6-6-6"/></svg></button>
      </div></div>
    <div class="cal-g">${DOW.map(d => `<div class="cal-dow">${d}</div>`).join('')}${celdas}</div>
  </div>`;
}
function filaEvento(ev){
  const T = TIPOS[ev.tipo] || TIPOS.tarea;
  const acc = ev.respaldo ? 'data-act="respaldo"'
            : ev.irA ? `data-go="${ev.irA}"`
            : ev.encargo ? `data-ed="encargo:${ev.encargo}"`
            : `data-ed="agendaEv:${ev.id}"`;
  return `<div class="ev">
    <div class="ev-i ${ev.tipo}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${T.ico}</svg></div>
    <button class="ev-b" style="background:none;border:0;padding:0;font-family:inherit;color:inherit;text-align:left;cursor:pointer" ${acc}>
      <div class="ev-t${ev.hecho ? ' done' : ''}">${esc(ev.titulo)}</div>
      ${ev.nota ? `<div class="ev-s">${esc(ev.nota)}</div>` : ''}
      ${ev.repetir ? `<div class="ev-s">Se repite ${ev.repetir === 'semanal' ? 'cada semana' : 'cada mes'}</div>` : ''}
    </button>
    ${ev.hora ? `<div class="ev-h">${esc(ev.hora)}</div>` : ''}
    ${ev.propio ? `<button class="tick${ev.hecho ? ' on' : ''}" data-tick="${ev.id}" aria-label="Marcar hecho">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l5 5L20 6"/></svg></button>` : ''}
  </div>`;
}
function vHoy(){
  const m = balance(mesHoy()), c = capital();
  const evs = eventosDe(diaSel);
  const esHoy = diaSel === hoyISO();
  const titulo = esHoy ? 'Hoy' : `${+diaSel.slice(8,10)} de ${MESN[+diaSel.slice(5,7)-1].toLowerCase()}`;
  const prox = DB.encargos.filter(e => e.estado === 'pendiente' && e.entrega > diaSel)
    .sort((a,b) => a.entrega.localeCompare(b.entrega)).slice(0,2);
  return aviso() + almanaque() + `
  <section class="blk">
    <div class="blk-h"><div class="blk-t">${esc(titulo)}${(() => {
        const n = evs.filter(e => !e.hecho).length;
        return n ? ` · ${n} pendiente${n > 1 ? 's' : ''}` : '';
      })()}</div>
      <button class="blk-a" data-ed="agenda:${diaSel}">+ Agendar</button></div>
    <div class="card">${evs.length ? evs.map(filaEvento).join('')
      : `<div class="empty">Nada anotado para este día.<br>Tocá <b>+ Agendar</b> para sumar una tarea o reunión.</div>`}</div>
  </section>

  ${prox.length ? `<section class="blk">
    <div class="blk-h"><div class="blk-t">Próximas entregas</div>
      <button class="blk-a" data-go="plata:encargos">Ver todas</button></div>
    <div class="card">${prox.map(e => {
      const p = prod(e.prod);
      return `<button class="row" data-ed="encargo:${e.id}">${thumb(p && p.img, p ? p.n : '')}
        <div class="row-b"><div class="row-n">${esc(e.cliente)}</div>
          <div class="row-s">${esc(p ? p.n : '—')} · ${dm(e.entrega)}</div></div>
        <div class="row-r"><div class="row-v">${fmt(e.precio - e.sena)}</div>
          <div class="row-v2">a cobrar</div></div></button>`;}).join('')}</div>
  </section>` : ''}

  <section class="blk">
    <div class="blk-t">${MESN[new Date().getMonth()]} hasta hoy</div>
    <div class="hero">
      <div class="hero-lab">Te quedó</div>
      <div class="hero-n${m.neto < 0 ? ' neg' : ''}" style="font-size:2.25rem">${fmt(m.neto)}</div>
      <div class="hero-sub">${fmt(m.vendido)} vendidos · ${fmt(m.costo)} de materiales y mano de obra · ${fmt(m.gastos)} de gastos</div>
      <div class="hero-foot">
        <div><div class="ff-l">Margen bruto</div><div class="ff-v">${pct(m.margenBruto)}</div></div>
        <div><div class="ff-l">Piezas</div><div class="ff-v">${m.piezas}</div></div>
        <div><div class="ff-l">En stock</div><div class="ff-v">${fmt(c.term + c.mat)}</div></div>
      </div>
    </div>
  </section>`;
}

function filaVenta(v){
  const p = prod(v.prod), n = +v.cant || 1;
  const g = p ? (v.precio - costoTotal(p)) * n : 0;
  return `<button class="row" data-ed="venta:${v.id}">${thumb(p && p.img, p ? p.n : '')}
    <div class="row-b"><div class="row-n">${esc(p ? p.n : 'Modelo borrado')}${n > 1 ? ` ×${n}` : ''}</div>
      <div class="row-s">${dm(v.fecha)} · ${esc(v.canal)}</div></div>
    <div class="row-r"><div class="row-v">${fmt(v.precio * n)}</div>
      <div class="row-v2 ${g >= 0 ? 'pos' : 'neg'}">${g >= 0 ? '+' : ''}${fmt(g)}</div></div></button>`;
}

function vProductos(){
  if(!DB.productos.length) return aviso() +
    '<div class="card empty">Todavía no hay modelos.<br>Tocá el + para cargar el primero.</div>';
  return aviso() + `<section class="blk">
    <div class="blk-h"><div class="blk-t">${DB.productos.length} modelos</div>
      <div class="blk-t" style="letter-spacing:.03em;text-transform:none">Tocá uno para ver su costo</div></div>
    <div class="grid">${DB.productos.map(p => {
      const mg = margenPct(p), cl = mg >= 45 ? 'ok' : mg >= 33 ? 'mut' : 'warn';
      return `<button class="prod" data-go="ficha:${p.id}">
        ${p.img ? `<img class="prod-img" src="${p.img}" alt="${esc(p.n)}">`
                : `<div class="prod-ph">${ICO.fotoG}</div>`}
        <div class="prod-b"><div class="prod-n">${esc(p.n)}</div>
          <div class="prod-r"><span class="prod-st">${p.stock} en stock</span>
            <span class="pill ${cl}">${pct(mg)}</span></div></div></button>`;}).join('')}</div>
  </section>`;
}

function vFicha(id){
  const p = prod(id);
  if(!p) return '<div class="card empty">Ese modelo ya no existe.</div>';
  const mat = costoMat(p), tot = costoTotal(p), gan = p.precio - tot, sug = sugerido(p);
  const dif = sug - p.precio;
  return `<button class="backlink" data-go="productos">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>Productos</button>

  <div class="fhead">
    ${p.img ? `<img src="${p.img}" alt="${esc(p.n)}">` : `<div class="ph">${ICO.fotoG}</div>`}
    <div style="flex:1;min-width:0"><div class="fh-n">${esc(p.n)}</div>
      <div class="fh-m">${esc(p.med || '')}</div>
      <div class="fh-m" style="margin-top:6px">${p.stock} en stock</div></div></div>

  <div class="split">
    <div><div class="sp-l">Cuesta</div><div class="sp-v">${fmt(tot)}</div></div>
    <div><div class="sp-l">Se vende</div><div class="sp-v">${fmt(p.precio)}</div></div>
  </div>

  <div class="hero" style="padding:14px 16px">
    <div class="hero-lab">Deja de ganancia</div>
    <div class="hero-n${gan < 0 ? ' neg' : ''}" style="font-size:2.125rem">${fmt(gan)}</div>
    <div class="hero-sub">${pct(margenPct(p))} del precio de venta</div>
  </div>

  ${sug ? `<div class="card" style="padding:12px 14px">
    <div class="hint">Para ganar <b>${DB.cfg.margenObj}%</b> tendría que venderse a <b>${fmt(sug)}</b>.
    ${Math.abs(dif) < 1 ? '' : dif > 0
      ? ` Hoy está <b>${fmt(dif)}</b> por debajo.`
      : ` Hoy está <b>${fmt(-dif)}</b> por encima, así que vas holgada.`}</div></div>` : ''}

  <section class="blk">
    <div class="blk-t">Qué lleva cada pieza</div>
    <div class="card" style="padding:13px 14px">
      <table class="rec"><thead><tr><th>Insumo</th><th>Costo</th></tr></thead><tbody>
      ${(p.rec || []).length ? p.rec.map(r => {
        const I = ins(r.i), L = lineaCosto(r);
        return `<tr><td><div>${esc(I ? I.n : 'Insumo borrado')}</div><div class="q">${esc(L.txt)}</div></td>
          <td class="v">${fmt(L.costo)}</td></tr>`;}).join('')
        : '<tr><td colspan="2" style="color:var(--ink3)">Sin insumos cargados.</td></tr>'}
      <tr><td><div>Mano de obra</div><div class="q">confección de la pieza</div></td>
        <td class="v">${fmt(p.mo)}</td></tr></tbody>
      <tfoot><tr><td>Costo total</td><td class="v">${fmt(tot)}</td></tr></tfoot></table>
      <div class="hint" style="margin-top:10px;color:var(--ink3);font-size:0.75rem">
        Materiales ${fmt(mat)} + mano de obra ${fmt(p.mo)}</div>
    </div>
  </section>

  <div class="btnrow">
    <button class="btn ghost" data-ed="producir:${p.id}">Armé unas</button>
    <button class="btn ghost" data-ed="ventaDe:${p.id}">Vendí una</button>
  </div>
  <button class="btn" data-ed="producto:${p.id}">Editar modelo</button>`;
}

function vInsumos(){
  const c = capital();
  const orden = DB.insumos.slice().sort((a,b) => (a.stock/(a.min||1)) - (b.stock/(b.min||1)));
  return aviso() + `
  <div class="split">
    <div><div class="sp-l">En insumos</div><div class="sp-v">${fmt(c.mat)}</div></div>
    <div><div class="sp-l">En terminados</div><div class="sp-v">${fmt(c.term)}</div></div>
  </div>
  <button class="btn ghost" data-ed="compra:">Cargar una compra</button>
  <section class="blk">
    <div class="blk-h"><div class="blk-t">Stock de insumos</div>
      <div class="blk-t" style="letter-spacing:.03em;text-transform:none">Tocá para editar</div></div>
    <div class="card">${orden.length ? orden.map(I => {
      const nv = nivel(I), w = I.min ? Math.min(100, I.stock / (I.min * 2) * 100) : 100;
      return `<button class="row" data-ed="insumo:${I.id}">${thumb(I.img, I.n)}
        <div class="row-b"><div class="row-n">${esc(I.n)}</div>
          <div class="row-s">${fmt(I.costo)} por ${esc(I.u)}${I.prov ? ' · ' + esc(I.prov) : ''}</div>
          <div class="bar"><i style="width:${w}%;background:var(--${nv})"></i></div></div>
        <div class="row-r"><div class="row-v">${nf(I.stock)}</div>
          <div class="row-v2">mín. ${nf(I.min)}</div></div></button>`;}).join('')
      : '<div class="empty">Todavía no hay insumos.<br>Tocá el + para cargar el primero.</div>'}</div>
  </section>`;
}

let subPlata = 'ventas';
function vPlata(){
  const m = balance(mesHoy());
  const seg = `<div class="seg" role="tablist">
    ${[['ventas','Ventas'],['gastos','Gastos'],['encargos','Encargos']].map(([k,l]) =>
      `<button role="tab" data-sub="${k}" aria-selected="${subPlata === k}">${l}</button>`).join('')}</div>`;

  if(subPlata === 'ventas'){
    const vs = DB.ventas.slice().sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
    const canales = {};
    DB.ventas.filter(v => mesDe(v.fecha) === mesHoy())
      .forEach(v => { canales[v.canal] = (canales[v.canal] || 0) + v.precio * (+v.cant || 1); });
    return seg + `
    <div class="split">
      <div><div class="sp-l">Vendido este mes</div><div class="sp-v">${fmt(m.vendido)}</div></div>
      <div><div class="sp-l">Ganancia bruta</div><div class="sp-v pos">${fmt(m.bruta)}</div></div>
    </div>
    ${Object.keys(canales).length ? `<section class="blk"><div class="blk-t">Por canal</div>
      <div class="card">${Object.entries(canales).sort((a,b) => b[1]-a[1]).map(([c,v]) =>
        `<div class="row" style="cursor:default"><div class="row-b"><div class="row-n">${esc(c)}</div>
          <div class="bar"><i style="width:${v/m.vendido*100}%;background:var(--acc)"></i></div></div>
          <div class="row-r"><div class="row-v">${fmt(v)}</div>
            <div class="row-v2">${Math.round(v/m.vendido*100)}%</div></div></div>`).join('')}</div></section>` : ''}
    <section class="blk"><div class="blk-t">Todas las ventas</div>
      <div class="card">${vs.length ? vs.map(v => filaVenta(v)).join('')
        : '<div class="empty">Sin ventas. Tocá el + para cargar una.</div>'}</div></section>`;
  }

  if(subPlata === 'gastos'){
    const gs = DB.gastos.slice().sort((a,b) => (b.fecha||'').localeCompare(a.fecha||''));
    const rub = {};
    DB.gastos.filter(g => mesDe(g.fecha) === mesHoy())
      .forEach(g => { rub[g.rubro] = (rub[g.rubro] || 0) + (+g.importe || 0); });
    const maxR = Math.max(1, ...Object.values(rub));
    return seg + `
    <div class="split">
      <div><div class="sp-l">Gastos del mes</div><div class="sp-v">${fmt(m.gastos)}</div></div>
      <div><div class="sp-l">Sobre lo vendido</div><div class="sp-v">${pct(m.vendido ? m.gastos/m.vendido*100 : 0)}</div></div>
    </div>
    ${Object.keys(rub).length ? `<section class="blk"><div class="blk-t">En qué se va</div>
      <div class="card">${Object.entries(rub).sort((a,b) => b[1]-a[1]).map(([r,v]) =>
        `<div class="row" style="cursor:default"><div class="row-b"><div class="row-n">${esc(r)}</div>
          <div class="bar"><i style="width:${v/maxR*100}%;background:var(--warn)"></i></div></div>
          <div class="row-r"><div class="row-v">${fmt(v)}</div></div></div>`).join('')}</div></section>` : ''}
    <section class="blk"><div class="blk-t">Todos los gastos</div>
      <div class="card">${gs.length ? gs.map(g =>
        `<button class="row" data-ed="gasto:${g.id}">
          <div class="row-b"><div class="row-n">${esc(g.rubro)}</div>
            <div class="row-s">${dm(g.fecha)}${g.detalle ? ' · ' + esc(g.detalle) : ''}</div></div>
          <div class="row-r"><div class="row-v">${fmt(g.importe)}</div></div></button>`).join('')
        : '<div class="empty">Sin gastos cargados. Tocá el + para agregar uno.</div>'}</div></section>`;
  }

  const pend = DB.encargos.filter(e => e.estado === 'pendiente')
    .sort((a,b) => (a.entrega||'').localeCompare(b.entrega||''));
  const list = DB.encargos.filter(e => e.estado !== 'pendiente')
    .sort((a,b) => (b.entrega||'').localeCompare(a.entrega||''));
  const aCobrar = pend.reduce((s,e) => s + (e.precio - e.sena), 0);
  const senas = pend.reduce((s,e) => s + (+e.sena || 0), 0);
  const fila = e => {
    const p = prod(e.prod), tarde = e.estado === 'pendiente' && e.entrega < hoyISO();
    return `<button class="row" data-ed="encargo:${e.id}">${thumb(p && p.img, p ? p.n : '')}
      <div class="row-b"><div class="row-n">${esc(e.cliente)}</div>
        <div class="row-s">${esc(p ? p.n : '—')} · ${e.estado === 'pendiente' ? 'entrega ' + dm(e.entrega) : 'entregado'}</div></div>
      <div class="row-r"><div class="row-v">${fmt(e.precio - e.sena)}</div>
        <div class="row-v2">${tarde ? '<span style="color:var(--crit)">atrasado</span>'
          : e.estado === 'pendiente' ? 'seña ' + fmt(e.sena) : 'cobrado'}</div></div></button>`;
  };
  return seg + `
  <div class="split">
    <div><div class="sp-l">A cobrar</div><div class="sp-v">${fmt(aCobrar)}</div></div>
    <div><div class="sp-l">Señas cobradas</div><div class="sp-v">${fmt(senas)}</div></div>
  </div>
  <section class="blk"><div class="blk-t">Pendientes</div>
    <div class="card">${pend.length ? pend.map(fila).join('')
      : '<div class="empty">Sin encargos pendientes.</div>'}</div></section>
  ${list.length ? `<section class="blk"><div class="blk-t">Entregados</div>
    <div class="card">${list.map(fila).join('')}</div></section>` : ''}`;
}

function vNumeros(){
  const meses = mesesConDatos().slice(-6);
  const serie = meses.map(mm => ({m:mm, ...balance(mm)}));
  const vendidoTot = serie.reduce((s,x) => s + x.vendido, 0);
  const netoTot = serie.reduce((s,x) => s + x.neto, 0);
  const vals = serie.map(s => s.margenNeto);
  const lo = Math.min(0, Math.floor(Math.min(...vals, 0) / 10) * 10);
  const hi = Math.max(10, Math.ceil(Math.max(...vals, 10) / 10) * 10);
  const X0 = 36, X1 = 322, Y0 = 122, Y1 = 16;
  const px = i => serie.length > 1 ? X0 + i * (X1 - X0) / (serie.length - 1) : (X0 + X1) / 2;
  const py = v => Y0 - (v - lo) / (hi - lo) * (Y0 - Y1);
  const pts = serie.map((s,i) => [px(i), py(s.margenNeto)]);
  const linea = pts.map((p,i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = serie.length - 1;
  const ticks = [lo, Math.round((lo + hi) / 2), hi];

  const rank = DB.productos.map(p => ({p, mg:margenPct(p), gan:p.precio - costoTotal(p)}))
    .sort((a,b) => b.gan - a.gan);
  const maxG = Math.max(1, ...rank.map(r => r.gan));

  return aviso() + `
  <div class="split">
    <div><div class="sp-l">Vendido</div><div class="sp-v">${fmt(vendidoTot)}</div></div>
    <div><div class="sp-l">Te quedó</div><div class="sp-v ${netoTot >= 0 ? 'pos' : 'neg'}">${fmt(netoTot)}</div></div>
  </div>

  <div class="card chart">
    <div class="chart-t">Lo que queda, mes a mes</div>
    <div class="chart-s">Después de materiales, mano de obra y gastos</div>
    ${serie.length > 1 ? `
    <svg viewBox="0 0 340 152" width="100%" style="max-width:100%;display:block;margin-top:11px" role="img"
         aria-label="Margen neto por mes">
      ${ticks.map(t => `<line x1="${X0}" y1="${py(t)}" x2="${X1}" y2="${py(t)}"
          stroke="var(--line)" stroke-width="1"/>
        <text x="${X0-7}" y="${py(t)+3.5}" text-anchor="end" font-size="10" fill="var(--ink3)">${t}%</text>`).join('')}
      <path d="${linea} L${px(last)} ${py(lo)} L${X0} ${py(lo)} Z" fill="var(--acc)" opacity=".13"/>
      <path d="${linea}" fill="none" stroke="var(--acc)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
      ${pts.map((pt,i) => `<circle cx="${pt[0].toFixed(1)}" cy="${pt[1].toFixed(1)}" r="${i===last?4.5:3.4}"
        fill="${i===last?'var(--acc-ink)':'var(--acc)'}" stroke="var(--surf)" stroke-width="2">
        <title>${esc(nombreMes(serie[i].m))}: ${pct(serie[i].margenNeto)} · ${fmt(serie[i].neto)}</title></circle>`).join('')}
      <text x="${pts[last][0].toFixed(1)}" y="${(pts[last][1]-9).toFixed(1)}" text-anchor="${last === serie.length-1 ? 'end' : 'middle'}"
        font-size="12" font-weight="600" fill="var(--ink)">${pct(serie[last].margenNeto)}</text>
      ${serie.map((s,i) => `<text x="${px(i).toFixed(1)}" y="143" text-anchor="middle" font-size="10.5"
        fill="${i===last?'var(--acc-ink)':'var(--ink3)'}" font-weight="600">${esc(MESN[+s.m.slice(5,7)-1].slice(0,3).toUpperCase())}</text>`).join('')}
    </svg>`
    : `<div class="empty" style="padding:18px 0">Con un mes solo todavía no hay tendencia.<br>
        Este mes te quedó <b style="color:var(--ink)">${fmt(serie[0] ? serie[0].neto : 0)}</b>.</div>`}
  </div>

  <section class="blk">
    <div class="blk-h"><div class="blk-t">Qué modelo deja más</div>
      <div class="blk-t" style="letter-spacing:.03em;text-transform:none">Ganancia por pieza</div></div>
    <div class="card">${rank.length ? rank.map(r => `
      <button class="row" data-go="ficha:${r.p.id}">${thumb(r.p.img, r.p.n)}
        <div class="row-b"><div class="row-n">${esc(r.p.n)}</div>
          <div class="bar"><i style="width:${Math.max(0, r.gan/maxG*100)}%;background:var(--acc)"></i></div></div>
        <div class="row-r"><div class="row-v">${fmt(r.gan)}</div>
          <div class="row-v2">${pct(r.mg)}</div></div></button>`).join('')
      : '<div class="empty">Sin modelos cargados.</div>'}</div>
  </section>`;
}

/* ============ ROUTER ============ */
const TABS = [
  {id:'hoy', t:'Agenda', s:fraseDelDia, frase:true, lab:'Agenda',
   ic:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
  {id:'productos', t:'Productos', s:() => DB.productos.length + ' modelos', lab:'Productos',
   ic:'<path d="M6 8h12l1 12H5L6 8z"/><path d="M9 8V6a3 3 0 016 0v2"/>'},
  {id:'insumos', t:'Insumos', s:() => 'Cueros, herrajes e hilos', lab:'Insumos',
   ic:'<path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 12l9 4 9-4"/><path d="M3 17l9 4 9-4"/>'},
  {id:'plata', t:'Plata', s:() => 'Ventas, gastos y encargos', lab:'Plata',
   ic:'<path d="M3 3v18h18"/><path d="M7 15l4-5 3 3 5-7"/>'},
  {id:'numeros', t:'Números', s:() => 'Mes a mes', lab:'Números',
   ic:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 17V9M12 17V6M16 17v-5"/>'},
];
let vista = 'hoy';

document.getElementById('nav').innerHTML = TABS.map(t =>
  `<button class="tab" role="tab" data-go="${t.id}" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${t.ic}</svg>
    <span>${t.lab}</span></button>`).join('');

function ir(v){ vista = v; render(); window.scrollTo(0,0); }

function render(){
  const esFicha = vista.startsWith('ficha:');
  const base = esFicha ? 'productos' : vista.split(':')[0];
  if(vista.startsWith('plata:')){ subPlata = vista.split(':')[1]; vista = 'plata'; }
  const T = TABS.find(t => t.id === base) || TABS[0];

  if(esFicha){
    const p = prod(vista.slice(6));
    document.getElementById('ttl').textContent = 'Ficha de costo';
    document.getElementById('sub').textContent = p ? p.n : '';
    document.getElementById('sub').classList.remove('frase');
    M.innerHTML = vFicha(vista.slice(6));
  } else {
    document.getElementById('ttl').textContent = T.t;
    document.getElementById('sub').textContent = T.s();
    document.getElementById('sub').classList.toggle('frase', !!T.frase);
    M.innerHTML = {hoy:vHoy, productos:vProductos, insumos:vInsumos, plata:vPlata, numeros:vNumeros}[base]();
  }
  document.querySelectorAll('.tab').forEach(b =>
    b.setAttribute('aria-selected', b.dataset.go === base ? 'true' : 'false'));

  const fab = document.getElementById('fab');
  fab.hidden = esFicha;
  fab.setAttribute('aria-label', {hoy:'Agendar', productos:'Nuevo modelo', insumos:'Nuevo insumo',
    plata:'Agregar', numeros:'Cargar venta'}[base] || 'Agregar');
  syncLogo();
}

const ACC = {
  insumo:   id => edInsumo(id || null),
  producto: id => edProducto(id || null),
  gasto:    id => edGasto(id || null),
  venta:    id => edVenta(id || null),
  ventaDe:  id => edVenta(null, id),
  encargo:  id => edEncargo(id || null),
  compra:   id => edCompra(id || null),
  producir: id => edProducir(id || null),
  agenda:   f  => edAgenda(null, f || diaSel),
  agendaEv: id => edAgenda(id),
};

document.addEventListener('click', e => {
  const ed = e.target.closest('[data-ed]');
  if(ed){
    const i = ed.dataset.ed.indexOf(':');
    const k = ed.dataset.ed.slice(0, i), id = ed.dataset.ed.slice(i + 1);
    if(ACC[k]) ACC[k](id);
    return;
  }
  const act = e.target.closest('[data-act]');
  if(act && act.dataset.act === 'respaldo'){ mandarRespaldo(); return; }

  const tk = e.target.closest('[data-tick]');
  if(tk){
    const ev = DB.agenda.find(x => x.id === tk.dataset.tick);
    if(ev){
      if(ev.repetir){
        if(!Array.isArray(ev.hechos)) ev.hechos = [];
        const i = ev.hechos.indexOf(diaSel);
        if(i >= 0) ev.hechos.splice(i, 1); else ev.hechos.push(diaSel);
      } else ev.hecho = !ev.hecho;
      guardar(); render();
    }
    return;
  }
  const dia = e.target.closest('[data-dia]');
  if(dia){ diaSel = dia.dataset.dia; render(); return; }
  const mn = e.target.closest('[data-mes]');
  if(mn){
    const paso = +mn.dataset.mes;
    if(paso === 0){ const h = new Date(); calMes = h.getMonth(); calAnio = h.getFullYear(); diaSel = hoyISO(); }
    else {
      calMes += paso;
      if(calMes < 0){ calMes = 11; calAnio--; }
      if(calMes > 11){ calMes = 0; calAnio++; }
    }
    render(); return;
  }
  const go = e.target.closest('[data-go]');
  if(go){ ir(go.dataset.go); return; }
  const sub = e.target.closest('[data-sub]');
  if(sub){ subPlata = sub.dataset.sub; render(); }
});

document.getElementById('fab').addEventListener('click', () => {
  if(vista === 'hoy')       return edAgenda(null, diaSel);
  if(vista === 'productos') return edProducto(null);
  if(vista === 'insumos')   return edInsumo(null);
  if(vista === 'plata'){
    if(subPlata === 'gastos')   return edGasto(null);
    if(subPlata === 'encargos') return edEncargo(null);
    return edVenta(null);
  }
  edVenta(null);
});
document.getElementById('btn-cfg').addEventListener('click', edAjustes);

aplicarEscala();
render();
</script>

<script>
/* ===================== RESPALDO EN LA NUBE =====================
   Firestore del proyecto la-barbara-taller. El respaldo se parte en
   pedazos porque un documento no puede pasar de 1 MB.
   Nada de esto es obligatorio: si no hay internet o no carga, la app
   sigue andando igual con los datos del teléfono.                     */

const FB_CFG = {
  apiKey: "AIzaSyAC0vQyPQ-i2Cm6qh9DiB3H7waDuy3Iewo",
  authDomain: "la-barbara-taller.firebaseapp.com",
  projectId: "la-barbara-taller",
  storageBucket: "la-barbara-taller.firebasestorage.app",
  messagingSenderId: "574091048228",
  appId: "1:574091048228:web:a1dbe65ea46fb4728d6fb1"
};
const FB_VER = '10.14.1';
const FB_URL = n => `https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/firebase-${n}-compat.js`;
const TROZO = 600000;                  // caracteres por pedazo
const K_USER = 'taller_lb_user', K_PASS = 'taller_lb_pass';

const NUBE = {
  sdk:null, estado:'off', detalle:'', ultima:'', subiendo:false, pendiente:false, timer:null
};
/* off · sin-clave · conectando · listo · subiendo · error · sin-red */

const cred = () => {
  try { return {u: localStorage.getItem(K_USER) || '', p: localStorage.getItem(K_PASS) || ''}; }
  catch(e){ return {u:'', p:''}; }
};
function guardarCred(u, p){
  try { localStorage.setItem(K_USER, u); localStorage.setItem(K_PASS, p); } catch(e){}
}
function borrarCred(){
  try { localStorage.removeItem(K_USER); localStorage.removeItem(K_PASS); } catch(e){}
  NUBE.estado = 'sin-clave'; NUBE.detalle = ''; pintarNube();
}

function cargarScript(src){
  return new Promise((ok, mal) => {
    const s = document.createElement('script');
    s.src = src; s.async = true;
    s.onload = ok;
    s.onerror = () => mal(new Error('no cargó ' + src));
    document.head.appendChild(s);
  });
}

async function nubeIniciar(){
  const c = cred();
  if(!c.u || !c.p){ NUBE.estado = 'sin-clave'; pintarNube(); return null; }
  if(NUBE.sdk) return NUBE.sdk;
  NUBE.estado = 'conectando'; NUBE.detalle = ''; pintarNube();
  try{
    if(!window.firebase){
      await cargarScript(FB_URL('app'));
      await Promise.all([cargarScript(FB_URL('auth')), cargarScript(FB_URL('firestore'))]);
    }
    const app = firebase.apps && firebase.apps.length
      ? firebase.app() : firebase.initializeApp(FB_CFG);
    await firebase.auth().signInWithEmailAndPassword(c.u, c.p);
    NUBE.sdk = {db: firebase.firestore()};
    NUBE.estado = 'listo'; NUBE.detalle = '';
    await nubeLeerMeta();
    pintarNube();
    return NUBE.sdk;
  }catch(err){
    NUBE.sdk = null;
    const cod = (err && err.code) || '';
    NUBE.estado = 'error';
    NUBE.detalle =
      cod === 'auth/invalid-credential' || cod === 'auth/wrong-password' || cod === 'auth/user-not-found'
        ? 'El usuario o la contraseña no son correctos.'
      : cod === 'auth/network-request-failed' || /no cargó/.test(err.message || '')
        ? 'Sin internet. Se va a reintentar solo.'
      : cod === 'auth/too-many-requests'
        ? 'Demasiados intentos. Esperá un rato.'
      : (err && err.message) || 'No se pudo conectar.';
    if(NUBE.detalle.startsWith('Sin internet')) NUBE.estado = 'sin-red';
    pintarNube();
    return null;
  }
}

/* cuántos registros tiene un respaldo, para no pisar uno lleno con uno vacío */
const cuenta = o => TABLAS.reduce((s,k) => s + ((o && o[k] && o[k].length) || 0), 0);

async function nubeLeerMeta(){
  try{
    const d = await NUBE.sdk.db.collection('respaldo').doc('meta').get();
    if(d.exists){
      const m = d.data();
      NUBE.ultima = (m.fecha || '') + (m.hora ? ' ' + m.hora : '');
      NUBE.cuenta = typeof m.cuenta === 'number' ? m.cuenta : null;
    } else { NUBE.ultima = ''; NUBE.cuenta = null; }
  }catch(e){ NUBE.ultima = ''; NUBE.cuenta = null; }
}

/* ---- subir ---- */
async function nubeSubir(silencioso){
  const sdk = NUBE.sdk || await nubeIniciar();
  if(!sdk) return false;
  if(NUBE.subiendo){ NUBE.pendiente = true; return false; }

  /* red de seguridad: si acá hay MUCHO menos que en la nube, no pisar sin permiso */
  const aca = cuenta(DB);
  if(!NUBE.forzar && typeof NUBE.cuenta === 'number' && NUBE.cuenta > 0 &&
     (aca === 0 || aca < NUBE.cuenta * 0.5)){
    NUBE.estado = 'frenado';
    NUBE.detalle = `Acá hay ${aca} cosas cargadas y en la nube hay ${NUBE.cuenta}. ` +
                   `No se subió para no borrar lo de allá.`;
    pintarNube();
    return false;
  }

  NUBE.subiendo = true; NUBE.estado = 'subiendo'; pintarNube();
  try{
    const txt = JSON.stringify(DB);
    const partes = [];
    for(let i = 0; i < txt.length; i += TROZO) partes.push(txt.slice(i, i + TROZO));
    const ahora = new Date();
    const col = sdk.db.collection('respaldo');
    const lote = sdk.db.batch();
    partes.forEach((t, i) => lote.set(col.doc('p' + i), {i, t}));
    lote.set(col.doc('meta'), {
      partes: partes.length, bytes: txt.length, v: ESQUEMA, cuenta: cuenta(DB),
      fecha: ahora.toISOString().slice(0,10),
      hora: String(ahora.getHours()).padStart(2,'0') + ':' + String(ahora.getMinutes()).padStart(2,'0'),
      ts: Date.now()
    });
    await lote.commit();
    /* si antes había más pedazos, los de sobra se borran */
    const viejas = await col.get();
    const sobran = viejas.docs.filter(d => d.id !== 'meta' && +d.id.slice(1) >= partes.length);
    if(sobran.length){
      const l2 = sdk.db.batch();
      sobran.forEach(d => l2.delete(d.ref));
      await l2.commit();
    }
    NUBE.ultima = ahora.toISOString().slice(0,10) + ' ' +
      String(ahora.getHours()).padStart(2,'0') + ':' + String(ahora.getMinutes()).padStart(2,'0');
    NUBE.estado = 'listo'; NUBE.detalle = ''; NUBE.forzar = false;
    NUBE.cuenta = cuenta(DB);
    DB.cfg.ultimoRespaldo = hoyISO();
    try{ localStorage.setItem(KEY, JSON.stringify(DB)); }catch(e){}
    if(!silencioso) toast('Respaldo guardado en la nube.');
    return true;
  }catch(err){
    NUBE.estado = 'error';
    NUBE.detalle = (err && err.code === 'permission-denied')
      ? 'La nube no acepta la escritura. Faltan pegar las reglas.'
      : 'No se pudo subir: ' + ((err && err.message) || 'error');
    if(!silencioso) toast(NUBE.detalle);
    return false;
  }finally{
    NUBE.subiendo = false; pintarNube();
    if(NUBE.pendiente){ NUBE.pendiente = false; nubeAgendar(); }
  }
}

/* espera a que deje de tocar y recién ahí sube, para no subir 20 veces seguidas */
function nubeAgendar(){
  if(NUBE.estado === 'sin-clave') return;
  clearTimeout(NUBE.timer);
  NUBE.timer = setTimeout(() => nubeSubir(true), 8000);
}

/* ---- bajar ---- */
async function nubeBajar(){
  const sdk = NUBE.sdk || await nubeIniciar();
  if(!sdk) return toast('No se pudo conectar con la nube.');
  try{
    const meta = await sdk.db.collection('respaldo').doc('meta').get();
    if(!meta.exists) return toast('Todavía no hay ningún respaldo en la nube.');
    const n = meta.data().partes || 0;
    const partes = [];
    for(let i = 0; i < n; i++){
      const d = await sdk.db.collection('respaldo').doc('p' + i).get();
      if(!d.exists) throw new Error('falta el pedazo ' + i);
      partes.push(d.data().t || '');
    }
    const o = JSON.parse(partes.join(''));
    if(!o || !Array.isArray(o.productos)) throw new Error('el respaldo está incompleto');
    const aca = cuenta(DB), alla = cuenta(o);
    if(aca > alla){
      const sigue = confirm(
        `Ojo: en este teléfono hay ${aca} cosas cargadas y la copia de la nube tiene ${alla}.\n\n` +
        `Si seguís, se reemplaza todo por la copia de la nube y se pierde lo que hay acá de más.\n\n` +
        `¿Seguir igual?`);
      if(!sigue) return toast('No se tocó nada.');
    }
    DB = o; migrar(); guardar();
    cerrar(); ir('hoy');
    toast('Listo, se trajo el respaldo del ' + (meta.data().fecha || '') + '.');
  }catch(err){
    toast('No se pudo traer: ' + ((err && err.message) || 'error'));
  }
}

/* ---- el estado que se ve en Ajustes ---- */
const NUBE_TXT = {
  off:       ['', ''],
  'sin-clave':['mut',  'Sin conectar'],
  conectando:['mut',  'Conectando…'],
  listo:     ['ok',   'Al día'],
  subiendo:  ['warn', 'Guardando…'],
  'sin-red': ['warn', 'Sin internet'],
  frenado:   ['warn', 'Frenado a propósito'],
  error:     ['crit', 'Con problema'],
};
function pintarNube(){
  const cont = document.getElementById('nube-est');
  if(!cont) return;
  const [cl, lab] = NUBE_TXT[NUBE.estado] || NUBE_TXT.off;
  const ult = NUBE.ultima ? `Última copia: ${dm(NUBE.ultima.slice(0,10))} ${NUBE.ultima.slice(11)}` : 'Todavía sin copia';
  cont.innerHTML = `<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px">
      <span class="pill ${cl}"><span class="dot"></span>${lab}</span></div>
    <div class="hint">${esc(ult)}${NUBE.detalle ? '<br><span style="color:var(--crit)">' + esc(NUBE.detalle) + '</span>' : ''}</div>
    ${NUBE.estado === 'frenado' ? '<button class="btn ghost" id="nube-forzar" style="margin-top:9px">Subir igual, sé lo que hago</button>' : ''}`;
  const bf = document.getElementById('nube-forzar');
  if(bf) bf.onclick = () => {
    if(bf.dataset.ok !== '1'){ bf.dataset.ok = '1'; bf.textContent = 'Tocá otra vez para confirmar'; return; }
    NUBE.forzar = true; nubeSubir(false);
  };
}

/* ---- conectar / desconectar desde Ajustes ---- */
function edNube(){
  const c = cred();
  abrir('Respaldo en la nube', `
    <div class="hintbox hint" style="margin-bottom:14px">Con esto el respaldo se guarda solo, sin que
      Laura tenga que acordarse. Se carga <b>una sola vez</b> en su teléfono.</div>
    <div class="field"><label for="n-u">Usuario</label>
      <input id="n-u" value="${esc(c.u || 'laura@labarbara.app')}" autocomplete="off"
        autocapitalize="off" spellcheck="false"></div>
    <div class="field"><label for="n-p">Contraseña</label>
      <input type="password" id="n-p" value="${esc(c.p)}" autocomplete="off"></div>
    <div class="hint" id="n-msg"></div>`,
    `<div class="btnrow">${c.u ? '<button class="btn danger" id="n-off">Desconectar</button>' : ''}
      <button class="btn" id="n-ok">Conectar</button></div>`,
    () => {
      document.getElementById('n-ok').onclick = async () => {
        const u = document.getElementById('n-u').value.trim();
        const p = document.getElementById('n-p').value;
        if(!u || !p) return toast('Poné el usuario y la contraseña.');
        document.getElementById('n-msg').textContent = 'Conectando…';
        guardarCred(u, p);
        NUBE.sdk = null;
        const sdk = await nubeIniciar();
        if(sdk){
          await nubeSubir(true);
          cerrar(); edAjustes(); toast('Conectado. El respaldo ahora se guarda solo.');
        } else {
          document.getElementById('n-msg').innerHTML =
            '<span style="color:var(--crit)">' + esc(NUBE.detalle || 'No se pudo conectar.') + '</span>';
        }
      };
      const bo = document.getElementById('n-off');
      if(bo) bo.onclick = () => { borrarCred(); NUBE.sdk = null; cerrar(); edAjustes(); toast('Desconectado.'); };
    });
}

/* cada vez que se guarda algo, se agenda la subida */
const _guardarLocal = guardar;
guardar = function(){
  _guardarLocal();
  nubeAgendar();
};

/* al abrir la app: conectar en segundo plano, sin trabar nada */
setTimeout(() => {
  const c = cred();
  if(c.u && c.p) nubeIniciar().then(sdk => { if(sdk) nubeAgendar(); });
  else { NUBE.estado = 'sin-clave'; pintarNube(); }
}, 1200);

/* si vuelve la señal, reintenta */
window.addEventListener('online', () => {
  if(NUBE.estado === 'sin-red' || NUBE.estado === 'error'){ NUBE.sdk = null; nubeIniciar(); }
});
</script>

<script>
/* ===================== PIN DE 4 NÚMEROS ===================== */
const K_PIN_OK = 'taller_lb_pin_ok';
const PIN_HORAS = 12;                    // vuelve a pedirlo después de este rato

const hayPin = () => !!(DB.cfg.pin && String(DB.cfg.pin).length === 4);
function pinVigente(){
  try{
    const t = +localStorage.getItem(K_PIN_OK) || 0;
    return Date.now() - t < PIN_HORAS * 3600 * 1000;
  }catch(e){ return false; }
}
const marcarPinOk = () => { try{ localStorage.setItem(K_PIN_OK, Date.now()); }catch(e){} };

function pantallaPin(modo, alSalir){
  /* modo: 'abrir' (entrar a la app) · 'nuevo' (poner uno) · 'sacar' (confirmar para quitarlo) */
  const cap = document.createElement('div');
  cap.className = 'pinwrap';
  let primero = '', paso = 1;
  const titulo = () => modo === 'abrir' ? 'Poné tu PIN'
                     : modo === 'sacar' ? 'Poné el PIN para sacarlo'
                     : paso === 1 ? 'Elegí un PIN de 4 números' : 'Repetilo para confirmar';
  const bajada = () => modo === 'abrir' ? 'Para entrar al taller'
                     : modo === 'sacar' ? 'Después la app se abre sin pedir nada'
                     : paso === 1 ? 'Te lo va a pedir al abrir, una vez por día' : '';
  cap.innerHTML = `
    <img class="pin-logo" src="${IMG.logo}" alt="La Bárbara">
    <div class="pin-t" id="pin-t"></div>
    <div class="pin-s" id="pin-s"></div>
    <div class="pin-dots" id="pin-d">${'<i></i>'.repeat(4)}</div>
    <div class="pin-err" id="pin-e"></div>
    <div class="pin-pad">
      ${[1,2,3,4,5,6,7,8,9].map(n => `<button data-n="${n}">${n}</button>`).join('')}
      <button data-x="c" class="chico">Borrar</button>
      <button data-n="0">0</button>
      <button data-x="s" class="chico" ${modo === 'abrir' ? 'hidden' : ''}>Cancelar</button>
    </div>`;
  document.body.appendChild(cap);
  document.documentElement.style.overflow = 'hidden';

  let buf = '';
  const dots = () => {
    cap.querySelectorAll('#pin-d i').forEach((d,i) => d.classList.toggle('on', i < buf.length));
    document.getElementById('pin-t').textContent = titulo();
    document.getElementById('pin-s').textContent = bajada();
  };
  const error = msg => {
    const e = document.getElementById('pin-e');
    e.textContent = msg; cap.classList.add('tiembla');
    setTimeout(() => cap.classList.remove('tiembla'), 420);
    buf = ''; dots();
    setTimeout(() => { if(e.textContent === msg) e.textContent = ''; }, 2600);
  };
  const salir = ok => {
    cap.remove();
    document.documentElement.style.overflow = '';
    if(alSalir) alSalir(ok);
  };
  const listo = () => {
    if(modo === 'abrir'){
      if(buf === String(DB.cfg.pin)){ marcarPinOk(); salir(true); }
      else error('Ese no es. Probá de nuevo.');
      return;
    }
    if(modo === 'sacar'){
      if(buf === String(DB.cfg.pin)){ salir(true); }
      else error('Ese no es.');
      return;
    }
    if(paso === 1){ primero = buf; paso = 2; buf = ''; dots(); return; }
    if(buf === primero){ DB.cfg.pin = buf; guardar(); marcarPinOk(); salir(true); }
    else { paso = 1; primero = ''; error('No coincidieron. Empezá de nuevo.'); }
  };
  cap.addEventListener('click', ev => {
    const b = ev.target.closest('button'); if(!b) return;
    if(b.dataset.x === 'c'){ buf = buf.slice(0,-1); dots(); return; }
    if(b.dataset.x === 's'){ salir(false); return; }
    if(buf.length >= 4) return;
    buf += b.dataset.n; dots();
    if(buf.length === 4) setTimeout(listo, 140);
  });
  dots();
}

function edPin(){
  if(hayPin()){
    pantallaPin('sacar', ok => {
      if(!ok) return edAjustes();
      abrir('PIN', `<div class="hint" style="margin-bottom:14px">Ya está, el PIN es correcto. ¿Qué querés hacer?</div>`,
        `<div class="btnrow">
           <button class="btn danger" id="p-off">Sacar el PIN</button>
           <button class="btn" id="p-new">Cambiarlo</button></div>`,
        () => {
          document.getElementById('p-off').onclick = () => {
            DB.cfg.pin = ''; guardar(); cerrar(); edAjustes(); toast('PIN sacado.');
          };
          document.getElementById('p-new').onclick = () => {
            cerrar();
            setTimeout(() => pantallaPin('nuevo', ok2 => { edAjustes(); if(ok2) toast('PIN cambiado.'); }), 260);
          };
        });
    });
  } else {
    cerrar();
    setTimeout(() => pantallaPin('nuevo', ok => { edAjustes(); if(ok) toast('Listo, ya tenés PIN.'); }), 260);
  }
}

/* al arrancar: si hay PIN y venció el plazo, tapar todo hasta que lo pongan */
if(hayPin() && !pinVigente()) pantallaPin('abrir');

/* ===================== ¿HAY VERSIÓN NUEVA? ===================== */
const K_VER_CHK = 'taller_lb_ver_chk';
async function mirarVersion(forzar){
  /* abierta como archivo local no hay nada que consultar */
  if(!/^https?:$/.test(location.protocol)) return;
  try{
    const ult = +localStorage.getItem(K_VER_CHK) || 0;
    if(!forzar && Date.now() - ult < 6 * 3600 * 1000) return;
    localStorage.setItem(K_VER_CHK, Date.now());
    const r = await fetch(location.pathname + '?chk=' + Date.now(), {cache:'no-store'});
    if(!r.ok) return;
    const txt = await r.text();
    const m = txt.match(/APP_VER\s*=\s*(\d+)/);
    if(!m) return;
    const alla = +m[1];
    if(alla > APP_VER) mostrarAvisoVersion(alla);
  }catch(e){ /* sin internet: no pasa nada */ }
}
function actualizarA(n){
  try{ localStorage.setItem('taller_lb_ver_puesta', n); }catch(e){}
  location.replace(location.pathname + '?v=' + n);
}
function ocupado(){
  /* está cargando algo: no cortarle el trabajo */
  return !document.getElementById('sheet').hidden || !!document.querySelector('.pinwrap');
}
function mostrarAvisoVersion(n){
  if(document.getElementById('vernueva')) return;
  if(!ocupado()){ actualizarA(n); return; }     // libre: se pone al día sola

  /* si está en medio de algo, espera a que termine y ahí se actualiza */
  const d = document.createElement('div');
  d.id = 'vernueva'; d.className = 'vernueva';
  d.innerHTML = `<div><b>Hay una versión nueva</b><br>Se pone al día en cuanto termines. No perdés nada.</div>
    <button id="ver-ok">Ahora</button>`;
  document.body.appendChild(d);
  document.getElementById('ver-ok').onclick = () => actualizarA(n);
  const esperar = setInterval(() => {
    if(!ocupado()){ clearInterval(esperar); actualizarA(n); }
  }, 2000);
}

/* al volver de actualizar, avisa qué pasó */
try{
  const puesta = localStorage.getItem('taller_lb_ver_puesta');
  if(puesta && +puesta <= APP_VER){
    localStorage.removeItem('taller_lb_ver_puesta');
    setTimeout(() => toast('La app se puso al día sola. Mirá Novedades.'), 1500);
  }
}catch(e){}
setTimeout(() => mirarVersion(false), 4000);
</script>

<script>
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persisted().then(ok => { if (!ok) navigator.storage.persist(); });
}
</script>
